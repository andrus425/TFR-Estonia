l_english:
 TFR_EST_ratas_renew_agreement:0 "Renew the 2019 Coalition Agreement"
 TFR_EST_ratas_renew_agreement_desc:0 "Jüri Ratas has chosen to remain prime minister. Centre, Isamaa and EKRE must now agree which unfinished commitments they will carry through the remainder of the parliamentary term. Publish a legislative and funding programme, keep the investigation independent, and return ministers to the practical work promised in 2019. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_renew_agreement_reward_tt:0 "National cohesion: +2.\nGain 25 political power."
 TFR_EST_ratas_family_home_guarantees:0 "KredEx Guarantees for Family Homes"
 TFR_EST_ratas_family_home_guarantees_desc:0 "Extend the coalition's promised housing guarantees for young and large families. KredEx should support viable home purchases and renovation, with income checks and clear limits on public exposure. A guarantee helps a household obtain a loan; it does not make the state the owner of every home. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_family_home_guarantees_reward_tt:0 "Budget: €35 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_child_tax_allowance:0 "A Larger Child-Based Tax Allowance"
 TFR_EST_ratas_child_tax_allowance_desc:0 "Bring forward the coalition agreement's child-based income-tax relief. Explain who qualifies, update the Tax and Customs Board's administration, and account for the revenue forgone. The measure offers working families predictable assistance without disguising its budget cost. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_child_tax_allowance_reward_tt:0 "Budget: €30 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_home_care:0 "Home Nursing Instead of an Institution"
 TFR_EST_ratas_home_care_desc:0 "The 2019 agreement promises more support for people who need nursing and everyday care. Fund municipal home services and coordinate them with family doctors so relatives are not forced to carry every responsibility alone. Contracts must specify staffing and access beyond the largest towns. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_home_care_reward_tt:0 "Budget: €35 million, financed through public debt.\nNational cohesion: +4."
 TFR_EST_ratas_state_jobs_counties:0 "Move 1,000 State Jobs Beyond Tallinn"
 TFR_EST_ratas_state_jobs_counties_desc:0 "Continue the agreement's plan to move one thousand state jobs outside the capital. Select functions that can operate reliably in the counties, provide secure connections, and support staff through the transition. The programme redistributes public employment; it does not create a thousand additional posts. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_state_jobs_counties_reward_tt:0 "Budget: €25 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_rural_broadband:0 "The Last Mile of Rural Broadband"
 TFR_EST_ratas_rural_broadband_desc:0 "Fund the fixed-network connections promised to rural homes and businesses. Work with municipalities and network operators to reach settlements where commercial deployment alone is insufficient. Reliable connections support remote work, schools and public services when travel is disrupted. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_rural_broadband_reward_tt:0 "Budget: €50 million, financed through public debt.\nResearch speed: +1%."
 TFR_EST_ratas_industrial_parks:0 "Serviced Industrial Parks in the Counties"
 TFR_EST_ratas_industrial_parks_desc:0 "Prepare regional industrial sites with access, utilities and transparent tenancy rules, as envisaged in the coalition agreement. Support local production and employment without promising that one government programme can replace every private investment decision. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_industrial_parks_reward_tt:0 "Budget: €80 million, financed through public debt.\nFactory output: +1.5%."
 TFR_EST_ratas_worker_retraining:0 "Retraining for Estonia's Working Adults"
 TFR_EST_ratas_worker_retraining_desc:0 "Connect the agreement's adult-learning commitment to real employer demand. Offer retraining in technical, care and digital occupations, with places for workers affected by regional industrial change. Training providers must report completion and employment outcomes. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_worker_retraining_reward_tt:0 "Budget: €35 million, financed through public debt.\nProduction efficiency growth: +1.5%."
 TFR_EST_ratas_hospital_covid:0 "County Hospitals Need COVID Wards"
 TFR_EST_ratas_hospital_covid_desc:0 "Put the cabinet's December 2020 health-system plan into operation under the renewed coalition. Finance isolation capacity, oxygen supplies, protective equipment and reserve staffing in county hospitals. These measures respond to an outbreak already present in Estonia; ordinary care must remain available alongside them. The original three-party cabinet must hold at least 51 coalition seats. Requires COVID cases in Estonia. If the outbreak has already recovered, this emergency measure is bypassed without its reward."
 TFR_EST_ratas_hospital_covid_reward_tt:0 "Budget: €60 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_testing_tracing:0 "Keep Testing and Contact Tracing Working"
 TFR_EST_ratas_testing_tracing_desc:0 "Fund laboratories, sample collection and the Health Board's tracing teams in line with the December 2020 plan. Testing only helps if results reach patients and contacts promptly. Coordinate local staffing and clear public instructions while protecting the information collected during the response. The original three-party cabinet must hold at least 51 coalition seats. Requires COVID cases in Estonia. If the outbreak has already recovered, this emergency measure is bypassed without its reward."
 TFR_EST_ratas_testing_tracing_reward_tt:0 "Budget: €35 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_family_doctors:0 "Family Doctors in the Evening and at Weekends"
 TFR_EST_ratas_family_doctors_desc:0 "Implement the coalition agreement's promise of better access to primary care outside ordinary working hours. Arrange evening and weekend appointments, referral advice and cooperation with county hospitals. This service commitment remains useful after the immediate pandemic emergency has passed. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_family_doctors_reward_tt:0 "Budget: €40 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_ratas_vaccinate_risk_groups:0 "Vaccinate Risk Groups Through Family Doctors"
 TFR_EST_ratas_vaccinate_risk_groups_desc:0 "Carry out the vaccination plan prepared in December 2020: prioritize risk groups, coordinate care homes and family doctors, and maintain the cold chain and appointment records. A practical rollout can ease the current outbreak. It cannot promise an immediate end to every future infection. The original three-party cabinet must hold at least 51 coalition seats. Requires COVID cases in Estonia. If the outbreak has already recovered, this emergency measure is bypassed without its reward."
 TFR_EST_ratas_vaccinate_risk_groups_reward_tt:0 "Budget: €45 million, financed through public debt.\nNational cohesion: +3.\nImprove an existing COVID severity by one level. Remove the lowest level only if it is Estonia's own seeded outbreak."
 TFR_EST_ratas_lng_connection:0 "Finance an Estonian LNG Connection"
 TFR_EST_ratas_lng_connection_desc:0 "Develop the agreement's proposal for a regional LNG terminal in Estonia. Finance connection studies, access arrangements and a practical share of the enabling works. Diversified supply can cushion the Saudi-war energy shock; this programme does not finish an entire terminal in thirty-five days. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_lng_connection_reward_tt:0 "Budget: €80 million, financed through public debt.\nWhile TFR's Saudi-war energy crisis is active, reduce Estonia's factory-output penalty by 1 percentage point."
 TFR_EST_ratas_grid_synchronisation:0 "Fund European-Grid Synchronisation"
 TFR_EST_ratas_grid_synchronisation_desc:0 "Maintain financing and coordination for the coalition's promised connection to the European electricity system. Work with grid operators and Baltic partners on equipment, reserve requirements and the transition programme. The focus advances a long project rather than declaring immediate synchronisation. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_grid_synchronisation_reward_tt:0 "Budget: €70 million, financed through public debt.\nDefense readiness: +3.\nWhile the energy crisis is active, reduce Estonia's factory-output penalty by 1 percentage point."
 TFR_EST_ratas_renewable_chp:0 "Renewable Heat and Power for Towns"
 TFR_EST_ratas_renewable_chp_desc:0 "Support efficient combined heat and power using suitable local renewable fuels, following the coalition's energy commitments. Assess fuel supply and district-heating demand before approving projects. Reliable local heat and generation reduce exposure to disrupted imported energy. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_renewable_chp_reward_tt:0 "Budget: €55 million, financed through public debt.\nWhile the energy crisis is active, reduce Estonia's factory-output penalty by 1 percentage point."
 TFR_EST_ratas_building_renovation:0 "Renovation Grants for Warm Homes"
 TFR_EST_ratas_building_renovation_desc:0 "Expand the building-renovation grants promised in the agreement. Insulation, efficient heating and sound project supervision can reduce household energy use for years. Prioritize viable apartment-building projects and make assistance accessible outside Tallinn. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_building_renovation_reward_tt:0 "Budget: €55 million, financed through public debt.\nConstruction speed: +1%. While the energy crisis is active, reduce its consumer-goods penalty by 1.5 percentage points."
 TFR_EST_ratas_network_charge_relief:0 "Temporary Electricity Network-Charge Relief"
 TFR_EST_ratas_network_charge_relief_desc:0 "Use the coalition agreement's network-charge proposal to cushion household and enterprise bills during the energy shock. Authorize a funded relief reserve that activates when supplies are disrupted. This concerns network charges, separately from the electricity excise cut enacted in the opening programme. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_network_charge_relief_reward_tt:0 "Budget: €45 million, financed through public debt.\nNational cohesion: +3.\nWhile the energy crisis is active, reduce its consumer-goods penalty by 1.5 percentage points. Preparation remains effective if the crisis begins later."
 TFR_EST_ratas_police_reserve:0 "A Police and Border-Guard Crisis Reserve"
 TFR_EST_ratas_police_reserve_desc:0 "Organize the police and border-guard reserve envisaged in the coalition agreement. Recruit and train suitable volunteers, specify command responsibilities, and rehearse support to regular officers. The reserve assists lawful emergency duties rather than creating an additional field army. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_police_reserve_reward_tt:0 "Budget: €30 million, financed through public debt.\nDefense readiness: +5."
 TFR_EST_ratas_territorial_training:0 "Conscript and Kaitseliit Training Places"
 TFR_EST_ratas_territorial_training_desc:0 "Fund the coalition's commitment to conscript training and the Defence League. Improve instructor availability, training schedules and coordination with employers. The programme strengthens readiness within existing recruitment and equipment limits. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_territorial_training_reward_tt:0 "Budget: €40 million, financed through public debt.\nDefense readiness: +6.\nArmy training time: −2%. No free divisions, manpower or equipment."
 TFR_EST_ratas_account_to_voters:0 "Account for the Coalition's Promises"
 TFR_EST_ratas_account_to_voters_desc:0 "Present the results of the renewed coalition programme to the Riigikogu and the public. Explain the commitments fulfilled, the costs incurred and the emergency measures that still require review. The next regular parliamentary election remains in March 2023; completing this report neither calls an early vote nor guarantees another Centre-led cabinet. The original three-party cabinet must hold at least 51 coalition seats."
 TFR_EST_ratas_account_to_voters_reward_tt:0 "National cohesion: +4.\nGain 50 political power. Preserve the regular election calendar."
 TFR_EST_ratas_energy_title:0 "The Energy Shock Reaches Estonia"
 TFR_EST_ratas_energy_desc:0 "The Saudi civil war is disrupting international energy supplies. Estonia must protect essential services and help firms absorb higher costs. The Oil Crash national spirit disrupts production, construction, public confidence and household spending. Funded LNG, grid, local-generation, renovation and network-charge measures each advance recovery by one stage. Completing the energy response removes the spirit even while the wider supply shock continues. These measures support Estonia while the wider crisis follows its own course."
 TFR_EST_ratas_energy_option:0 "Review supply security and household bills."
