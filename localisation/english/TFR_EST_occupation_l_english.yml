l_english:
 TFR_EST_autonomy_occupation:0 "Protected occupation administration"
 TFR_EST_autonomy_occupation_desc:0 "Estonia's civilian administration retains Northern Estonia throughout supported settlements. Ordinary autonomy changes cannot annex this country. Sovereignty returns through a liberation settlement or the restoration compact."
 TFR_EST_communist_council:0 "Estonian Reconstruction Council"
 TFR_EST_military_council:0 "Estonian Security Directorate"
 TFR_EST_eurasian_council:0 "Estonian Eurasian Council"
 TFR_EST_baltic_council:0 "Estonian Baltic Administration"
 TFR_EST_european_authority:0 "Estonian Occupation Authority"
 TFR_EST_civil_administration:0 "Estonian Civil Administration"
 TFR_EST_occupation_category:0 "Estonia under occupation"
 TFR_EST_occupation_category_desc:0 "Normal parliamentary elections are suspended. Our administration remains playable in Northern Estonia.\n\nWeeks under the current settlement: [?TFR_EST_occupation_weeks|0]\nAdministrative cooperation: [?TFR_EST_occupation_cooperation|0]/100\nRestoration networks: [?TFR_EST_occupation_resistance|0]/100\n\nCollaboration or clandestine organization adds 0.5 points each week to its corresponding track. A liberal or supervised administration may negotiate independence after 52 weeks with 60 cooperation, 60 cohesion and 40 readiness. Other administrations require the patron's military collapse. Territorial recovery follows the wider peace settlement."
 TFR_EST_occupation_mandate:0 "Restricted Sovereignty"
 TFR_EST_occupation_mandate_desc:0 "The occupying power controls foreign policy and national elections. A protected administration in Tallinn provides a continuous government, but public authority and military recruitment remain constrained."
 TFR_EST_occupation_local_services:0 "Municipal Continuity"
 TFR_EST_occupation_local_services_desc:0 "Civil registries, schools and emergency services operate across our remaining territory even while constitutional politics are suspended."
 TFR_EST_occupation_recovery:0 "Reconstruction Directorate"
 TFR_EST_occupation_recovery_desc:0 "Repair crews prioritize infrastructure and restart civilian production. The directorate survives a change of administration because the recovered expertise belongs to Estonia."
 TFR_EST_occupation_limited_forces:0 "Limited Territorial Forces"
 TFR_EST_occupation_limited_forces_desc:0 "A negotiated mandate permits a small local security and defense force. Units still require Estonia's manpower, equipment and training."
 TFR_EST_occupation_collaboration:0 "Administrative Accommodation"
 TFR_EST_occupation_collaboration_desc:0 "Officials cooperate with the patron to preserve services and obtain concessions. Cooperation rises by 0.5 each week; this arrangement does not itself restore elected government."
 TFR_EST_occupation_clandestine_network:0 "Restoration Networks"
 TFR_EST_occupation_clandestine_network_desc:0 "Civil networks preserve independent institutions and records. Their strength rises by 0.5 each week, with a risk of searches and repression once organization reaches 40."
 TFR_EST_occupation_civilian_compact:0 "Civilian Administration Compact"
 TFR_EST_occupation_civilian_compact_desc:0 "Local officials secure written limits on interference and maintain an Estonian administrative chain of command."
 TFR_EST_occupation_social_guarantees:0 "Social Guarantees"
 TFR_EST_occupation_social_guarantees_desc:0 "The administration protects basic public services. The patron's economic framework remains in force, and these guarantees require continuing expenditure."
 TFR_EST_occupation_security_compact:0 "Security Mandate"
 TFR_EST_occupation_security_compact_desc:0 "Local units gain a defined defensive role while their supervision remains a source of public tension."
 tfr_estonia_occupation.2.t:0 "Government after Defeat"
 tfr_estonia_occupation.2.d:0 "Defeat has placed Estonia under an occupation administration. The Riigikogu's party ledger is preserved, but ordinary elections and independent foreign policy are suspended. Tallinn remains the seat of a playable Estonian government.\n\nOur immediate tasks are to preserve civilian services, negotiate the permissible role of local forces and decide how to pursue a future restoration. Cooperation can win concessions; underground organization carries the risk of repression. The administration's mandate depends on the political order of the occupying power."
 tfr_estonia_occupation.2.a:0 "Preserve the institutions that remain."
 tfr_estonia_occupation.3.t:0 "Searches and Detentions"
 tfr_estonia_occupation.3.d:0 "Security officials have detected part of the restoration network. Municipal offices and veterans' associations face searches, and several organizers are in detention. The administration must decide whether to sacrifice exposed cells to protect the wider organization or risk an open confrontation over the detainees."
 tfr_estonia_occupation.3.a:0 "Protect the remaining network."
 tfr_estonia_occupation.3.b:0 "Defend the detainees in public."
 tfr_estonia_occupation.4.t:0 "The Sovereignty Petition"
 tfr_estonia_occupation.4.d:0 "Our delegates have presented the restoration compact. Its practical success rests on the patron's condition and the institutions rebuilt at home. If the settlement still meets the requirements for independence, executive authority can return to an Estonian caretaker cabinet. Otherwise the delegation must return to negotiations without a constitutional breakthrough."
 tfr_estonia_occupation.4.a:0 "Ratify the restoration compact."
 tfr_estonia_occupation.4.b:0 "The mandate has not yet changed."
 tfr_estonia_occupation.5.t:0 "Constitutional Authority Restored"
 tfr_estonia_occupation.5.d:0 "Independent constitutional government has resumed. A caretaker cabinet will maintain services until a national election within ninety days. Completed public reforms and reconstructed institutions remain in place. The final territorial settlement still depends on the wider conflict; independence does not automatically return every disputed region."
 tfr_estonia_occupation.5.a:0 "Prepare an accountable government."
 TFR_EST_occupation_can_restore_tt:0 "The patron has capitulated, or the restoration compact is complete and the patron is collapsing militarily. Liberal and supervised administrations may also qualify peacefully after 52 weeks with 60 cooperation, 60 cohesion and 40 readiness."
 TFR_EST_occupation_transition:0 "An Administration in Tallinn"
 TFR_EST_occupation_transition_desc:0 "The state has survived defeat, but its mandate is constrained by an occupying power. Keep the civil service working while preparing a durable political settlement."
 TFR_EST_occupation_municipal_services:0 "Keep the Municipalities Working"
 TFR_EST_occupation_municipal_services_desc:0 "Schools, hospitals and emergency response need a consistent civilian chain of command. Reestablish local service boards across the territory we still govern."
 TFR_EST_occupation_rebuild:0 "Repair the Lifelines"
 TFR_EST_occupation_rebuild_desc:0 "A damaged economy cannot support either accommodation or resistance. Reopen transport links, restore utilities and employ local repair crews. This commits EUR 250 million to reconstruction."
 TFR_EST_occupation_employment:0 "A Civilian Recovery Program"
 TFR_EST_occupation_employment_desc:0 "Provide work in civilian production and use recovered industrial land in Northern Estonia. The EUR 350 million program adds one civilian factory if the state remains under our control."
 TFR_EST_occupation_security:0 "Define the Security Mandate"
 TFR_EST_occupation_security_desc:0 "Negotiate rules for local officers, the protection of civilian buildings and the supervision of public order. Restoring predictability comes before expanding force strength."
 TFR_EST_occupation_local_forces:0 "Permitted Territorial Forces"
 TFR_EST_occupation_local_forces_desc:0 "Secure permission to recruit and train a limited territorial force. This improves organization; all units must still be equipped and staffed from our own resources."
 TFR_EST_occupation_returned_officers:0 "An Estonian Officer Cadre"
 TFR_EST_occupation_returned_officers_desc:0 "Recover service records and assign qualified officers to training and logistics. Preserve an institutional memory that can serve a future independent army."
 TFR_EST_occupation_assembly:0 "A Local Consultative Assembly"
 TFR_EST_occupation_assembly_desc:0 "Even without free national elections, local representatives can scrutinize services and make Estonian needs visible. The assembly is advisory and does not replace the suspended Riigikogu."
 TFR_EST_occupation_communist_mandate:0 "A Socialist Reconstruction Mandate"
 TFR_EST_occupation_communist_mandate_desc:0 "The new socialist order demands political alignment. Negotiate an Estonian reconstruction mandate that protects civilian expertise while the parent administration determines the party leadership."
 TFR_EST_occupation_communist_program:0 "Labor Councils and Services"
 TFR_EST_occupation_communist_program_desc:0 "Public services and workplace councils become the administration's organizing institutions. Commit resources to social provision without promising a return to parliamentary competition."
 TFR_EST_occupation_communist_charter:0 "Guarantees for Local Institutions"
 TFR_EST_occupation_communist_charter_desc:0 "Obtain written protections for schools, registries and local administration within the occupation framework."
 TFR_EST_occupation_civilian_mandate:0 "A Civilian Russian Administration"
 TFR_EST_occupation_civilian_mandate_desc:0 "A civilian authoritarian patron offers stability on its own terms. Preserve an Estonian civil service while negotiating the limits of central oversight."
 TFR_EST_occupation_civilian_program:0 "Regional Investment Bargains"
 TFR_EST_occupation_civilian_program_desc:0 "Seek investment for utilities and regional employment in exchange for predictable administration. Public acceptance depends on tangible results."
 TFR_EST_occupation_civilian_charter:0 "An Administrative Autonomy Statute"
 TFR_EST_occupation_civilian_charter_desc:0 "Record a limited autonomy statute. It improves the administration's position but neither removes the patron nor restores national elections."
 TFR_EST_occupation_military_mandate:0 "Under the Security Directorate"
 TFR_EST_occupation_military_mandate_desc:0 "A military or nationalist occupation places security before constitutional politics. Establish lines of responsibility that prevent local services from being absorbed into military command."
 TFR_EST_occupation_military_program:0 "A Territorial Security Compact"
 TFR_EST_occupation_military_program_desc:0 "Train local forces for clearly defined defensive tasks. Keep their equipment and manpower obligations separate from the patron's formations."
 TFR_EST_occupation_military_charter:0 "Civil Authority beneath the Command"
 TFR_EST_occupation_military_charter_desc:0 "Seek a protected civil sphere for schools, courts and municipalities. Every concession remains vulnerable to the commanding authority."
 TFR_EST_occupation_eurasian_mandate:0 "The Eurasian Administrative Order"
 TFR_EST_occupation_eurasian_mandate_desc:0 "The Eurasian order requires political and cultural alignment with the patron. The administration's first task is to preserve the institutions through which Estonian society can continue to function."
 TFR_EST_occupation_eurasian_program:0 "Protect the Local Cultural Sphere"
 TFR_EST_occupation_eurasian_program_desc:0 "Negotiate room for local education and public services within the patron's ideological program. These concessions cost resources and political capital."
 TFR_EST_occupation_eurasian_charter:0 "A Local Charter within the Empire"
 TFR_EST_occupation_eurasian_charter_desc:0 "An administrative charter provides limited local continuity. It does not imply approval of the occupation or a democratic electoral mandate."
 TFR_EST_occupation_baltic_mandate:0 "Estonia beside the Baltic Federation"
 TFR_EST_occupation_baltic_mandate_desc:0 "A liberal Russian victory may organize the wider region as a Baltic federation. Estonia retains its own administration alongside that structure rather than disappearing into it."
 TFR_EST_occupation_baltic_program:0 "A Baltic Reconstruction Agreement"
 TFR_EST_occupation_baltic_program_desc:0 "Coordinate trade and infrastructure with neighboring administrations. The EUR 150 million agreement seeks access to reconstruction expertise without merging the Estonian state."
 TFR_EST_occupation_baltic_charter:0 "An Estonian Sovereignty Clause"
 TFR_EST_occupation_baltic_charter_desc:0 "Put the right to seek restored sovereignty into the administrative settlement. A peaceful exit still requires strong institutions and cooperation."
 TFR_EST_occupation_supervised_mandate:0 "A European Supervisory Mandate"
 TFR_EST_occupation_supervised_mandate_desc:0 "A European supervisory authority seeks a stable local administration. Preserve accountable records and a clear distinction between supervision and independent elected authority."
 TFR_EST_occupation_supervised_program:0 "Civilian Oversight and Reconstruction"
 TFR_EST_occupation_supervised_program_desc:0 "Place reconstruction accounts and public procurement under civilian scrutiny. A credible administration can bargain for an eventual end to supervision."
 TFR_EST_occupation_supervised_charter:0 "A Schedule for Constitutional Return"
 TFR_EST_occupation_supervised_charter_desc:0 "Agree a framework for constitutional return. Independence requires the restoration compact and measurable administrative readiness."
 TFR_EST_occupation_european_authoritarian_mandate:0 "An Authoritarian European Authority"
 TFR_EST_occupation_european_authoritarian_mandate_desc:0 "An authoritarian European victory places Estonia alongside a regional occupation structure. Northern Estonia remains a separate administration directly answerable to the victorious power."
 TFR_EST_occupation_european_authoritarian_program:0 "Local Services under Occupation"
 TFR_EST_occupation_european_authoritarian_program_desc:0 "Keep schools, utilities and public health working while negotiating the restrictions imposed by the occupying authority."
 TFR_EST_occupation_european_authoritarian_charter:0 "A Defensive Administrative Charter"
 TFR_EST_occupation_european_authoritarian_charter_desc:0 "Secure limits on the use of local forces and protect civilian administrative functions. A strong patron will still refuse an independent constitutional settlement."
 TFR_EST_occupation_accommodation:0 "Administrative Accommodation"
 TFR_EST_occupation_accommodation_desc:0 "Work within the imposed administration to secure services and political concessions. Cooperation grows gradually; it can support a peaceful sovereignty petition under liberal or supervised mandates."
 TFR_EST_occupation_clandestine:0 "Preserve a Restoration Network"
 TFR_EST_occupation_clandestine_desc:0 "Build discreet civilian networks, retain constitutional records and protect the people who could rebuild independent institutions. Exposure can lead to searches and detentions."
 TFR_EST_occupation_guarantees:0 "Negotiated Civilian Guarantees"
 TFR_EST_occupation_guarantees_desc:0 "Convert administrative cooperation into written commitments on services, civil registries and local accountability. These guarantees improve public confidence while sovereignty remains restricted."
 TFR_EST_occupation_exile_charter:0 "A Charter for Constitutional Restoration"
 TFR_EST_occupation_exile_charter_desc:0 "Agree a common charter with surviving democratic institutions and representatives abroad. No normal political party is treated as an automatic collaborator; the restored constitution will return competition to the electorate."
 TFR_EST_occupation_restoration_compact:0 "The Restoration Compact"
 TFR_EST_occupation_restoration_compact_desc:0 "Prepare the institutions, records and personnel for a return to constitutional government. A liberal or supervised patron may accept a petition after a year of credible administration. A coercive patron requires military collapse before the compact can take effect."
 TFR_EST_occupation_constitutional_return:0 "Restore Constitutional Authority"
 TFR_EST_occupation_constitutional_return_desc:0 "End the occupation mandate when the compact is enforceable. A caretaker government will prepare a national election within ninety days. Borders follow the wider settlement and are not automatically restored by this focus."
 TFR_EST_occupation_service_relief:0 "Emergency Service Grants"
 TFR_EST_occupation_service_relief_desc:0 "Commit EUR 50 million to local healthcare and essential services. This raises cohesion by 3 and administrative cooperation by 5. Available every sixty days after municipal services are organized."
 TFR_EST_occupation_training:0 "Fund Permitted Local Training"
 TFR_EST_occupation_training_desc:0 "Commit EUR 60 million to training and logistics for the permitted territorial forces. Readiness rises by 4; the decision grants no units or equipment. Available every ninety days."
 TFR_EST_occupation_cooperation:0 "Negotiate Administrative Concessions"
 TFR_EST_occupation_cooperation_desc:0 "Use administrative cooperation to protect local authority. Cooperation rises by 8 at the cost of 2 cohesion. Available every sixty days under an accommodation program."
 TFR_EST_occupation_network:0 "Protect Constitutional Records"
 TFR_EST_occupation_network_desc:0 "Commit EUR 20 million to safeguard service records and constitutional documents. Restoration networks gain 8 strength and cohesion rises by 2. Strong networks invite periodic security searches."
 TFR_EST_occupation_petition:0 "Petition for Restored Sovereignty"
 TFR_EST_occupation_petition_desc:0 "Present the completed restoration compact. Requirements are checked again when the delegation returns. Independence resumes constitutional politics and schedules an election within ninety days, while territory follows the wider settlement."
 tfr_estonia_occupation.11.t:0 "Who Appoints the Workplace Councils?"
 tfr_estonia_occupation.11.d:0 "Reconstruction has reopened several workplaces, but the patron's political representatives want control over appointments to the labor councils. Local organizers argue that qualified workers and municipal officials should choose the delegates. The dispute now threatens to delay public services."
 tfr_estonia_occupation.11.a:0 "Retain local appointments."
 tfr_estonia_occupation.11.b:0 "Accept the supervisory nominees."
 tfr_estonia_occupation.12.t:0 "The Regional Investment Conditions"
 tfr_estonia_occupation.12.d:0 "The promised investment package includes a requirement that key procurement and utility contracts pass through the patron's regional authority. Our civil servants can obtain a larger immediate grant by accepting those conditions, or defend a smaller program under local supervision."
 tfr_estonia_occupation.12.a:0 "Keep the contracts under local scrutiny."
 tfr_estonia_occupation.12.b:0 "Accept the regional authority's terms."
 tfr_estonia_occupation.13.t:0 "Civilian Services or Command Resources?"
 tfr_estonia_occupation.13.d:0 "The security command has requested vehicles and staff assigned to municipal emergency services. Local officers warn that surrendering them will weaken public health and winter response. Refusing the request could jeopardize the limited military training mandate."
 tfr_estonia_occupation.13.a:0 "Protect municipal emergency capacity."
 tfr_estonia_occupation.13.b:0 "Meet the command's requisitions."
 tfr_estonia_occupation.14.t:0 "The School Charter Dispute"
 tfr_estonia_occupation.14.d:0 "The Eurasian authority wants the new school charter to give its supervisory board control over teaching appointments. Administrators propose retaining an Estonian civilian appointment process while accepting the patron's mandatory framework. The decision will shape public confidence in the entire reconstruction program."
 tfr_estonia_occupation.14.a:0 "Defend the civilian appointment process."
 tfr_estonia_occupation.14.b:0 "Accept the supervisory board."
 tfr_estonia_occupation.15.t:0 "A Common Market, a Separate Administration"
 tfr_estonia_occupation.15.d:0 "The Baltic reconstruction agreement offers useful access to neighboring markets, but the regional authority proposes merging several registries and procurement boards. Our delegation must decide how much administrative control to share while Estonia's sovereignty clause is still being negotiated."
 tfr_estonia_occupation.15.a:0 "Retain separate national registries."
 tfr_estonia_occupation.15.b:0 "Share the boards for immediate access."
 tfr_estonia_occupation.16.t:0 "The Reconstruction Accounts"
 tfr_estonia_occupation.16.d:0 "A supervisory review has identified emergency contracts that bypassed normal procurement. Local representatives want an independent public inquiry. Supervisors offer to close the issue quietly if the administration accepts tighter external control over future spending."
 tfr_estonia_occupation.16.a:0 "Authorize a public civilian inquiry."
 tfr_estonia_occupation.16.b:0 "Accept external control to release the funds."
 tfr_estonia_occupation.17.t:0 "A Regional Authority's Security Demand"
 tfr_estonia_occupation.17.d:0 "The regional occupation authority has asked Estonia to surrender control of a local security office and its personnel records. Municipal officials fear the loss of the safeguards negotiated in the administrative charter. Compliance could secure additional resources for the permitted territorial forces."
 tfr_estonia_occupation.17.a:0 "Keep the local office under its charter."
 tfr_estonia_occupation.17.b:0 "Hand the office to the occupation authority."
