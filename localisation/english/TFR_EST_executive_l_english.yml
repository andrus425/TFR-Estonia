 TFR_EST_kersti_kaljulaid:0 "Kersti Kaljulaid"
 TFR_EST_kersti_kaljulaid_desc:0 "President of the Republic\n\nKersti Kaljulaid represents Estonia and safeguards constitutional procedure. The prime minister directs government policy with the confidence of the Riigikogu. Cabinet changes do not replace the independently elected president."
 TFR_EST_alar_karis:0 "Alar Karis"
 TFR_EST_alar_karis_desc:0 "President of the Republic\n\nAlar Karis holds the constitutional presidency following the conclusion of Kersti Kaljulaid’s term. The prime minister and parliamentary cabinet remain responsible for executive policy."
 TFR_EST_pm_unconfirmed:0 "Awaiting cabinet confirmation"
 TFR_EST_hog_caretaker_status:0 "§YCaretaker cabinet§! — continues in office pending parliamentary confirmation."
 TFR_EST_hog_confirmed_status:0 "Cabinet in office — responsible to the Riigikogu."
 TFR_EST_martin_helme:0 "Martin Helme"
 TFR_EST_martin_helme_desc:0 "EKRE's chairman at the 2023 election, Martin Helme leads the party's elected government after parliamentary confirmation. A former finance minister, he takes responsibility for the cabinet's programme while the president retains the constitutional head-of-state role."
