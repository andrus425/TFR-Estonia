l_english:
 TFR_EST_pp_2023_new_mandate:0 "A Parempoolsed Mandate for a Capable State"
 TFR_EST_pp_2023_new_mandate_desc:0 "The new majority must reconcile a smaller civilian state with stronger defence. Parliament will scrutinize the funding and consequences of each reform."
 TFR_EST_pp_2023_defence_commitment:0 "Fund the Three-Percent Defence Investment Agreement"
 TFR_EST_pp_2023_defence_commitment_desc:0 "Approve the opening procurement tranche of a cross-party defence agreement. Allied reception remains a separate funding commitment."
 TFR_EST_pp_2023_air_defence:0 "Train Air-Defence Crews and Procure Communications"
 TFR_EST_pp_2023_air_defence_desc:0 "Use the investment plan to prepare sites, train crews and purchase compatible communications. Delivering a functioning capability requires sustained procurement."
 TFR_EST_pp_2023_reserve_muster:0 "Open Defence Roles to More Skills"
 TFR_EST_pp_2023_reserve_muster_desc:0 "Revise service rules and exercise existing call-up plans. Civilian specialists, alternative service and voluntary service can fill genuine capability gaps."
 TFR_EST_pp_2023_civil_reserve:0 "Organize the Ten-Thousand-Person Civil Reserve"
 TFR_EST_pp_2023_civil_reserve_desc:0 "Begin registering and training a nonmilitary reserve toward the proposed ten-thousand-person objective. Skills and civilian availability must be verified."
 TFR_EST_pp_2023_allied_reception:0 "Fund Allied Reception Outside the Defence Baseline"
 TFR_EST_pp_2023_allied_reception_desc:0 "Prepare routes and dispersed stores with the allies available to Estonia. Reception funding supports the reinforcement agreements that actually exist."
 TFR_EST_pp_2023_service_continuity:0 "Exercise Estonia's Essential Services in Isolation"
 TFR_EST_pp_2023_service_continuity_desc:0 "Test dispersed stocks, emergency communications and private suppliers. Ministries must show how essential services would function while outside connections are interrupted."
 TFR_EST_pp_2023_industrial_guarantees:0 "Open Defence Suppliers' Access to Capital"
 TFR_EST_pp_2023_industrial_guarantees_desc:0 "Use competitive loan and equity finance for private suppliers. Procurement contracts specify deliverables, investment risk and the limits of public participation."
 TFR_EST_pp_2023_ammunition_workshop:0 "Contract a Domestic Ammunition Production Line"
 TFR_EST_pp_2023_ammunition_workshop_desc:0 "Finance tooling against an inspected supply contract with domestic industry. The production line still needs materials, workers and ordinary military orders."
 TFR_EST_pp_2023_maintenance_workshop:0 "Contract Military Servicing and Component Capacity"
 TFR_EST_pp_2023_maintenance_workshop_desc:0 "Purchase overhaul tooling and qualified component capacity from domestic suppliers. Contract inspections must demonstrate that the investment can maintain Estonia's equipment."
 TFR_EST_pp_2023_research_agreement:0 "Sign the Three-Percent Research Agreement"
 TFR_EST_pp_2023_research_agreement_desc:0 "Agree a staged public-private research programme with business organizations. Contracts define measurable innovation outcomes and the responsibilities of participating firms."
 TFR_EST_pp_2023_knowledge_transfer:0 "Tie University Funding to Knowledge Transfer"
 TFR_EST_pp_2023_knowledge_transfer_desc:0 "Commission joint university-industry development projects and publish their results. Funding rewards usable knowledge transfer rather than disconnected research and production plans."
 TFR_EST_pp_2023_skilled_migration:0 "Introduce the Skilled-Migration Points System"
 TFR_EST_pp_2023_skilled_migration_desc:0 "Create a transparent admission system for qualifications and labour-market needs. Language support and assessed security conditions accompany skilled-worker recruitment."
 TFR_EST_pp_2023_renewable_permits:0 "Clear Planning Barriers to Private Renewable Projects"
 TFR_EST_pp_2023_renewable_permits_desc:0 "Simplify spatial planning and resource permit review. Stable rules and competent decisions support private investment without introducing a new blanket generation subsidy."
 TFR_EST_pp_2023_grid_connection:0 "Co-Finance Offshore-Wind Grid Connections"
 TFR_EST_pp_2023_grid_connection_desc:0 "Prepare assessed connections and seek available European co-financing. Operators must demonstrate safe integration and credible delivery schedules for new capacity."
 TFR_EST_pp_2023_continuity_capacity:0 "Keep Dispatchable Capacity Ready During the Transition"
 TFR_EST_pp_2023_continuity_capacity_desc:0 "Fund maintenance and demand-management readiness while replacement capacity develops. Dependable existing generation remains available during the energy emergency."
 TFR_EST_pp_2023_nuclear_framework:0 "Prepare Nuclear Licensing and Independent Oversight"
 TFR_EST_pp_2023_nuclear_framework_desc:0 "Draft the rules and recruit supervisory expertise for possible private nuclear development. Licensing preparation creates no reactor or nuclear weapons."
 TFR_EST_pp_2023_renovation:0 "Simplify Residential Energy Renovation"
 TFR_EST_pp_2023_renovation_desc:0 "Coordinate renovation procedures and technical advice. Homeowners and qualified firms gain a clearer route to investments that reduce wasted heat."
 TFR_EST_pp_2023_timber_construction:0 "Specify Timber for Public Construction"
 TFR_EST_pp_2023_timber_construction_desc:0 "Qualify durable timber construction and transparent procurement criteria. Public contracts support higher-value materials while retaining safety and building-performance standards."
 TFR_EST_pp_2023_expenditure_audit:0 "Audit the State's Activities and Duplicated Agencies"
 TFR_EST_pp_2023_expenditure_audit_desc:0 "Publish service costs and review overlapping responsibilities. Ministers must identify actual savings and the services affected before presenting a revised budget."
 TFR_EST_pp_2023_supplementary_budget:0 "Pass the Negative Supplementary Budget"
 TFR_EST_pp_2023_supplementary_budget_desc:0 "Cancel reviewed low-priority spending and consolidate duplicated functions. The reduction improves the ledger but creates disputes over withdrawn public commitments."
 TFR_EST_pp_2023_transparent_budget:0 "Publish Understandable Budgets and Traceable Services"
 TFR_EST_pp_2023_transparent_budget_desc:0 "Make expenditure decisions and service progress visible to citizens. Departmental reporting must explain public costs and permit meaningful parliamentary scrutiny."
 TFR_EST_pp_2023_labour_taxes:0 "Stage the Eighteen-Percent Income Tax and Social-Tax Cap"
 TFR_EST_pp_2023_labour_taxes_desc:0 "Schedule lower income tax and a social-tax ceiling at three average wages. Record the revenue reduction alongside the expected competitiveness gain."
 TFR_EST_pp_2023_fringe_benefits:0 "Exempt Employee Transport, Meals and Health Benefits"
 TFR_EST_pp_2023_fringe_benefits_desc:0 "Remove fringe-benefit tax from specified employee costs. Publish eligibility and anti-abuse rules together with the recurring revenue reduction."
 TFR_EST_pp_2023_no_earmarks:0 "End Parliamentary Earmarks and Political Slush Funds"
 TFR_EST_pp_2023_no_earmarks_desc:0 "Replace discretionary political grants with transparent appropriations and stronger local oversight. Public money requires a defensible purpose and a visible recipient."
 TFR_EST_pp_2023_teaching_priority:0 "Direct Seventy Percent of Education Spending to Teachers"
 TFR_EST_pp_2023_teaching_priority_desc:0 "Rebalance school budgets toward teaching and give principals responsibility for rewarding performance. Training and modern learning platforms accompany the proposed pay reforms."
 TFR_EST_pp_2023_common_school:0 "Support the Common Estonian-Language School"
 TFR_EST_pp_2023_common_school_desc:0 "Fund language support and teaching materials for a shared school system. Integration must preserve teaching quality and help pupils participate in Estonian society."
 TFR_EST_pp_2023_vocational_training:0 "Commission Vocational and Mid-Career Retraining"
 TFR_EST_pp_2023_vocational_training_desc:0 "Expand assessed vocational places and competitive training contracts. Working adults need practical access to new skills while maintaining employment."
 TFR_EST_pp_2023_university_contribution:0 "Pair University Contributions with Student Assistance"
 TFR_EST_pp_2023_university_contribution_desc:0 "Introduce partial tuition with revised loans, grants and employer-paid study. Additional university resources come with public concern over affordability."
 TFR_EST_pp_2023_targeted_support:0 "Replace Blanket Benefits with Needs-Based Assistance"
 TFR_EST_pp_2023_targeted_support_desc:0 "Use safeguarded public records to direct support toward households in need. Reassessment saves expenditure but unsettles families losing universal entitlements."
 TFR_EST_pp_2023_patient_choice:0 "Open Care Contracts and Reduce Medical Paperwork"
 TFR_EST_pp_2023_patient_choice_desc:0 "Commission care competitively and expand electronic referrals with administrative support. Contracts must preserve access while clinicians spend more time treating patients."
 TFR_EST_pp_2023_account_to_parliament:0 "Present the Parempoolsed Government's Accounts"
 TFR_EST_pp_2023_account_to_parliament_desc:0 "Present defence deliveries, tax receipts and the costs of structural reform. Parliament must assess the remaining commitments before another mandate."
 TFR_EST_pp_2023_governing_tt:0 "A confirmed Parempoolsed-led cabinet has at least 51 coalition seats."
 TFR_EST_pp_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 Parempoolsed government programme."
 TFR_EST_pp_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_pp_2023_renewable_permits_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_pp_2023_grid_connection_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_pp_2023_continuity_capacity_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
