l_english:
 TFR_EST_reform_2023_new_mandate:0 "A New Reform Mandate"
 TFR_EST_reform_2023_new_mandate_desc:0 "The election has given Reform the largest delegation in the Riigikogu. Agree a programme with the parties that actually support our cabinet, placing defence, public finances and public services before the new parliament. This programme belongs to the elected government and can continue under its designated successor."
 TFR_EST_reform_2023_defence_three_percent:0 "Three Percent for National Defence"
 TFR_EST_reform_2023_defence_three_percent_desc:0 "Adopt the government's three-percent defence-spending commitment and fund the first procurement instalments. Give the Defence Forces a dependable planning horizon instead of announcing capabilities without money. The higher spending is a continuing obligation on Estonia's small economy."
 TFR_EST_reform_2023_territorial_twenty_thousand:0 "Equip a 20,000-Strong Territorial Defence"
 TFR_EST_reform_2023_territorial_twenty_thousand_desc:0 "Support the expanded territorial-defence structure through instructors, stores and reserve appointments. Kaitseliit units need reliable equipment accounting and rehearsed reporting arrangements. Fund organisation and training within existing recruitment and production; a paper establishment does not supply twenty thousand new soldiers."
 TFR_EST_reform_2023_layered_air_defence:0 "Procure Layered Air Defence"
 TFR_EST_reform_2023_layered_air_defence_desc:0 "Advance the medium-range air-defence procurement undertaken with Latvia, alongside short-range protection, radar links and trained crews. Coordinate contracts with partners able to supply them in this timeline. Procurement preparation improves the army's resilience without conjuring a battery or bypassing equipment production."
 TFR_EST_reform_2023_baltic_defence_line:0 "Prepare the Baltic Defence Line"
 TFR_EST_reform_2023_baltic_defence_line_desc:0 "Survey defensive positions and storage sites with the other Baltic states. Arrange land agreements and stockpile obstacles and construction material for a dispersed defensive line. These works strengthen planned positions; they do not make Estonia's entire border an impassable wall."
 TFR_EST_reform_2023_nursipalu:0 "Expand Nursipalu and Compensate Residents"
 TFR_EST_reform_2023_nursipalu_desc:0 "Carry out the decision to enlarge the Nursipalu training area. Finance exercises and facilities for Estonian and allied units while paying fair compensation and supporting affected municipalities. More demanding training should be accompanied by a credible agreement with the people who live beside it."
 TFR_EST_reform_2023_allied_logistics:0 "Stock the Reception Areas for Allied Forces"
 TFR_EST_reform_2023_allied_logistics_desc:0 "Prepare reception areas, transport schedules and dispersed stores for allied reinforcements. Coordinate ammunition compatibility and host-nation support with the partners available to Estonia. This improves our ability to sustain operations without duplicating allied divisions supplied by TFR's existing reinforcement decisions."
 TFR_EST_reform_2023_industrial_park:0 "Plan a Defence Industrial Park"
 TFR_EST_reform_2023_industrial_park_desc:0 "Use the national special-planning procedure to identify sites for ammunition, explosives and defence technology. Resolve access, utilities, safety distances and environmental assessment before promising production. The state prepares the site; firms still need contracts, workers and equipment."
 TFR_EST_reform_2023_ammunition_line:0 "Finance an Ammunition Production Line"
 TFR_EST_reform_2023_ammunition_line_desc:0 "Finance one first-stage ammunition workshop on a serviced defence-industry site. Pair the investment with procurement commitments and inspection capacity. This is an accelerated TFR adaptation of the industrial-park programme, not a claim that the historical park opened in thirty-five days."
 TFR_EST_reform_2023_drone_workshops:0 "Contract Domestic Drone and Repair Workshops"
 TFR_EST_reform_2023_drone_workshops_desc:0 "Place defence-industry orders for drone assembly, inspection and field repairs. Give domestic suppliers a second funded production facility while keeping designs and deliveries subject to ordinary procurement. The investment adds production capacity rather than free aircraft, ammunition or divisions."
 TFR_EST_reform_2023_grid_connection:0 "Complete the Grid's European Connection Works"
 TFR_EST_reform_2023_grid_connection_desc:0 "Fund the remaining connection and control-system works needed for a secure European electricity system. The Baltic transmission operators have already undertaken extensive preparations. Finish the practical work and strengthen reserve arrangements without assuming that every neighbouring country has followed its historical path."
 TFR_EST_reform_2023_wind_permits:0 "Clear the Wind-Power Permit Backlog"
 TFR_EST_reform_2023_wind_permits_desc:0 "Resource municipal planning teams and simplify the permit stages that delay viable wind developments. Keep the environmental assessment and local consultation that projects require. Faster decisions and stronger networks can attract new generation without declaring every proposed wind farm complete."
 TFR_EST_reform_2023_renovation:0 "Open the Regional Apartment-Renovation Round"
 TFR_EST_reform_2023_renovation_desc:0 "Continue the large apartment-building renovation programme with regional allocations. Help associations prepare technically sound insulation, heating and ventilation projects, including outside the largest cities. Lower energy demand and dependable construction contracts strengthen households and local businesses together."
 TFR_EST_reform_2023_estonian_education:0 "Fund the Transition to Estonian Education"
 TFR_EST_reform_2023_estonian_education_desc:0 "Prepare kindergartens and the first and fourth grades for the transition to Estonian-language instruction. Fund materials, language support and school-level implementation. Starting the transition is a practical programme; the full school system cannot be transformed in a single term of office."
 TFR_EST_reform_2023_ida_viru_teachers:0 "Recruit Teachers for Ida-Viru Schools"
 TFR_EST_reform_2023_ida_viru_teachers_desc:0 "Use additional pay, mentoring and teacher training to fill posts in Ida-Viru County. Schools need qualified staff who can teach their subject in Estonian and help pupils learn it. Direct resources toward the shortage instead of treating a change of classroom language as a completed staffing plan."
 TFR_EST_reform_2023_teacher_agreement:0 "Negotiate Teachers' Pay and Career Progression"
 TFR_EST_reform_2023_teacher_agreement_desc:0 "Negotiate with teachers and school owners on pay, workload and a clear career framework. Back the settlement with funding and transparent responsibilities. The real negotiations involved disputes and limited resources; an agreement must be affordable as well as attractive to the next generation of teachers."
 TFR_EST_reform_2023_learning_eighteen:0 "Keep Young People Learning Until Eighteen"
 TFR_EST_reform_2023_learning_eighteen_desc:0 "Replace the school-attendance obligation with a broader obligation to learn until eighteen. Prepare flexible general and vocational routes, guidance and municipal follow-up. The purpose is to prevent pupils leaving basic school without a useful next step, rather than merely extending time spent in a classroom."
 TFR_EST_reform_2023_vocational_places:0 "Align Vocational Places with Employer Demand"
 TFR_EST_reform_2023_vocational_places_desc:0 "Rework vocational admissions and practical courses with employers and schools. Expand places where Estonia lacks technical skills and strengthen routes into further study. Better preparation helps workshops and public services recruit qualified people without granting the state an unlimited labour reserve."
 TFR_EST_reform_2023_applied_research:0 "Build Metrosert's Applied-Research Capacity"
 TFR_EST_reform_2023_applied_research_desc:0 "Equip Metrosert's new applied-research unit and connect its specialists with Estonian firms. Support testing and development in fields such as drones, autonomous systems and health data. The centre closes practical gaps between a promising design and a product that a company can make reliably."
 TFR_EST_reform_2023_real_time_economy:0 "Replace Repeated Reports with Data Exchange"
 TFR_EST_reform_2023_real_time_economy_desc:0 "Implement the real-time-economy programme through common data standards and automatic reporting. Firms should send accurate information once and know how the state uses it. Begin with workable reporting flows and reliable registers instead of replacing every form with another disconnected portal."
 TFR_EST_reform_2023_enterprise_digital:0 "Take Firms Through the Digitalisation Masterclass"
 TFR_EST_reform_2023_enterprise_digital_desc:0 "Support businesses in mapping production bottlenecks and adopting useful digital systems. The enterprise programme should combine training with a practical investment plan, especially for smaller firms. Productivity gains come from changes on the shop floor and in administration, not from purchasing software alone."
 TFR_EST_reform_2023_cyber_reserve:0 "Organise the Digital Defence Reserve"
 TFR_EST_reform_2023_cyber_reserve_desc:0 "Connect Defence Forces and Kaitseliit specialists with the operators of essential public systems. Rehearse restoration from backups and a common response to hostile information operations. Estonia's electronic services must remain useful when ordinary communications and institutions come under pressure."
 TFR_EST_reform_2023_research_one_percent:0 "Protect One Percent for Public Research"
 TFR_EST_reform_2023_research_one_percent_desc:0 "Keep public research and development funding at the government's one-percent-of-GDP commitment and encourage private investment alongside it. Publish priorities and review results while preserving stable support for research institutions. Fiscal consolidation should not leave essential technical work without a planning horizon."
 TFR_EST_reform_2023_regional_exporters:0 "Back Regional Exporters and Investment Projects"
 TFR_EST_reform_2023_regional_exporters_desc:0 "Use enterprise support and economic diplomacy to help firms outside the largest cities reach new customers. Assess projects for viable products, skilled jobs and access to services. Regional investment should complement private decisions rather than preserve every uneconomic business indefinitely."
 TFR_EST_reform_2023_civil_reserve:0 "Fund the Civil-Protection Reserve"
 TFR_EST_reform_2023_civil_reserve_desc:0 "Train a community-based reserve to support rescue and health services during serious emergencies. Municipalities need agreed responsibilities, communications and supplies for evacuation and shelter. Civil preparation helps the country endure the opening of a European war without turning volunteers into unprovided army formations."
 TFR_EST_reform_2023_vat_twenty_two:0 "Raise VAT to Twenty-Two Percent"
 TFR_EST_reform_2023_vat_twenty_two_desc:0 "Legislate the increase in the standard VAT rate from twenty to twenty-two percent and fund the Tax and Customs Board's implementation. Additional receipts help finance defence and public services, while the higher consumption tax imposes a real cost on households. Account for both sides of the measure."
 TFR_EST_reform_2023_spending_reviews:0 "Review Ministry Spending Before New Commitments"
 TFR_EST_reform_2023_spending_reviews_desc:0 "Review recurrent spending and procurement across ministries, distinguishing avoidable overhead from services that still need funding. Publish the savings and their consequences. A spending review provides fiscal room only where government actually changes how money is used."
 TFR_EST_reform_2023_municipal_revenue:0 "Strengthen the Municipal Revenue Base"
 TFR_EST_reform_2023_municipal_revenue_desc:0 "Rebalance municipal revenue so that local services do not depend entirely on the number of high earners living nearby. Coordinate the transition with councils and publish the distribution. Small municipalities need a dependable basis for schools, care and crisis duties."
 TFR_EST_reform_2023_care_reform:0 "Put Municipal Funding Behind Care Reform"
 TFR_EST_reform_2023_care_reform_desc:0 "Implement the care reform with local authorities paying the care component of general residential care. Inspect staffing, fees and access so that families see the support in practice. Continue a reform legislated before this cabinet and bring its administration into the new government's programme."
 TFR_EST_reform_2023_marriage_equality:0 "Enact Marriage Equality"
 TFR_EST_reform_2023_marriage_equality_desc:0 "Amend the Family Law Act so that two adults may marry and provide the implementing rules that registrars and families require. The law replaces the earlier referendum dispute with a parliamentary settlement. Publish clear arrangements for existing partnerships and equal treatment before the law."
 TFR_EST_reform_2023_mental_health:0 "Keep Mental-Health Support Close to Home"
 TFR_EST_reform_2023_mental_health_desc:0 "Continue grants for municipal counselling and psychologists in primary care. Link local help with specialist treatment and review whether residents can actually obtain an appointment. Accessible support matters to daily life and becomes more valuable when families face mobilisation, displacement or bereavement."
 TFR_EST_reform_2023_account_to_parliament:0 "Report to the Riigikogu on the Mandate"
 TFR_EST_reform_2023_account_to_parliament_desc:0 "Present the completed government's programme to parliament: the tax choices, schools and services funded, energy security improved and defence preparations delivered. Review what remains unfinished beyond these initial projects. This report neither starts a war nor calls an election; the postwar parliament will judge the cabinet when independent politics can resume."
 TFR_EST_reform_2023_governing_tt:0 "A confirmed Reform-led cabinet has at least 51 coalition seats."
 TFR_EST_reform_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 government programme."
 TFR_EST_reform_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_reform_2023_grid_connection_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Preparations funded by an earlier government count once. Completing the whole energy branch removes the spirit; preparations also apply if the crisis begins later."
 TFR_EST_reform_2023_wind_permits_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Preparations funded by an earlier government count once. Completing the whole energy branch removes the spirit; preparations also apply if the crisis begins later."
 TFR_EST_reform_2023_renovation_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Preparations funded by an earlier government count once. Completing the whole energy branch removes the spirit; preparations also apply if the crisis begins later."
