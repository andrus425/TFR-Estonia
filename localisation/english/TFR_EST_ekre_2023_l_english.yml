l_english:
 TFR_EST_ekre_2023_new_mandate:0 "An EKRE-Led Parliamentary Mandate"
 TFR_EST_ekre_2023_new_mandate_desc:0 "EKRE has won the largest delegation. Negotiate a funded programme with our actual coalition partners; a plurality still needs a parliamentary majority."
 TFR_EST_ekre_2023_defence_commitment:0 "Fund the Three-Percent Defence Commitment"
 TFR_EST_ekre_2023_defence_commitment_desc:0 "Approve procurement instalments and command preparations before a European war reaches Estonia. A spending commitment must be matched by contracts and dependable stores."
 TFR_EST_ekre_2023_reserve_training:0 "Prepare the Expanded Reserve Establishment"
 TFR_EST_ekre_2023_reserve_training_desc:0 "Schedule instructors, call-up records and equipment accounting for a larger reserve. Expansion remains a training and procurement task rather than an instant addition to the army."
 TFR_EST_ekre_2023_air_defence:0 "Finance Air Defence for Key Regions"
 TFR_EST_ekre_2023_air_defence_desc:0 "Fund site planning, crews and procurement for medium- and short-range protection. Integrate the systems we can maintain instead of promising an immediate nationwide shield."
 TFR_EST_ekre_2023_coastal_defence:0 "Prepare Coastal Positions and Mine Stores"
 TFR_EST_ekre_2023_coastal_defence_desc:0 "Prepare shore positions, observation posts and controlled stores for coastal defence. Naval and ground commanders must agree responsibilities before hostilities begin."
 TFR_EST_ekre_2023_military_border_guard:0 "Organise a Military Border-Guard Reserve"
 TFR_EST_ekre_2023_military_border_guard_desc:0 "Define the proposed border service's crisis command and reserve duties. Train personnel and finance communications without treating an administrative change as a new field army."
 TFR_EST_ekre_2023_shelters:0 "Fund Shelters and Civil-Protection Training"
 TFR_EST_ekre_2023_shelters_desc:0 "Survey shelters, fund essential repairs and require protection in major new buildings. Municipal exercises should test evacuation, first aid and continuity of services."
 TFR_EST_ekre_2023_defence_contracts:0 "Place Maintainable Domestic Defence Contracts"
 TFR_EST_ekre_2023_defence_contracts_desc:0 "Translate equipment plans into contracts that Estonian suppliers can service. Start with ammunition handling and repairs while preserving ordinary production and procurement limits."
 TFR_EST_ekre_2023_ammunition_workshop:0 "Finance an Ammunition Workshop"
 TFR_EST_ekre_2023_ammunition_workshop_desc:0 "Pay for one inspected ammunition-production workshop. This initial facility supplies Estonia's production base; it does not deliver an automatic stockpile or complete the entire rearmament programme."
 TFR_EST_ekre_2023_repair_workshop:0 "Finance an Equipment Repair Workshop"
 TFR_EST_ekre_2023_repair_workshop_desc:0 "Fund a second workshop for servicing, component manufacture and overhaul. Reliable maintenance keeps procured equipment useful; Estonia must still manufacture or purchase the equipment itself."
 TFR_EST_ekre_2023_existing_railways:0 "Redirect Investment to Existing Railways"
 TFR_EST_ekre_2023_existing_railways_desc:0 "Review Rail Baltic commitments and redirect this programme's investment toward existing railway links. Publish the contractual costs and prioritize usable domestic connections."
 TFR_EST_ekre_2023_trunk_roads:0 "Fund the Tallinn Trunk-Road Sections"
 TFR_EST_ekre_2023_trunk_roads_desc:0 "Select and fund practical four-lane sections toward Tartu, Pärnu and Narva. Phased construction improves movement without declaring three complete highways finished at once."
 TFR_EST_ekre_2023_food_reserves:0 "Contract Domestic Emergency Food Reserves"
 TFR_EST_ekre_2023_food_reserves_desc:0 "Contract inspected staple-food reserves and rotate them through domestic suppliers. Farmers and transport operators need payment and clear emergency delivery arrangements."
 TFR_EST_ekre_2023_narva_blocks:0 "Overhaul the Idle Narva Power Blocks"
 TFR_EST_ekre_2023_narva_blocks_desc:0 "Commission technical surveys and overhaul contracts for idle generating units. Fund dependable capacity and fuel arrangements while accounting for operating and environmental costs."
 TFR_EST_ekre_2023_kiisa_reserve:0 "Bring Kiisa Capacity into the Supply Plan"
 TFR_EST_ekre_2023_kiisa_reserve_desc:0 "Review the gas station's company structure and commercial availability. Secure fuel and dispatch arrangements while keeping emergency reserve requirements explicit."
 TFR_EST_ekre_2023_regulated_power:0 "Fund the Three-Cent Electricity Proposal"
 TFR_EST_ekre_2023_regulated_power_desc:0 "Prepare the proposed state-backed supply contracts and their subsidy reserve. Resolve carbon-cost and legal disputes; a promised tariff does not make electricity generation free."
 TFR_EST_ekre_2023_fuel_excise:0 "Lower Fuel Excise to the EU Minimum"
 TFR_EST_ekre_2023_fuel_excise_desc:0 "Reduce the proposed fuel duties and update tax administration. Lower operating costs help firms and households, while the treasury loses recurring receipts."
 TFR_EST_ekre_2023_food_vat:0 "Introduce Five-Percent VAT on Food"
 TFR_EST_ekre_2023_food_vat_desc:0 "Legislate the reduced food rate and monitor how the change reaches customers. Record the revenue loss alongside the relief delivered to household budgets."
 TFR_EST_ekre_2023_medicine_vat:0 "Reduce Medicine VAT to Five Percent"
 TFR_EST_ekre_2023_medicine_vat_desc:0 "Apply the proposed lower rate to medicines and update pharmacy billing. Improved affordability requires a funded revenue adjustment and continued access to supplies."
 TFR_EST_ekre_2023_child_tax_relief:0 "Link Parents' Tax Relief to Children"
 TFR_EST_ekre_2023_child_tax_relief_desc:0 "Draft the child-linked income-tax allowance with clear eligibility and legal limits. Publish its distribution and recurring cost before claiming the policy pays for itself."
 TFR_EST_ekre_2023_family_home_loans:0 "Pilot Child-Linked Family Home Loans"
 TFR_EST_ekre_2023_family_home_loans_desc:0 "Fund a limited loan programme with child-linked repayment relief. Begin with assessed borrowers and a defined public guarantee rather than underwriting every mortgage."
 TFR_EST_ekre_2023_student_loan_relief:0 "Fund Parents' Student-Loan Relief"
 TFR_EST_ekre_2023_student_loan_relief_desc:0 "Create an application process for the proposed child-linked student-loan cancellation. Budget the first claims and explain the eligibility rules to lenders and families."
 TFR_EST_ekre_2023_family_doctors:0 "Finance Duty Hours for Family Doctors"
 TFR_EST_ekre_2023_family_doctors_desc:0 "Contract additional primary-care duty hours and local pharmacy cover. Patients need reliable appointments and referrals rather than another promise of shorter queues."
 TFR_EST_ekre_2023_rural_maternity:0 "Restore Round-the-Clock Midwife Cover"
 TFR_EST_ekre_2023_rural_maternity_desc:0 "Fund midwife duty arrangements in smaller hospitals and family practices. Assess staffing and safe referral routes before extending the service."
 TFR_EST_ekre_2023_thirteenth_pension:0 "Budget the Thirteenth-Pension Supplement"
 TFR_EST_ekre_2023_thirteenth_pension_desc:0 "Fund the proposed additional annual payment for pensioners below the average pension. Explain who receives it and provide for the cost alongside defence spending."
 TFR_EST_ekre_2023_parliamentary_scrutiny:0 "Strengthen Parliamentary Security Scrutiny"
 TFR_EST_ekre_2023_parliamentary_scrutiny_desc:0 "Fund committee expertise and lawful access to oversight information. Review institutional accountability while maintaining operational secrecy and independent proceedings."
 TFR_EST_ekre_2023_e_vote_audit:0 "Commission an Independent E-Voting Audit"
 TFR_EST_ekre_2023_e_vote_audit_desc:0 "Commission independent technical scrutiny and publish the findings. The audit does not presume fraud, change allocated seats or call another election."
 TFR_EST_ekre_2023_citizens_initiative:0 "Draft the Citizens' Initiative Procedure"
 TFR_EST_ekre_2023_citizens_initiative_desc:0 "Prepare the proposed procedure for citizen-initiated bills and referendums. Establish signature verification and constitutional safeguards before seeking the necessary parliamentary approval."
 TFR_EST_ekre_2023_presidential_election_bill:0 "Draft Direct Presidential Elections"
 TFR_EST_ekre_2023_presidential_election_bill_desc:0 "Prepare the constitutional amendment and its required procedure. Introducing a bill does not replace the incumbent president or bypass the existing constitution."
 TFR_EST_ekre_2023_constitutional_review:0 "Review European Measures in the Riigikogu"
 TFR_EST_ekre_2023_constitutional_review_desc:0 "Resource constitutional scrutiny of proposed European measures and the government's negotiating mandate. Publish disputed obligations without automatically withdrawing Estonia from its alliances."
 TFR_EST_ekre_2023_estonian_education:0 "Fund Estonian-Language Teaching Capacity"
 TFR_EST_ekre_2023_estonian_education_desc:0 "Prepare teachers and teaching materials for Estonian-language instruction. Budget practical support for pupils and institutions instead of treating a legislative requirement as sufficient staffing."
 TFR_EST_ekre_2023_account_to_parliament:0 "Account for the National Conservative Programme"
 TFR_EST_ekre_2023_account_to_parliament_desc:0 "Report the programme's costs and results to the Riigikogu. Review incomplete legislation and long projects without calling an election or changing the European war's course."
 TFR_EST_ekre_2023_governing_tt:0 "A confirmed EKRE-led cabinet has at least 51 coalition seats."
 TFR_EST_ekre_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 EKRE government programme."
 TFR_EST_ekre_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_ekre_2023_narva_blocks_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three energy projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_ekre_2023_kiisa_reserve_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three energy projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_ekre_2023_regulated_power_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three energy projects removes the spirit; preparation also applies if the crisis begins later."
