l_english:
 TFR_EST_e200_2023_new_mandate:0 "An Eesti 200 Long-Term Parliamentary Mandate"
 TFR_EST_e200_2023_new_mandate_desc:0 "The largest delegation must now turn a long-term programme into funded decisions. A confirmed majority will answer to parliament for education, resilient government and defence preparation."
 TFR_EST_e200_2023_defence_commitment:0 "Fund the Three-Percent Defence Commitment"
 TFR_EST_e200_2023_defence_commitment_desc:0 "Approve a procurement and operating tranche toward the proposed defence commitment. Delivery schedules and continuing costs go before parliament for review."
 TFR_EST_e200_2023_air_defence:0 "Prepare the Kalevipoja Air-Defence Dome"
 TFR_EST_e200_2023_air_defence_desc:0 "Survey sites and fund trained crews, communications and compatible purchases. The proposed integrated shield needs a staged procurement plan rather than a declaration that the sky is already secure."
 TFR_EST_e200_2023_reserve_muster:0 "Assign Every Citizen a Crisis Role"
 TFR_EST_e200_2023_reserve_muster_desc:0 "Test the reserve call-up lists and coordinate civilian responsibilities with employers and councils. Exercises must reveal which plans can actually assemble and sustain the existing units."
 TFR_EST_e200_2023_kaitseliit_instructors:0 "Fund Kaitseliit Instructors and Civil-Protection Training"
 TFR_EST_e200_2023_kaitseliit_instructors_desc:0 "Commission professional instruction for volunteers in military and civilian emergencies. Inspect equipment upkeep and realistic arrangements for participants with civilian jobs."
 TFR_EST_e200_2023_allied_reception:0 "Prepare Sustained Allied Reception"
 TFR_EST_e200_2023_allied_reception_desc:0 "Exercise ports, routes and dispersed stores with Estonia's available allies. Facilities support the reinforcement agreements that actually exist in this campaign."
 TFR_EST_e200_2023_civil_reserve:0 "Establish Civil Reserves and Tartu Disaster-Medicine Training"
 TFR_EST_e200_2023_civil_reserve_desc:0 "Finance community exercises and a first training tranche for military and disaster medicine in Tartu. Local services must demonstrate warning, shelter and evacuation arrangements together."
 TFR_EST_e200_2023_industrial_guarantees:0 "Capitalize Domestic Defence-Industry Projects"
 TFR_EST_e200_2023_industrial_guarantees_desc:0 "Award assessed development finance to domestic suppliers. The state acts as an inspected development partner while firms remain responsible for delivery and usable products."
 TFR_EST_e200_2023_ammunition_workshop:0 "Finance Domestic Ammunition Manufacturing"
 TFR_EST_e200_2023_ammunition_workshop_desc:0 "Purchase a limited production facility and qualify its suppliers. Manufacturing still needs workers, materials and ordinary production orders."
 TFR_EST_e200_2023_maintenance_workshop:0 "Equip a Defence Servicing and Components Workshop"
 TFR_EST_e200_2023_maintenance_workshop_desc:0 "Finance overhaul tooling and domestic component supply alongside the production programme. This is capacity for equipment Estonia can procure and maintain."
 TFR_EST_e200_2023_drone_development:0 "Commission Dual-Use Drone Development Trials"
 TFR_EST_e200_2023_drone_development_desc:0 "Fund inspected prototypes and flight trials with domestic firms and researchers. Successful trials build expertise; they do not instantly supply combat aircraft."
 TFR_EST_e200_2023_research_tax_credit:0 "Introduce the Business Research Tax Incentive"
 TFR_EST_e200_2023_research_tax_credit_desc:0 "Publish eligible research costs and audit rules for the proposed incentive. Its recurring revenue cost enters the public ledger alongside the industrial benefit."
 TFR_EST_e200_2023_simplified_business:0 "Simplify Small Companies and Raise the VAT Threshold"
 TFR_EST_e200_2023_simplified_business_desc:0 "Implement the proposed simpler company form and hundred-thousand-euro VAT-registration threshold. Revised filing guidance accompanies the recorded revenue cost."
 TFR_EST_e200_2023_renewable_permits:0 "Create the Six-Month Renewable-Permit Procedure"
 TFR_EST_e200_2023_renewable_permits_desc:0 "Resource coordinated planning and assessed generating projects toward the proposed shorter procedure. Speed requires capable reviewers, clear standards and reliable delivery obligations."
 TFR_EST_e200_2023_grid_connection:0 "Release Unused Grid Reservations and Fund Connections"
 TFR_EST_e200_2023_grid_connection_desc:0 "Apply deadlines to unused connection bookings and finance bottleneck upgrades. Operators must demonstrate which projects can connect safely to the network."
 TFR_EST_e200_2023_renovation:0 "Expand the Residential Energy-Renovation Programme"
 TFR_EST_e200_2023_renovation_desc:0 "Commission supervised upgrades against verified heat losses. Funding covers a defined tranche toward the proposed larger renovation effort."
 TFR_EST_e200_2023_storage_guarantees:0 "Offer Assessed Guarantees for Storage and Microgrids"
 TFR_EST_e200_2023_storage_guarantees_desc:0 "Share defined technology risks with private investors and energy communities. Contracts specify maintenance, balancing obligations and the limits of public liability."
 TFR_EST_e200_2023_interconnectors:0 "Design the Offshore Grid and Interconnector Programme"
 TFR_EST_e200_2023_interconnectors_desc:0 "Commission surveys, permits and technical agreements for stronger Baltic links. Design work advances the programme without pretending that every proposed cable is already built."
 TFR_EST_e200_2023_climate_law:0 "Legislate the Climate Framework and Procurement Criteria"
 TFR_EST_e200_2023_climate_law_desc:0 "Publish consistent environmental duties and measurable procurement standards. Firms need dependable rules and transparent assessments when planning investment."
 TFR_EST_e200_2023_once_only_data:0 "Enact the Once-Only Data Submission Rule"
 TFR_EST_e200_2023_once_only_data_desc:0 "Connect eligible registries and remove repeated requests for information the state already holds. Test access controls and continuity before moving services to the new process."
 TFR_EST_e200_2023_electronic_invoices:0 "Complete Public-Sector Electronic Invoicing"
 TFR_EST_e200_2023_electronic_invoices_desc:0 "Migrate procurement payments to compatible machine-readable invoices. Audited administrative savings receive an explicit public-ledger balance amount."
 TFR_EST_e200_2023_zero_budget_review:0 "Rebuild Expenditure through the Zero-Based Budget Review"
 TFR_EST_e200_2023_zero_budget_review_desc:0 "Require departments to justify existing spending and publish the decisions. Only the reviewed savings enter the ledger; a review does not abolish public services by itself."
 TFR_EST_e200_2023_health_accounts:0 "Launch Personal Health Accounts and the Employer Allowance"
 TFR_EST_e200_2023_health_accounts_desc:0 "Build the proposed personal health account and twelve-hundred-euro employer contribution allowance. Privacy controls and the recurring fiscal cost accompany the rollout."
 TFR_EST_e200_2023_care_coordinators:0 "Place Health and Care Coordinators in Primary Care"
 TFR_EST_e200_2023_care_coordinators_desc:0 "Commission coordinators and interoperable case records across health and social services. Patients receive a practical route through services instead of disconnected referrals."
 TFR_EST_e200_2023_mental_health:0 "Fund Prevention and First-Line Mental-Health Services"
 TFR_EST_e200_2023_mental_health_desc:0 "Finance assessed prevention programmes, school support and primary-care referrals. Service contracts include trained staff, access standards and regular outcome reviews."
 TFR_EST_e200_2023_education_investment:0 "Start the Additional Education Investment Programme"
 TFR_EST_e200_2023_education_investment_desc:0 "Authorize the first funded stage toward the proposed annual education increase. Teacher recruitment, specialist support and regional delivery receive a common implementation plan."
 TFR_EST_e200_2023_teacher_careers:0 "Fund Teacher Careers toward the Three-Thousand-Euro Objective"
 TFR_EST_e200_2023_teacher_careers_desc:0 "Negotiate salary stages, professional development and workload rules. Publish progress toward the proposed pay objective without treating every vacancy as already filled."
 TFR_EST_e200_2023_common_school:0 "Finance the Shared Estonian-Language School Transition"
 TFR_EST_e200_2023_common_school_desc:0 "Provide language staff, learning materials and school support, including the Ida-Viru school-turnaround programme. Regional plans must support children with different home languages."
 TFR_EST_e200_2023_learning_to_eighteen:0 "Extend Compulsory Learning to Eighteen"
 TFR_EST_e200_2023_learning_to_eighteen_desc:0 "Resource flexible study and workplace-learning routes for young people after basic school. The new obligation requires suitable places and practical support for completion."
 TFR_EST_e200_2023_student_loans:0 "Reform Six-Thousand-Euro Student Loans and Repayment"
 TFR_EST_e200_2023_student_loans_desc:0 "Fund the revised loan scheme with a longer repayment period and clear eligibility. Publish the guarantee liability and terms so students can plan full-time study."
 TFR_EST_e200_2023_e_university:0 "Launch the Shared Estonian e-University Platform"
 TFR_EST_e200_2023_e_university_desc:0 "Commission accessible digital courses across higher-education institutions. Academic quality and practical access matter as much as the platform that distributes them."
 TFR_EST_e200_2023_account_to_parliament:0 "Present the Eesti 200 Government's Accounts"
 TFR_EST_e200_2023_account_to_parliament_desc:0 "Report funded reforms, defence preparation and outstanding commitments to parliament. The next mandate should inherit a clear account of delivery and remaining work."
 TFR_EST_e200_2023_governing_tt:0 "A confirmed Eesti 200-led cabinet has at least 51 coalition seats."
 TFR_EST_e200_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 Eesti 200 government programme."
 TFR_EST_e200_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_e200_2023_renewable_permits_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_e200_2023_grid_connection_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_e200_2023_renovation_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
