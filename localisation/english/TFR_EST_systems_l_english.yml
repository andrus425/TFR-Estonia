l_english:
 TFR_EST_cohesion_fragile:0 "National Cohesion: Fragile"
 TFR_EST_cohesion_fragile_desc:0 "The current cohesion tier is derived from the national meter. Thresholds are 25, 50 and 75; focuses and decisions can improve it. This spirit is refreshed automatically when the meter crosses a threshold."
