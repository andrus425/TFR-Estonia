 TFR_EST_defense_commitment:0 "A Credible Defense Commitment"
 TFR_EST_defense_commitment_desc:0 "Estonia has replaced peacetime restraint with a funded defense program. Parent NATO production restrictions have been lifted for Estonia only."
 TFR_EST_reserve_training:0 "Reserve Assembly and Training"
 TFR_EST_reserve_training_desc:0 "A limited training program prepares Kaitseliit reserve brigades. Recruit them through the division designer and deployment screen; equipment and manpower are consumed normally."
 TFR_EST_welcome_title:0 "A Republic on the Baltic Frontier"
 TFR_EST_welcome_desc:0 "Jüri Ratas enters 2020 at the head of a 57-seat Centre–EKRE–Isamaa coalition. President Kersti Kaljulaid remains the head of state. Beyond the cabinet, the Riigikogu, public confidence and the Defense Forces will determine how Estonia meets the crisis ahead.\n\nUse the Riigikogu decisions to manage your coalition and contest elections. National cohesion and defense readiness are shown in their own decision categories. These meters complement TFR's existing economy, NATO and EU systems.\n\nIf Estonia loses a supported European-war settlement, its campaign continues under an occupation administration retaining Northern Estonia. Government and election content returns after restoration."
 TFR_EST_welcome_option:0 "The republic must endure."
 TFR_EST_cohesion_category:0 "National Cohesion"
 TFR_EST_cohesion_category_desc:0 "Cohesion: §Y[?TFR_EST_cohesion|1]/100§!\nNet weekly change: §Y[?TFR_EST_cohesion_weekly|2]§!\n\nTiers: fragile below 25; divided at 25; functional at 50; united at 75. Caretaker government reduces cohesion by 0.50 each week; war reduces it by 0.15. Community consultation adds 0.75 and emergency relief adds 0.50 while their programs run.\n\nOccupation changes which measures are permitted. Cohesion measures trust in institutions and civil resilience across the whole population."
 TFR_EST_readiness_category:0 "Defense Readiness"
 TFR_EST_readiness_category_desc:0 "Readiness: §Y[?TFR_EST_readiness|1]/100§!\nNet weekly change: §Y[?TFR_EST_readiness_weekly|2]§!\n\nTiers: unprepared below 25; developing at 25; prepared at 50; resilient at 75. War consumes 0.20 readiness weekly. Reserve exercises add 1.25 each week during their program.\n\nAt 50 readiness, or during war, independent Estonia can authorize reserve recruitment. Units still require ordinary equipment, manpower and training. Allied brigades are separate from this program."
 TFR_EST_community_consultation:0 "Community Consultation"
 TFR_EST_community_consultation_desc:0 "Hold regional meetings and commission practical service improvements. The four-week program adds 0.75 cohesion each week.\n\nBudget: €25 million, financed through TFR's inflation-adjusted debt ledger."
 TFR_EST_emergency_relief:0 "Fund Emergency Relief"
 TFR_EST_emergency_relief_desc:0 "Support displaced families and keep essential municipal services running. The four-week program adds 0.50 cohesion each week.\n\nBudget: €40 million, financed through TFR's inflation-adjusted debt ledger."
 TFR_EST_reserve_drills:0 "Conduct Local Reserve Exercises"
 TFR_EST_reserve_drills_desc:0 "Bring local commanders, reservists and municipal planners together. The four-week program adds 1.25 readiness each week.\n\nBudget: €30 million, financed through TFR's inflation-adjusted debt ledger."
 TFR_EST_authorize_reserves:0 "Authorize Kaitseliit Reserve Recruitment"
 TFR_EST_authorize_reserves_desc:0 "Unlock a two-battalion reserve template and a 90-day training program. This does not create free divisions: recruit the brigades normally. Requires independent Estonia, control of Northern Estonia, and either 50 readiness or an active war.\n\nBudget: €50 million."
 TFR_EST_defense_procurement:0 "A Limited Defense Procurement Package"
 TFR_EST_defense_procurement_desc:0 "Purchase 500 infantry equipment and 50 support equipment through a funded contract. Readiness increases by 3. Each contract costs €90 million; another can be approved after 180 days."
 TFR_EST_fortify_tallinn:0 "Prepare Tallinn's Defensive Belt"
 TFR_EST_fortify_tallinn_desc:0 "Build one additional level of land fortifications at Tallinn and improve readiness by 5. The €75 million project can be authorized once."
 TFR_EST_budget_cost_tt:0 "The project is financed through TFR's inflation-adjusted public debt ledger, in billions of 2020 US dollars."
 TFR_EST_cohesion_change_tt:0 "National Cohesion: [?TFR_EST_cohesion_delta|=+0] (0–100)."
 TFR_EST_readiness_change_tt:0 "Defense Readiness: [?TFR_EST_readiness_delta|=+0] (0–100)."
 TFR_EST_nato_restrictions_tt:0 "Replace Estonia's inherited NATO peacetime military restrictions with its funded defense commitment. Other NATO countries are unaffected."
 TFR_EST_reserve_template_tt:0 "Unlock the Kaitseliidu reservbrigaad template and a temporary reserve-training bonus. Train units through normal recruitment; no soldiers or equipment are created by this authorization."
