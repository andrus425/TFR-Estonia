l_english:
 TFR_EST_isamaa_2023_new_mandate:0 "An Isamaa-Led Parliamentary Mandate"
 TFR_EST_isamaa_2023_new_mandate_desc:0 "Isamaa has secured the largest delegation. Helir-Valdor Seeder must turn that result into a majority programme with the coalition actually confirmed by parliament."
 TFR_EST_isamaa_2023_defence_commitment:0 "Fund the Independent Defence Establishment"
 TFR_EST_isamaa_2023_defence_commitment_desc:0 "Authorize the next procurement instalments and publish a funded readiness plan. Estonia's defence commitments require contracts, instructors and dependable stores."
 TFR_EST_isamaa_2023_air_defence:0 "Prepare Integrated Air Defence Sites"
 TFR_EST_isamaa_2023_air_defence_desc:0 "Fund crew instruction, communications and assessed procurement sites. This capability programme must account for operating costs before equipment can be fielded."
 TFR_EST_isamaa_2023_reserve_muster:0 "Rehearse the Reserve Mobilisation System"
 TFR_EST_isamaa_2023_reserve_muster_desc:0 "Check call-up records, employers' arrangements and unit stores through scheduled exercises. A reliable muster makes existing formations more usable when warning time is short."
 TFR_EST_isamaa_2023_kaitseliit_ranges:0 "Build Kaitseliit Training and Range Capacity"
 TFR_EST_isamaa_2023_kaitseliit_ranges_desc:0 "Finance instructors and safe range access with local agreements. Territorial units need frequent practice and practical facilities to improve their small-unit work."
 TFR_EST_isamaa_2023_allied_reception:0 "Prepare Allied Reception and Prepositioned Stores"
 TFR_EST_isamaa_2023_allied_reception_desc:0 "Tender reception facilities and dispersed storage with the allies available to Estonia. Exercise their use; the ordinary allied reinforcement arrangements still govern troop arrivals."
 TFR_EST_isamaa_2023_civil_protection:0 "Give Civil Protection a Funded Legal Basis"
 TFR_EST_isamaa_2023_civil_protection_desc:0 "Agree responsibilities for warning, evacuation and essential supplies. Councils and rescue services receive exercise funding and clear reporting duties."
 TFR_EST_isamaa_2023_industrial_guarantees:0 "Back Defence-Industry Development Contracts"
 TFR_EST_isamaa_2023_industrial_guarantees_desc:0 "Fund inspected prototypes and supply contracts with domestic firms. Publish the delivery standards so public development money supports production that the armed forces can maintain."
 TFR_EST_isamaa_2023_ammunition_workshop:0 "Finance an Ammunition Production Workshop"
 TFR_EST_isamaa_2023_ammunition_workshop_desc:0 "Pay for a limited production facility and its supplier qualification. The workshop adds industrial capacity; completed ammunition still comes through normal production or paid procurement."
 TFR_EST_isamaa_2023_maintenance_workshop:0 "Finance an Equipment Maintenance Workshop"
 TFR_EST_isamaa_2023_maintenance_workshop_desc:0 "Fund a second facility for overhaul work and replacement components. Sustainable servicing turns purchases into a usable force without awarding free equipment."
 TFR_EST_isamaa_2023_regional_value_chains:0 "Finance Regional Manufacturing Partnerships"
 TFR_EST_isamaa_2023_regional_value_chains_desc:0 "Co-fund viable supplier projects with county development centres and researchers. Regional firms should gain skills, orders and access to higher-value work."
 TFR_EST_isamaa_2023_credit_register:0 "Establish a Positive Credit Register"
 TFR_EST_isamaa_2023_credit_register_desc:0 "Set consistent reporting and data-access rules for a responsible lending register. Better assessment should help sound borrowers obtain competing offers while preserving personal-data controls."
 TFR_EST_isamaa_2023_expense_allowances:0 "Update the Fixed Business-Expense Allowances"
 TFR_EST_isamaa_2023_expense_allowances_desc:0 "Legislate revised travel and work-expense exemptions with clear payroll instructions. Record the revenue reduction alongside simpler administration for employers."
 TFR_EST_isamaa_2023_dispatchable_reserve:0 "Contract Dispatchable Domestic Power Reserves"
 TFR_EST_isamaa_2023_dispatchable_reserve_desc:0 "Fund available generating reserves and their fuel arrangements. Reliability contracts must cover maintenance and dispatch obligations while new supply is developed."
 TFR_EST_isamaa_2023_grid_connection:0 "Finance Secure Grid Connections"
 TFR_EST_isamaa_2023_grid_connection_desc:0 "Pay for assessed connection bottlenecks and network works with system operators. Agree technical tests before depending on an additional source of supply."
 TFR_EST_isamaa_2023_renovation:0 "Standardise and Fund Energy-Saving Renovation"
 TFR_EST_isamaa_2023_renovation_desc:0 "Give housing associations funded designs, technical supervision and predictable applications. Completed works reduce exposure to high energy bills over time."
 TFR_EST_isamaa_2023_district_heating:0 "Modernise District-Heating Networks"
 TFR_EST_isamaa_2023_district_heating_desc:0 "Tender viable pipe replacement and heating connections with municipalities. Review heat demand and maintenance before committing to each project."
 TFR_EST_isamaa_2023_nuclear_studies:0 "Commission the Nuclear Feasibility and Safety Studies"
 TFR_EST_isamaa_2023_nuclear_studies_desc:0 "Finance independent technical, regulatory and waste-management assessments. Parliament receives the evidence for a later investment decision; a study does not deliver a power station."
 TFR_EST_isamaa_2023_universal_service:0 "Fund the Extended Electricity Universal Service"
 TFR_EST_isamaa_2023_universal_service_desc:0 "Budget a defined support tranche for eligible households and smaller consumers. Publish the contract terms and review the public liability as market conditions change."
 TFR_EST_isamaa_2023_child_tax_allowance:0 "Legislate the Five-Thousand-Euro Child Allowance"
 TFR_EST_isamaa_2023_child_tax_allowance_desc:0 "Prepare the proposed annual child-linked income exemption and payroll guidance. Household relief has a recurring public revenue cost that must be recorded."
 TFR_EST_isamaa_2023_joint_returns:0 "Permit Joint Income-Tax Returns for Spouses"
 TFR_EST_isamaa_2023_joint_returns_desc:0 "Update tax administration and the rules for joint declarations. Explain eligibility and the resulting public cost before the first filing period."
 TFR_EST_isamaa_2023_child_benefit:0 "Fund Equal Hundred-Euro Child Benefits"
 TFR_EST_isamaa_2023_child_benefit_desc:0 "Finance the proposed first- and second-child benefit level with an administrative rollout. Review delivery with social-insurance officials and municipalities."
 TFR_EST_isamaa_2023_large_family_homes:0 "Launch the Large-Family Housing Grant Round"
 TFR_EST_isamaa_2023_large_family_homes_desc:0 "Open an assessed grant round for eligible large families and rural housing. Public guarantees and grants require realistic valuations and construction supervision."
 TFR_EST_isamaa_2023_care_leave:0 "Protect Care Benefits after Parental Leave"
 TFR_EST_isamaa_2023_care_leave_desc:0 "Fund revised care-benefit calculations for parents returning to work. Clear employer guidance helps families respond when a child falls ill."
 TFR_EST_isamaa_2023_maintenance_support:0 "Raise Child Maintenance Assistance to Two Hundred Euros"
 TFR_EST_isamaa_2023_maintenance_support_desc:0 "Finance the proposed assistance ceiling and strengthen recovery from liable parents. Coordinate claims so children receive support without unnecessary administrative delay."
 TFR_EST_isamaa_2023_estonian_schools:0 "Resource the Estonian-Language School Transition"
 TFR_EST_isamaa_2023_estonian_schools_desc:0 "Contract teacher training, learning materials and school support. A funded transition needs qualified staff and practical help for pupils in each municipality."
 TFR_EST_isamaa_2023_teacher_pay:0 "Fund Steps toward the Teachers' Pay Objective"
 TFR_EST_isamaa_2023_teacher_pay_desc:0 "Negotiate funded salary steps and training places with school owners. Publish progress toward the proposed minimum rather than declaring every staffing problem solved."
 TFR_EST_isamaa_2023_research_compact:0 "Agree the Public-Private Research Funding Compact"
 TFR_EST_isamaa_2023_research_compact_desc:0 "Award assessed research and industrial collaboration grants. Match public funding with credible private commitments and publish the results."
 TFR_EST_isamaa_2023_rural_internet:0 "Fund Reliable Rural Broadband Connections"
 TFR_EST_isamaa_2023_rural_internet_desc:0 "Target unserved connections with transparent tenders and shared civil works. Schools, firms and remote workers need a service that remains dependable in poor weather."
 TFR_EST_isamaa_2023_digital_baseline:0 "Guarantee Core Digital-Service Maintenance Funding"
 TFR_EST_isamaa_2023_digital_baseline_desc:0 "Budget security updates, continuity exercises and simpler data submission. Agencies must maintain the services already in use alongside new development."
 TFR_EST_isamaa_2023_home_care:0 "Expand Financed Home-Care Services"
 TFR_EST_isamaa_2023_home_care_desc:0 "Contract visits and support with councils and care providers. Review access and staffing so families can rely on practical help at home."
 TFR_EST_isamaa_2023_account_to_parliament:0 "Present the Isamaa Government's Accounts"
 TFR_EST_isamaa_2023_account_to_parliament_desc:0 "Report the funded programme and remaining obligations to the Riigikogu. Parliament should be able to assess defence preparation and service delivery before the next mandate."
 TFR_EST_isamaa_2023_governing_tt:0 "A confirmed Isamaa-led cabinet has at least 51 coalition seats."
 TFR_EST_isamaa_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 Isamaa government programme."
 TFR_EST_isamaa_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_isamaa_2023_dispatchable_reserve_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_isamaa_2023_grid_connection_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_isamaa_2023_renovation_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
