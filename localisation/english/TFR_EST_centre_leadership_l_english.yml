l_english:
 TFR_EST_tanel_kiik:0 "Tanel Kiik"
 TFR_EST_tanel_kiik_desc:0 "Tanel Kiik has served as social affairs minister, health and labour minister and Centre parliamentary group chairman. Elected party leader after its 2023 defeat, he seeks to rebuild national support through public services, parliamentary work and agreements with partners."
 TFR_EST_mihhail_kolvart:0 "Mihhail Kõlvart"
 TFR_EST_mihhail_kolvart_desc:0 "Mihhail Kõlvart succeeds Jüri Ratas following Centre's extraordinary leadership congress. He brings experience in municipal government and the party's local organisation. His appointment as prime minister requires a Centre-led government; party leadership alone does not confer control of the cabinet."
 TFR_EST_centre_congress_title:0 "Centre Chooses a New Leader"
 TFR_EST_centre_congress_desc:0 "Following Centre's defeat in the parliamentary election, delegates assemble for an extraordinary congress. Jüri Ratas is leaving the party chairmanship and will not stand again. The choice is between Tanel Kiik and Mihhail Kõlvart.\n\nKiik brings national cabinet and parliamentary experience, with Ratas backing his candidacy. Kõlvart calls for rebuilding the party through its local organisation and bringing its different supporters together. The delegates' decision selects Centre's future leader. It does not change the result of the Riigikogu election or transfer another party's premiership to Centre."
 TFR_EST_centre_congress_kiik:0 "Elect Tanel Kiik."
 TFR_EST_centre_congress_kolvart:0 "Elect Mihhail Kõlvart."
 TFR_EST_centre_party_leader_tt:0 "§YKeskerakond chair: [TFR_EST_centre_party_leader]§!\nParty leadership is separate from the parliamentary mandate and the current prime minister."
 TFR_EST_pm_centre_kiik:0 "$TFR_EST_tanel_kiik$"
 TFR_EST_pm_centre_kiik_desc:0 "Prime Minister: §H$TFR_EST_tanel_kiik$§!\n[TFR_EST_hog_cabinet_status]\n\n$TFR_EST_tanel_kiik_desc$"
 TFR_EST_hog_centre_kiik:0 "Prime Minister: §H$TFR_EST_tanel_kiik$§!\n[TFR_EST_hog_cabinet_status]\n\n\n\n\n\n\n   £GFX_idea_TFR_EST_pm_centre_kiik\n\n\n\n\n\n\n\n\n-------------------------------------\n§L$TFR_EST_tanel_kiik_desc$§!"
 TFR_EST_centre_congress_kiik_tt:0 "§YTanel Kiik§! becomes Centre's party leader and future candidate for prime minister. Preserve parliamentary seats, polls, coalition agreements, portfolio ministers and the election calendar. Another party's prime minister stays in office. An outgoing Centre caretaker stays until cabinet confirmation; a confirmed Centre-led government adopts its new party leader."
 TFR_EST_pm_centre_kolvart:0 "$TFR_EST_mihhail_kolvart$"
 TFR_EST_pm_centre_kolvart_desc:0 "Prime Minister: §H$TFR_EST_mihhail_kolvart$§!\n[TFR_EST_hog_cabinet_status]\n\n$TFR_EST_mihhail_kolvart_desc$"
 TFR_EST_hog_centre_kolvart:0 "Prime Minister: §H$TFR_EST_mihhail_kolvart$§!\n[TFR_EST_hog_cabinet_status]\n\n\n\n\n\n\n   £GFX_idea_TFR_EST_pm_centre_kolvart\n\n\n\n\n\n\n\n\n-------------------------------------\n§L$TFR_EST_mihhail_kolvart_desc$§!"
 TFR_EST_centre_congress_kolvart_tt:0 "§YMihhail Kõlvart§! becomes Centre's party leader and future candidate for prime minister. Preserve parliamentary seats, polls, coalition agreements, portfolio ministers and the election calendar. Another party's prime minister stays in office. An outgoing Centre caretaker stays until cabinet confirmation; a confirmed Centre-led government adopts its new party leader."
