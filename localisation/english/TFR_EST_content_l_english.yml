l_english:
 TFR_EST_reform_cabinet:0 "Reform Governing Programme"
 TFR_EST_reform_cabinet_desc:0 "Secure services and investment discipline improve the capacity of an open state. Active only while a confirmed Reform government leads the country."
 TFR_EST_reform_digital_services:0 "One Door to Public Services"
 TFR_EST_reform_digital_services_desc:0 "Citizens should not submit the same information to several offices. Link public services through secure records while maintaining access for people who cannot use the digital system."
 TFR_EST_reform_investment:0 "A Predictable Investment Climate"
 TFR_EST_reform_investment_desc:0 "Clear licensing and predictable contracts attract productive investment. Remove unnecessary delays while protecting the standards that make Estonia a reliable place to do business."
 TFR_EST_reform_budget_review:0 "Review Every Commitment"
 TFR_EST_reform_budget_review_desc:0 "Expenditure already promised can consume the freedom of any future cabinet. Review subsidies and overlapping agencies, then let parliament decide which savings justify their social cost."
 TFR_EST_reform_tartu_innovation:0 "Tartu Innovation Partnerships"
 TFR_EST_reform_tartu_innovation_desc:0 "Universities, engineers and businesses in Tartu can develop products for a changing world. Fund practical research partnerships and retain the skilled workforce that makes them possible."
 TFR_EST_reform_school_access:0 "Digital Access Beyond Tallinn"
 TFR_EST_reform_school_access_desc:0 "A digital state must work for rural schools and low-income families. Expand access, training and support so modernization does not deepen regional inequality."
 TFR_EST_reform_european_networks:0 "Keep European Networks Open"
 TFR_EST_reform_european_networks_desc:0 "Trade, research and diplomatic cooperation are more valuable when Europe is unstable. Keep officials engaged with functioning European institutions and preserve practical links despite political disagreements."
 TFR_EST_reform_precision_defence:0 "Precision and Professionalism"
 TFR_EST_reform_precision_defence_desc:0 "A small armed force cannot afford wasted training or incompatible procurement. Emphasize skilled personnel, interoperable communications and equipment that Estonia can maintain."
 TFR_EST_reform_crisis_transparency:0 "Transparent Emergency Government"
 TFR_EST_reform_crisis_transparency_desc:0 "Emergency measures should have clear purposes, reporting duties and expiry dates. Preserve trust through published objectives even when the cabinet must act quickly."
 TFR_EST_reform_programme:0 "An Open and Capable Republic"
 TFR_EST_reform_programme_desc:0 "Conclude the Reform programme with secure public services, productive investment and disciplined administration. Its active cabinet benefits require a Reform prime minister; enacted laws survive subsequent elections."
 TFR_EST_centre_cabinet:0 "Keskerakond Governing Programme"
 TFR_EST_centre_cabinet_desc:0 "Local investment and accountable social provision support a broad governing coalition. Active only while a confirmed Keskerakond government leads the country."
 TFR_EST_centre_municipal_compact:0 "The Municipal Compact"
 TFR_EST_centre_municipal_compact_desc:0 "Keskerakond’s strength rests on local institutions. Negotiate a predictable funding agreement with towns and rural municipalities, with transparent service targets rather than favors for party allies."
 TFR_EST_centre_regional_transport:0 "Connect the Counties"
 TFR_EST_centre_regional_transport_desc:0 "Residents outside Tallinn need access to jobs, hospitals and schools. Improve transport links in Estonian Livonia through a funded regional programme."
 TFR_EST_centre_family_security:0 "Security for Working Families"
 TFR_EST_centre_family_security_desc:0 "Protect household incomes through better coordination of benefits and employment services. The programme will reduce insecurity, though coalition partners will demand that its expenditure remains visible."
 TFR_EST_centre_integration:0 "A Common Civic Home"
 TFR_EST_centre_integration_desc:0 "A shared Estonian civic identity should include loyal residents of every background. Fund language learning and local participation, giving Ida-Viru’s communities a practical stake in the republic’s future."
 TFR_EST_centre_fair_procurement:0 "Clean Up Public Procurement"
 TFR_EST_centre_fair_procurement_desc:0 "Local development loses legitimacy when contracts seem designed for insiders. Introduce external audits and publish tender decisions even where they embarrass influential supporters."
 TFR_EST_centre_urban_industry:0 "Urban Employment Partnerships"
 TFR_EST_centre_urban_industry_desc:0 "Municipalities and manufacturers can prepare serviced industrial sites around Tallinn. Commit public funds to infrastructure while leaving hiring and production to firms."
 TFR_EST_centre_broad_defence:0 "A Broad Defence Coalition"
 TFR_EST_centre_broad_defence_desc:0 "National defence requires public consent beyond any single party. Bring mayors, employers and reservists into preparedness planning and compensate essential workers for reserve exercises."
 TFR_EST_centre_social_war_compact:0 "The Social War Compact"
 TFR_EST_centre_social_war_compact_desc:0 "If war comes, compensation for displaced families and clear rules for requisitioning will be as important as mobilization orders. Write those guarantees before emergency pressure makes them impossible to debate."
 TFR_EST_centre_programme:0 "Government for the Whole Republic"
 TFR_EST_centre_programme_desc:0 "Complete a governing settlement that combines local investment, accountable social protection and a broad commitment to defence. Its administrative benefits remain active while a Keskerakond prime minister holds office."
 TFR_EST_ekre_cabinet:0 "EKRE Governing Programme"
 TFR_EST_ekre_cabinet_desc:0 "Local organization and domestic preparedness support national defence. Active only while a confirmed EKRE government leads the country."
 TFR_EST_ekre_local_voice:0 "Hear the Counties"
 TFR_EST_ekre_local_voice_desc:0 "Rural communities should have a voice in decisions that reshape their economy and services. Organize county consultations with published commitments and a budget for local priorities."
 TFR_EST_ekre_sovereignty_review:0 "Review External Commitments"
 TFR_EST_ekre_sovereignty_review_desc:0 "Examine international commitments and explain their practical costs and protections to parliament. Choose whether confrontation or negotiation better serves sovereignty in a dangerous world."
 TFR_EST_ekre_border_service:0 "Strengthen the Border Service"
 TFR_EST_ekre_border_service_desc:0 "Improve communications, observation and contingency planning along the eastern border. Border officers need working systems and clear procedures, rather than political declarations alone."
 TFR_EST_ekre_rural_enterprise:0 "Rural Enterprise Grants"
 TFR_EST_ekre_rural_enterprise_desc:0 "Small producers and local firms can sustain communities that lose workers to Tallinn. Support viable workshops and servicing capacity in Estonian Livonia."
 TFR_EST_ekre_family_policy:0 "A Family Policy for the Future"
 TFR_EST_ekre_family_policy_desc:0 "Conservative family policy must address housing, work and access to local services. Fund practical assistance while keeping access to essential services clear for all citizens."
 TFR_EST_ekre_civil_duty:0 "Civil Duty in Every County"
 TFR_EST_ekre_civil_duty_desc:0 "A culture of preparedness can bring citizens into first aid, emergency logistics and local defence. Coordinate voluntary service with municipalities and Kaitseliit instructors."
 TFR_EST_ekre_domestic_workshops:0 "Equipment from Domestic Workshops"
 TFR_EST_ekre_domestic_workshops_desc:0 "Maintenance, protective equipment and simple military supplies offer a realistic role for Estonian industry. Fund contracts with local manufacturers rather than promising a self-sufficient heavy arms sector."
 TFR_EST_ekre_wartime_sovereignty:0 "Sovereignty Through Survival"
 TFR_EST_ekre_wartime_sovereignty_desc:0 "War will force cooperation with states whose politics differ from ours. A national defence doctrine should preserve Estonian command while making allied support practical."
 TFR_EST_ekre_programme:0 "A Republic Ready to Stand"
 TFR_EST_ekre_programme_desc:0 "Complete the national conservative programme with local organization, family support and practical defence. Its cabinet bonuses remain active while EKRE leads a confirmed government."
 TFR_EST_isamaa_cabinet:0 "Isamaa Governing Programme"
 TFR_EST_isamaa_cabinet_desc:0 "National institutions and territorial defence reinforce constitutional continuity. Active only while a confirmed Isamaa government leads the country."
 TFR_EST_isamaa_language:0 "Estonian Language and Opportunity"
 TFR_EST_isamaa_language_desc:0 "Language education should create opportunity and a shared civic space. Train teachers and support adult learners, connecting national identity with practical participation."
 TFR_EST_isamaa_family_housing:0 "Homes for Young Families"
 TFR_EST_isamaa_family_housing_desc:0 "Reliable housing and local services can help families build a future in Estonia. A measured guarantee programme will support viable homes without replacing private lending."
 TFR_EST_isamaa_energy_security:0 "Energy Security as National Policy"
 TFR_EST_isamaa_energy_security_desc:0 "Estonia must reduce exposure to unreliable suppliers while keeping power affordable. Resolve the tradeoff between transition investment, local employment and immediate resilience."
 TFR_EST_isamaa_county_institutions:0 "Keep County Institutions Working"
 TFR_EST_isamaa_county_institutions_desc:0 "Local schools, service offices and emergency authorities sustain national institutions far from Tallinn. Combine overlapping administration while preserving a dependable presence."
 TFR_EST_isamaa_national_industry:0 "Industry for National Resilience"
 TFR_EST_isamaa_national_industry_desc:0 "A small but reliable manufacturing base can supply tools, spares and essential products. Prepare a new civilian production site in Tartu."
 TFR_EST_isamaa_territorial_defence:0 "Territorial Defence Doctrine"
 TFR_EST_isamaa_territorial_defence_desc:0 "Kaitseliit, reservists and the regular army need common plans for protecting critical places. Exercise clear command responsibilities and routes for supporting the field army."
 TFR_EST_isamaa_strategic_routes:0 "Protect Strategic Routes"
 TFR_EST_isamaa_strategic_routes_desc:0 "Roads through Tartu connect local forces with national reserves and allied supply. Improve capacity and prepare alternative movement plans before a crisis."
 TFR_EST_isamaa_constitutional_continuity:0 "Constitutional Continuity in War"
 TFR_EST_isamaa_constitutional_continuity_desc:0 "Publish the legal chain of authority for a government under attack. Neither a destroyed office nor an absent minister should leave the republic without a lawful decision."
 TFR_EST_isamaa_programme:0 "The Republic Across Generations"
 TFR_EST_isamaa_programme_desc:0 "Bring family security, national institutions and territorial defence into a durable governing programme. Its cabinet benefits require an Isamaa prime minister, while completed legislation persists."
 TFR_EST_sde_cabinet:0 "Social Democratic Governing Programme"
 TFR_EST_sde_cabinet_desc:0 "Accessible services and negotiated emergency arrangements strengthen social resilience. Active only while a confirmed Social Democratic government leads the country."
 TFR_EST_sde_labour_compact:0 "The Labour Compact"
 TFR_EST_sde_labour_compact_desc:0 "Employers, workers and government can agree predictable rules for wages, retraining and emergency work. A negotiated settlement will reduce disruption when the economy comes under pressure."
 TFR_EST_sde_health_network:0 "A Reliable Health Network"
 TFR_EST_sde_health_network_desc:0 "Regional healthcare cannot depend on a few exhausted staff or distant facilities. Invest in coordinated services and contingency staffing across Estonia."
 TFR_EST_sde_social_budget:0 "Finance the Social Contract"
 TFR_EST_sde_social_budget_desc:0 "The government must choose how to fund expanded services without losing the means to defend them. Put the tradeoff before parliament and explain the distribution of its costs."
 TFR_EST_sde_training_jobs:0 "Retraining for Productive Jobs"
 TFR_EST_sde_training_jobs_desc:0 "Workers facing industrial change need skills that lead to actual employment. Combine retraining with practical employer partnerships and local workshop development."
 TFR_EST_sde_inclusive_republic:0 "An Inclusive Civic Republic"
 TFR_EST_sde_inclusive_republic_desc:0 "Inclusion strengthens security when it offers clear rights, responsibilities and access to public life. Support civic organizations and language education across divided communities."
 TFR_EST_sde_civil_resilience:0 "Resilience Begins at Home"
 TFR_EST_sde_civil_resilience_desc:0 "Public shelters, trained volunteers and continuity of essential services reduce the impact of war on civilians. Integrate municipal plans with the national emergency system."
 TFR_EST_sde_service_families:0 "Protect Service Families"
 TFR_EST_sde_service_families_desc:0 "Reservists will serve more effectively when their families retain income, childcare and access to essential services. Fund those guarantees and make them easy to claim."
 TFR_EST_sde_fair_requisition:0 "Fair Rules for Emergency Work"
 TFR_EST_sde_fair_requisition_desc:0 "Military logistics may require civilian equipment and labor. Set compensation and appeal procedures before those demands undermine trust in the government."
 TFR_EST_sde_programme:0 "Security Through Solidarity"
 TFR_EST_sde_programme_desc:0 "Complete a social democratic programme of accessible services, fair work and civil preparedness. Its active cabinet benefits depend on a Social Democratic prime minister."
 TFR_EST_e200_cabinet:0 "Eesti 200 Governing Programme"
 TFR_EST_e200_cabinet_desc:0 "Education and institutional reform support a measured long-term development programme. Active only while a confirmed Eesti 200 government leads the country."
 TFR_EST_e200_long_plan:0 "A Plan Beyond One Election"
 TFR_EST_e200_long_plan_desc:0 "Publish a rolling programme for education, productivity and state capacity. Give each ministry measurable milestones that parliament can revisit after the next election."
 TFR_EST_e200_teachers:0 "Invest in Teachers"
 TFR_EST_e200_teachers_desc:0 "Education reform begins with trained and supported teachers. Fund professional development and strengthen schools that struggle to retain staff."
 TFR_EST_e200_institutional_redesign:0 "Redesign the State Carefully"
 TFR_EST_e200_institutional_redesign_desc:0 "Reducing administrative duplication can improve services, but abrupt mergers can destroy local knowledge. Decide how quickly reform should proceed and where local access needs protection."
 TFR_EST_e200_university_industry:0 "Bridge Universities and Industry"
 TFR_EST_e200_university_industry_desc:0 "Tartu’s researchers and employers can translate skills into products and services. Fund shared facilities and a civilian industrial site with accountable milestones."
 TFR_EST_e200_shared_schools:0 "Schools for a Shared Future"
 TFR_EST_e200_shared_schools_desc:0 "Education should equip every pupil to participate in Estonian public life. Invest in language support and common opportunities while helping teachers manage the transition."
 TFR_EST_e200_future_services:0 "Design Services Around People"
 TFR_EST_e200_future_services_desc:0 "Citizens experience government through the services they need, not the ministry that owns them. Reorganize access and information around life events and local needs."
 TFR_EST_e200_adaptive_defence:0 "Adaptive Defence Planning"
 TFR_EST_e200_adaptive_defence_desc:0 "A long-term defence plan must still adapt to battlefield evidence. Link training, procurement and civilian expertise through an annual review of realistic capabilities."
 TFR_EST_e200_future_after_war:0 "Plan for the Future During Crisis"
 TFR_EST_e200_future_after_war_desc:0 "Even in war, Estonia needs a plan for schools, industry and institutions afterward. Establish a reconstruction planning team that can work alongside the emergency cabinet."
 TFR_EST_e200_programme:0 "A State Built for the Future"
 TFR_EST_e200_programme_desc:0 "Complete Eesti 200’s programme of education, institutional reform and measured long-term planning. Its active cabinet benefits require an Eesti 200 prime minister."
 TFR_EST_pp_cabinet:0 "Parempoolsed Governing Programme"
 TFR_EST_pp_cabinet_desc:0 "Disciplined contracts and competent administration support productive enterprise. Active only while a confirmed Parempoolsed government leads the country."
 TFR_EST_pp_audit:0 "Audit the Administration"
 TFR_EST_pp_audit_desc:0 "Map overlapping duties and subsidies before promising savings. Publish the evidence so reductions are judged by services preserved and resources freed, rather than the number of offices closed."
 TFR_EST_pp_enterprise_rules:0 "Clear Rules for Enterprise"
 TFR_EST_pp_enterprise_rules_desc:0 "Simpler procedures can help firms invest, hire and compete. Remove duplication while preserving predictable enforcement of the standards that protect confidence in the market."
 TFR_EST_pp_fiscal_choice:0 "The Fiscal Discipline Debate"
 TFR_EST_pp_fiscal_choice_desc:0 "Spending restraint has costs for communities that depend on public services. Choose how quickly consolidation should proceed and explain how vulnerable households will be protected."
 TFR_EST_pp_industrial_sites:0 "Service Productive Investment"
 TFR_EST_pp_industrial_sites_desc:0 "Government can provide reliable infrastructure without trying to choose every successful business. Develop a serviced civilian manufacturing site in Northern Estonia."
 TFR_EST_pp_justice_capacity:0 "Competent and Independent Justice"
 TFR_EST_pp_justice_capacity_desc:0 "Contracts and public confidence depend on effective courts and accountable prosecution. Improve administration without compromising the independence of legal decisions."
 TFR_EST_pp_targeted_services:0 "Target Help Where It Works"
 TFR_EST_pp_targeted_services_desc:0 "Review benefits and service contracts against their outcomes. Redirect limited funds toward demonstrable need while keeping application procedures accessible."
 TFR_EST_pp_procurement_discipline:0 "Defence Procurement Discipline"
 TFR_EST_pp_procurement_discipline_desc:0 "Military readiness requires equipment that can be afforded throughout its service life. Audit maintenance, training and interoperability costs before signing major contracts."
 TFR_EST_pp_crisis_reserves:0 "Maintain a Crisis Reserve"
 TFR_EST_pp_crisis_reserves_desc:0 "Fiscal planning should leave room for emergency response. Establish a documented reserve programme and clear procedures for parliamentary scrutiny when it is used."
 TFR_EST_pp_programme:0 "A Lean and Reliable State"
 TFR_EST_pp_programme_desc:0 "Complete a programme of productive enterprise, disciplined public contracts and competent essential services. Its active benefits depend on a Parempoolsed prime minister."
 TFR_EST_secure_records:0 "Secure Public Records"
 TFR_EST_secure_records_desc:0 "Protect digital services with offline backups, access audits and rehearsed recovery procedures. Secure records are a foundation of ordinary administration and wartime continuity."
 TFR_EST_technical_training:0 "Technical Skills for Estonia"
 TFR_EST_technical_training_desc:0 "Expand practical training in electronics, maintenance and software support. A technically capable workforce is useful to employers, public services and the armed forces."
 TFR_EST_tartu_research:0 "Tartu Research Cooperation"
 TFR_EST_tartu_research_desc:0 "Connect universities with practical research projects that Estonia can afford. Funding must concentrate on maintainable capabilities rather than prestige facilities."
 TFR_EST_rural_broadband:0 "Connect Rural Public Services"
 TFR_EST_rural_broadband_desc:0 "Improve the reliability of public communications outside the capital. Local offices require connectivity and trained staff to provide services during an emergency."
 TFR_EST_cyber_exercises:0 "National Cyber Exercises"
 TFR_EST_cyber_exercises_desc:0 "Test how public services respond when networks are interrupted or records are compromised. The value lies in discovering weaknesses before an attacker does."
 TFR_EST_digital_civic_compact:0 "A Digital Civic Compact"
 TFR_EST_digital_civic_compact_desc:0 "Explain how the state uses data and how citizens can challenge errors. Strong safeguards make secure systems useful and preserve trust when emergency powers expand."
 TFR_EST_industrial_survey:0 "Survey the Industrial Base"
 TFR_EST_industrial_survey_desc:0 "Identify workshops, manufacturers and maintenance firms capable of supporting national resilience. Production plans must begin with facilities and skills that actually exist."
 TFR_EST_tallinn_industry:0 "Tallinn Industrial Development"
 TFR_EST_tallinn_industry_desc:0 "Provide a serviced production site in Northern Estonia and support viable manufacturers. This investment expands civilian capacity while adding a visible public debt commitment."
 TFR_EST_livonia_logistics:0 "Livonian Logistics Improvements"
 TFR_EST_livonia_logistics_desc:0 "Improve the routes linking southern communities, industrial sites and national distribution networks. Civil transport and military supply share the same bridges and roads."
 TFR_EST_defence_contracts:0 "Practical Defence Contracts"
 TFR_EST_defence_contracts_desc:0 "Domestic firms can produce basic supplies, repair equipment and improve maintenance. Fund a modest defence production facility in Estonian Livonia."
 TFR_EST_maintenance_network:0 "National Maintenance Network"
 TFR_EST_maintenance_network_desc:0 "Common tools, skills and repair contracts improve the value of limited industrial capacity."
 TFR_EST_productive_republic:0 "A Productive Small Republic"
 TFR_EST_productive_republic_desc:0 "Coordinate vocational training, infrastructure and investment decisions around a realistic industrial strategy. Estonia should produce what it can maintain and cooperate for the rest."
 TFR_EST_energy_audit:0 "Audit Energy Security"
 TFR_EST_energy_audit_desc:0 "Catalogue supply dependencies, grid bottlenecks and emergency demand. A clear picture of the system is required before deciding which expensive investments matter most."
 TFR_EST_ida_viru_transition:0 "Ida-Viru Employment and Energy"
 TFR_EST_ida_viru_transition_desc:0 "Changes to the energy system threaten livelihoods in Ida-Viru. Fund training and civilian industrial capacity so resilience does not leave the region without a future."
 TFR_EST_grid_resilience:0 "A More Resilient Grid"
 TFR_EST_grid_resilience_desc:0 "Improve redundancy and emergency repair arrangements in the north-east. Power systems need workable alternative routes, stocked spares and trained repair teams."
 TFR_EST_emergency_energy:0 "Emergency Energy Stocks"
 TFR_EST_emergency_energy_desc:0 "Allocate funds to emergency fuel distribution and essential-service supply plans. Stock management and transport agreements matter more than a paper promise of self-sufficiency."
 TFR_EST_affordable_heat:0 "Reliable Heat for Households"
 TFR_EST_affordable_heat_desc:0 "Municipal heating and emergency shelter plans should keep homes habitable under pressure. Target assistance at vulnerable residents and protect essential repairs."
 TFR_EST_resilient_utilities:0 "Utilities That Can Survive a Crisis"
 TFR_EST_resilient_utilities_desc:0 "Complete joint exercises between municipalities, utilities and emergency authorities. The resulting plans will improve preparedness without replacing future maintenance expenditure."
 TFR_EST_reserve_register:0 "Audit the Reserve Register"
 TFR_EST_reserve_register_desc:0 "Confirm reservist records, employers and assigned specialties. Readiness depends on knowing whom the army can call and how those people reach their units."
 TFR_EST_kaitseliit_training:0 "Kaitseliit Training Standards"
 TFR_EST_kaitseliit_training_desc:0 "The Defence League gives Estonia reach beyond the regular force. Improve instructor standards and common procedures so local initiative supports coherent national plans."
 TFR_EST_reserve_training_exercise:0 "Exercise the Reserves"
 TFR_EST_reserve_training_exercise_desc:0 "Fund an integrated reserve exercise with transport, communications and employer coordination. Training will reveal shortages that must be met through normal procurement."
 TFR_EST_reserve_depots:0 "Dispersed Reserve Depots"
 TFR_EST_reserve_depots_desc:0 "Organize secure stores and issue procedures away from a few obvious facilities. Maintainability and inventory control will determine whether those stocks reach the right units."
 TFR_EST_mobilization_plans:0 "A Mobilization Plan That Works"
 TFR_EST_mobilization_plans_desc:0 "Approve recruitment and training plans for additional reserve units. The decision remains available when readiness is sufficient; soldiers and equipment must still enter through the normal recruitment system."
 TFR_EST_total_defence:0 "Total Defence Plan"
 TFR_EST_total_defence_desc:0 "Clear responsibilities link the regular force, reserves, Defence League and municipal services."
 TFR_EST_logistics_audit:0 "Audit Wartime Logistics"
 TFR_EST_logistics_audit_desc:0 "Survey roads, fuel distribution, repair capacity and likely congestion. Plans should begin with the actual movement of forces and supplies, including support from allies."
 TFR_EST_northern_routes:0 "Improve Northern Supply Routes"
 TFR_EST_northern_routes_desc:0 "Expand movement capacity around the capital and its approaches. Reliable roads help civilian evacuation and the timely distribution of military supplies."
 TFR_EST_tartu_distribution:0 "The Tartu Distribution Network"
 TFR_EST_tartu_distribution_desc:0 "Strengthen the southern distribution network with improved infrastructure and rehearsed convoy routing. Supplies must move even when a major road is interrupted."
 TFR_EST_field_repair:0 "Field Repair and Recovery"
 TFR_EST_field_repair_desc:0 "Train repair teams and establish contracts for returning damaged equipment to service. This will improve logistical efficiency without supplying equipment that Estonia has not bought."
 TFR_EST_air_defence_sites:0 "Prepared Air Defence Sites"
 TFR_EST_air_defence_sites_desc:0 "Prepare permanent air defence infrastructure near Tallinn. The sites help protect vital facilities, but Estonia still needs equipment, trained crews and allied air support."
 TFR_EST_national_supply_plan:0 "The National Supply Plan"
 TFR_EST_national_supply_plan_desc:0 "Unify military logistics with municipal and commercial distribution arrangements. Clear priorities will reduce avoidable consumption under wartime pressure."
 TFR_EST_allied_liaison:0 "Permanent Allied Liaison"
 TFR_EST_allied_liaison_desc:0 "Maintain working relationships with allied commands and diplomatic services. Estonia’s forces need compatible plans rather than an assumption that foreign aid will arrive automatically."
 TFR_EST_interoperability:0 "Interoperable Communications"
 TFR_EST_interoperability_desc:0 "Fund compatible communications and train staff in allied procedures. Equipment and doctrine should help Estonian units operate alongside larger partners."
 TFR_EST_allied_receiving:0 "Receive Allied Forces"
 TFR_EST_allied_receiving_desc:0 "Plan the movement, basing and support of visiting forces with local authorities. This complements existing NATO reinforcement arrangements and never creates a duplicate allied army."
 TFR_EST_realistic_procurement:0 "Procurement We Can Sustain"
 TFR_EST_realistic_procurement_desc:0 "Choose maintainable equipment, verify suppliers and train crews before increasing commitments. Make paid procurement decisions available instead of issuing unlimited free stocks."
 TFR_EST_air_warning:0 "Integrated Air Warning"
 TFR_EST_air_warning_desc:0 "Improve the infrastructure used to detect and report air threats. Warning is useful even when Estonia must rely on allied aircraft for interception."
 TFR_EST_prepared_alliance:0 "A Prepared Member of the Alliance"
 TFR_EST_prepared_alliance_desc:0 "Complete a practical allied support plan and exercise the command arrangements. Estonia retains responsibility for its defence while using collective strength effectively."
 TFR_EST_prepared_positions:0 "Prepared Defensive Positions"
 TFR_EST_prepared_positions_desc:0 "Defensive works around Tallinn and Narva can buy time for mobilization and allied action. Fund modest permanent positions in provinces Estonia owns and controls; the works remain useful only with trained forces and functioning supply."
 TFR_EST_artillery_observers:0 "Artillery Observation and Coordination"
 TFR_EST_artillery_observers_desc:0 "Estonia’s artillery must make limited equipment count. Train observers, improve communications and rehearse coordination with infantry and allied fire support. This focus grants experience and readiness; equipment must still be produced or procured."
 TFR_EST_air_defence_integration:0 "Integrate Air Defence and Warning"
 TFR_EST_air_defence_integration_desc:0 "Air warning, prepared sites and allied liaison need one reporting procedure. Train crews and command staff around realistic limits, so a small air defence network can support civilian protection and military movement."
 TFR_EST_first_emergency:0 "The First European War"
 TFR_EST_first_emergency_desc:0 "The first continental war has reached Estonia’s campaign. Convene the emergency cabinet, maintain the constitutional chain of authority and put existing preparedness plans into operation."
 TFR_EST_first_civil_protection:0 "Protect the Civilian Population"
 TFR_EST_first_civil_protection_desc:0 "Coordinate shelters, hospitals and evacuation routes with the needs of the field army. Clear information will reduce panic and keep essential services operating."
 TFR_EST_first_reserve_call:0 "Put the Reserve Plan into Effect"
 TFR_EST_first_reserve_call_desc:0 "Open the recruitment plan for additional reserve formations. Equipment and manpower remain real constraints, while readiness determines how quickly those units can be organized."
 TFR_EST_first_command:0 "An Emergency Joint Staff"
 TFR_EST_first_command_desc:0 "Reduce delays between army headquarters, Kaitseliit and civilian authorities. The staff must coordinate defence while keeping responsibility for political decisions with the cabinet."
 TFR_EST_first_supply:0 "Keep the Supply Routes Open"
 TFR_EST_first_supply_desc:0 "Move maintenance teams, reserve transport and essential stores according to wartime priorities. Sustained logistics can compensate for some disadvantages of size."
 TFR_EST_first_allied_staff:0 "The Allied Staff Network"
 TFR_EST_first_allied_staff_desc:0 "Keep liaison officers connected to functioning allied commands. Joint procedures and reliable reporting can make outside support useful without assuming any particular ally will survive."
 TFR_EST_first_emergency_laws:0 "Emergency Laws with a Mandate"
 TFR_EST_first_emergency_laws_desc:0 "Parliament must decide how far emergency authority extends and when it will be reviewed. Discipline and legitimacy both matter while the republic fights for survival."
 TFR_EST_first_defend_capital:0 "Defend the Capital’s Institutions"
 TFR_EST_first_defend_capital_desc:0 "Disperse vital records and organize the protection of national institutions. Even if Tallinn becomes a battlefield, lawful authority and public communication must continue."
 TFR_EST_first_endurance:0 "A Small State Can Endure"
 TFR_EST_first_endurance_desc:0 "Coordinate relief for displaced people, rest rotations and the repair of essential services. Estonia’s war effort must remain sustainable beyond the opening emergency."
 TFR_EST_first_lessons:0 "Record the First War’s Lessons"
 TFR_EST_first_lessons_desc:0 "Collect evidence from military operations and civilian administration before experience is lost. Preparation for recovery and future threats starts while the lessons are fresh."
 TFR_EST_reconstruction_audit:0 "Assess the Damage"
 TFR_EST_reconstruction_audit_desc:0 "The first war’s settlement has changed the republic’s position. Count damaged services, industrial losses and displaced families before making promises about recovery."
 TFR_EST_reconstruction_services:0 "Restore Essential Services"
 TFR_EST_reconstruction_services_desc:0 "Repair the administrative links, healthcare provision and municipal services that keep daily life possible. Recovery must reach functioning Estonian territory, including a reduced republic."
 TFR_EST_returning_families:0 "Help Families Rebuild"
 TFR_EST_returning_families_desc:0 "Assist displaced residents with documents, housing access and employment services. Recovery should reduce exclusion rather than creating a permanent division between returnees and those who stayed."
 TFR_EST_reconstruction_industry:0 "Restart Civilian Production"
 TFR_EST_reconstruction_industry_desc:0 "Repair capacity and reliable infrastructure must precede new contracts. Invest in civilian manufacturing in the capital region where Estonia retains ownership and control."
 TFR_EST_reconstruction_accounts:0 "Publish the Recovery Accounts"
 TFR_EST_reconstruction_accounts_desc:0 "Emergency expenditure deserves scrutiny after the immediate crisis. Audit contracts and publish the debt commitment so recovery strengthens institutional trust."
 TFR_EST_reconstruction_defence:0 "Rebuild Defence on Evidence"
 TFR_EST_reconstruction_defence_desc:0 "Use wartime experience to revise training and maintenance plans. The new force must reflect available territory, manpower and equipment."
 TFR_EST_reconstruction_partners:0 "Rebuild Working Partnerships"
 TFR_EST_reconstruction_partners_desc:0 "Re-establish practical diplomatic, trade and military links with governments that remain able to cooperate. Estonia should adapt to the settlement rather than relying on a vanished international order."
 TFR_EST_interwar_watch:0 "Watch the Next Gathering Storm"
 TFR_EST_interwar_watch_desc:0 "The first settlement may not have ended Europe’s crisis. Keep contingency plans current while restoring ordinary politics and preparing to respond to another continental war."
 TFR_EST_second_emergency:0 "Europe at War Again"
 TFR_EST_second_emergency_desc:0 "A second European war has begun. Activate the revised emergency plan and account for the political and territorial position inherited from the first settlement."
 TFR_EST_second_readiness:0 "Readiness Without Illusions"
 TFR_EST_second_readiness_desc:0 "Review the force we can actually field, the stores we possess and the routes still available. Commitments must be based on current capacity rather than plans written before the first war."
 TFR_EST_second_local_networks:0 "Local Networks Under Pressure"
 TFR_EST_second_local_networks_desc:0 "Municipal authorities and trained volunteers can sustain services when national links are disrupted. Distribute clear responsibilities and emergency communications procedures."
 TFR_EST_second_reserve_renewal:0 "Renew the Reserve System"
 TFR_EST_second_reserve_renewal_desc:0 "Update recruitment arrangements and refresh reserve training. The plan unlocks normal recruitment if not already established, while all equipment remains subject to supply."
 TFR_EST_second_maintenance:0 "Keep the Army Serviceable"
 TFR_EST_second_maintenance_desc:0 "Fund field repair arrangements and prioritize compatible equipment. In a long war, recovering usable systems is often more realistic than replacing every loss with a new purchase."
 TFR_EST_second_common_command:0 "A Common Operational Picture"
 TFR_EST_second_common_command_desc:0 "Coordinate reports, supply priorities and liaison with surviving partners. Clear information allows Estonia to contribute effectively without surrendering its command responsibilities."
 TFR_EST_second_constitution:0 "Preserve the Republic’s Mandate"
 TFR_EST_second_constitution_desc:0 "A second emergency must still answer to lawful political authority. Decide how to maintain scrutiny and public support under renewed pressure."
 TFR_EST_second_supply_resilience:0 "Supply Through Disruption"
 TFR_EST_second_supply_resilience_desc:0 "Apply the first war’s lessons to dispersed repair, transport and distribution. Fund a renewed logistics exercise tied to the territory we control."
 TFR_EST_second_social_endurance:0 "Endurance for Soldiers and Citizens"
 TFR_EST_second_social_endurance_desc:0 "Support families, displaced residents and exhausted essential workers. A war effort that consumes the society it defends cannot last indefinitely."
 TFR_EST_second_republic_survives:0 "Carry the Republic Through"
 TFR_EST_second_republic_survives_desc:0 "Maintain lawful authority, functioning institutions and the means to continue after the second settlement. Survival gives Estonia the opportunity to recover its future."
 TFR_EST_second_settlement:0 "After the Second Settlement"
 TFR_EST_second_settlement_desc:0 "The second war has reached a settlement. The republic must assess its borders, partners and obligations before rebuilding the institutions that can serve its people."
 TFR_EST_postwar_repairs:0 "Repair the Republic Again"
 TFR_EST_postwar_repairs_desc:0 "Restore transport and public services around Tallinn where the state retains control. Recovery requires a funded commitment, even when political attention turns elsewhere."
 TFR_EST_postwar_industry:0 "Industry for Recovery"
 TFR_EST_postwar_industry_desc:0 "Support a durable civilian production base in Northern Estonia. New capacity should serve employment and essential goods before ambitious military projects."
 TFR_EST_postwar_accountability:0 "Accountability After Emergency"
 TFR_EST_postwar_accountability_desc:0 "Bring exceptional powers and contracts back before parliament. A state that survived war must recover the ordinary rights and oversight that give survival meaning."
 TFR_EST_postwar_security:0 "A Sustainable Security Policy"
 TFR_EST_postwar_security_desc:0 "Maintain trained forces and a credible reserve plan within the resources of the surviving republic. End emergency habits that no longer contribute to defence."
 TFR_EST_postwar_future:0 "Estonia Has a Future"
 TFR_EST_postwar_future_desc:0 "Conclude the two-war campaign with a programme of lawful government, viable services and realistic security. The next generation deserves institutions capable of managing peace."
 TFR_EST_restored_authority:0 "Independent Authority Restored"
 TFR_EST_restored_authority_desc:0 "An occupation has ended and Estonia once again controls its own government. The first task is to identify lawful authority, restore records and prepare the election that will give the cabinet a fresh mandate."
 TFR_EST_restore_civic_rights:0 "Restore Civic Rights"
 TFR_EST_restore_civic_rights_desc:0 "Reopen civic organizations, independent public debate and fair access to administration. Restoration should apply clear legal standards rather than private revenge."
 TFR_EST_review_occupation_records:0 "Review Occupation Records"
 TFR_EST_review_occupation_records_desc:0 "Investigate abuses through lawful procedures and preserve evidence. Distinguish coerced survival from deliberate wrongdoing so accountability can strengthen trust."
 TFR_EST_restore_local_services:0 "Restore Local Services"
 TFR_EST_restore_local_services_desc:0 "Rebuild the municipal staff and service arrangements weakened during occupation. Target resources at territory the independent state actually controls."
 TFR_EST_restore_defence_command:0 "Reconstitute the Defence Command"
 TFR_EST_restore_defence_command_desc:0 "Review personnel, training and equipment before re-establishing military responsibilities. Retain useful skills while restoring accountable national command."
 TFR_EST_restoration_compact:0 "A Restoration Compact"
 TFR_EST_restoration_compact_desc:0 "Bring government, opposition and municipalities together around the restored constitutional order. Elections and practical recovery must give the republic a future beyond the occupation’s divisions."
 TFR_EST_government_continuity:0 "Government Continuity"
 TFR_EST_government_continuity_desc:0 "Secure communications, administrative backups and remote procedures keep government functioning when ordinary meetings are disrupted."
 TFR_EST_open_administration:0 "Open Administration"
 TFR_EST_open_administration_desc:0 "Public information and procurement scrutiny give emergency decisions a stronger foundation of trust."
 TFR_EST_secure_digital_state:0 "Secure Digital State"
 TFR_EST_secure_digital_state_desc:0 "Protected records and rehearsed recovery procedures improve the efficiency of public administration."
 TFR_EST_research_partnerships:0 "Practical Research Partnerships"
 TFR_EST_research_partnerships_desc:0 "Estonian researchers and employers share a programme focused on useful, maintainable capabilities."
 TFR_EST_kaitseliit_network:0 "Kaitseliit Training Network"
 TFR_EST_kaitseliit_network_desc:0 "Common instructor standards help local volunteer units support coherent national defence plans."
 TFR_EST_field_repair_network:0 "Field Repair Network"
 TFR_EST_field_repair_network_desc:0 "Recovery teams and repair contracts reduce avoidable equipment losses in service."
 TFR_EST_joint_logistics:0 "Joint Logistics Plan"
 TFR_EST_joint_logistics_desc:0 "Military supply priorities are coordinated with municipalities and commercial transport."
 TFR_EST_wartime_transport:0 "Wartime Transport Priorities"
 TFR_EST_wartime_transport_desc:0 "Temporary distribution arrangements sustain forces and essential services during the European wars."
 TFR_EST_national_endurance:0 "National Endurance"
 TFR_EST_national_endurance_desc:0 "Relief and service continuity help the republic sustain an extended national emergency."
 TFR_EST_second_war_logistics:0 "Second-War Logistics"
 TFR_EST_second_war_logistics_desc:0 "The first war’s experience informs dispersed repair, distribution and transport priorities."
 TFR_EST_sustainable_security:0 "Sustainable National Security"
 TFR_EST_sustainable_security_desc:0 "Training and realistic procurement support a force the surviving republic can maintain."
 TFR_EST_pandemic_support:0 "Public Health Support"
 TFR_EST_pandemic_support_desc:0 "A funded public health response protects essential services and vulnerable households."
 TFR_EST_rights_review:0 "Emergency Rights Review"
 TFR_EST_rights_review_desc:0 "Regular scrutiny limits emergency powers to their stated purposes."
 TFR_EST_emergency_authority:0 "Temporary Emergency Authority"
 TFR_EST_emergency_authority_desc:0 "Rapid procedures improve administrative action but create an obligation to restore normal oversight."
 TFR_EST_reserve_plan_tt:0 "Unlocks the reserve mobilization decision. Recruitment uses normal manpower, equipment and training; no free equipped divisions are created. Requires readiness of at least 50 or an active war, independence and control of Northern Estonia."
 TFR_EST_procurement_plan_tt:0 "Unlocks paid domestic procurement decisions. Each contract is limited by a cooldown and adds public debt through TFR’s economic ledger."
 tfr_estonia_content.1.t:0 "The Republic in 2020"
 tfr_estonia_content.1.d:0 "The cabinet meets in Tallinn with a majority of 57 seats: Keskerakond, EKRE and Isamaa. Across the chamber stand Reform and the Social Democrats; Eesti 200 seeks a place in parliament. President Kersti Kaljulaid remains a distinct constitutional authority.\n\nAs international stability deteriorates, coalition disagreements cannot obscure the practical task of keeping the republic capable of governing."
 tfr_estonia_content.1.a:0 "A workable coalition and an accountable parliament."
 tfr_estonia_content.1.b:0 "Begin with a wider consultation."
 tfr_estonia_content.2.t:0 "The Public Health Response"
 tfr_estonia_content.2.d:0 "Hospital administrators, employers and municipal leaders warn that an epidemic could interrupt daily life and exhaust essential services. The cabinet can fund broad support or concentrate on immediate capacity. Both require visible expenditure and a clear plan for reviewing exceptional measures."
 tfr_estonia_content.2.a:0 "Support health services and vulnerable households."
 tfr_estonia_content.2.b:0 "Fund immediate capacity and preserve flexibility."
 tfr_estonia_content.3.t:0 "Distinct Responsibilities"
 tfr_estonia_content.3.d:0 "The president and prime minister discuss how emergency measures will be reviewed. The cabinet directs policy; the president must remain able to assess constitutional questions and represent the republic. Cooperation works best when those distinct responsibilities are explicit."
 tfr_estonia_content.3.a:0 "Publish a constitutional consultation protocol."
 tfr_estonia_content.3.b:0 "Rely on existing procedures and regular meetings."
 tfr_estonia_content.10.t:0 "Integration Through Participation"
 tfr_estonia_content.10.d:0 "Local leaders in Ida-Viru ask whether civic integration will bring practical opportunities or another set of political slogans. Language education and trusted local institutions can strengthen a shared republic, but progress demands a sustained commitment."
 tfr_estonia_content.10.a:0 "Fund language access and local civic projects."
 tfr_estonia_content.10.b:0 "Prioritize employment-linked language training."
 tfr_estonia_content.11.t:0 "The Cost of Budget Discipline"
 tfr_estonia_content.11.d:0 "The review of public spending has found duplication, but not every disputed service is unnecessary. Reform’s ministers must choose how much immediate consolidation to impose while schools and municipal authorities prepare for a wider crisis."
 tfr_estonia_content.11.a:0 "Phase savings and protect essential local services."
 tfr_estonia_content.11.b:0 "Implement the consolidation promptly."
 tfr_estonia_content.12.t:0 "Sovereignty and Practical Cooperation"
 tfr_estonia_content.12.d:0 "EKRE ministers want external commitments tested against Estonia’s sovereignty. Diplomats reply that cooperation provides protection and influence precisely because Estonia cannot act alone. The cabinet must decide how to present its review without closing useful channels."
 tfr_estonia_content.12.a:0 "Demand clear safeguards through negotiation."
 tfr_estonia_content.12.b:0 "Confront partners publicly."
 tfr_estonia_content.13.t:0 "Energy and Livelihoods"
 tfr_estonia_content.13.d:0 "Isamaa’s energy review identifies vulnerabilities alongside local jobs that depend on the current system. Rapid transition promises resilience but creates immediate social costs. A staged approach preserves jobs while taking longer to reduce exposure."
 tfr_estonia_content.13.a:0 "Fund a staged transition and worker support."
 tfr_estonia_content.13.b:0 "Accelerate resilience investment."
 tfr_estonia_content.14.t:0 "Paying for Public Services"
 tfr_estonia_content.14.d:0 "The Social Democratic cabinet has promised dependable healthcare, fair work and civil preparedness. Parliament now asks how these commitments will be funded. Honest choices can preserve trust even when no option is painless."
 tfr_estonia_content.14.a:0 "Phase the programme with transparent financing."
 tfr_estonia_content.14.b:0 "Deliver the expansion immediately."
 tfr_estonia_content.15.t:0 "The Pace of Institutional Reform"
 tfr_estonia_content.15.d:0 "Eesti 200’s proposals would consolidate administrative responsibilities. Local authorities warn that rapid changes may remove expertise and accessible services. The government must turn long-term ambition into a pace institutions can actually sustain."
 tfr_estonia_content.15.a:0 "Pilot the reform and publish results."
 tfr_estonia_content.15.b:0 "Proceed quickly with a national reorganization."
 tfr_estonia_content.16.t:0 "Restraint and Public Confidence"
 tfr_estonia_content.16.d:0 "Parempoolsed argues that disciplined spending protects future choices. Municipal representatives fear that abrupt cuts will make essential services unreliable. The new cabinet must decide what fiscal discipline means in practice."
 tfr_estonia_content.16.a:0 "Protect essentials and consolidate in stages."
 tfr_estonia_content.16.b:0 "Apply an immediate expenditure review."
 tfr_estonia_content.17.t:0 "A Governing Programme Enacted"
 tfr_estonia_content.17.d:0 "Parliament has carried a full governing programme into law. The reforms become part of Estonia’s political history. Administrative coordination associated with this programme remains strongest while its party leads a confirmed cabinet; a future election can bring another programme into office."
 tfr_estonia_content.17.a:0 "Invite scrutiny of the programme’s results."
 tfr_estonia_content.17.b:0 "Concentrate on implementation."
 tfr_estonia_content.20.t:0 "A Digital State and Its Citizens"
 tfr_estonia_content.20.d:0 "More public services now depend on connected records. Officials want broad access during emergencies, while civic groups ask for independent review of how that power is used. Security and public trust require practical rules rather than absolute promises."
 tfr_estonia_content.20.a:0 "Publish access rules and support independent review."
 tfr_estonia_content.20.b:0 "Expand emergency access under cabinet supervision."
 tfr_estonia_content.30.t:0 "The Emergency Cabinet Convenes"
 tfr_estonia_content.30.d:0 "War has reached Estonia’s campaign. Ministers receive reports on mobilization, civilian services and allied operations. The government must give the public a clear account of what it can do and where it depends on partners."
 tfr_estonia_content.30.a:0 "Explain the situation and preserve scrutiny."
 tfr_estonia_content.30.b:0 "Concentrate emergency authority in the cabinet."
 tfr_estonia_content.31.t:0 "Emergency Powers Before Parliament"
 tfr_estonia_content.31.d:0 "The emergency bill provides faster procurement, requisitioning and movement controls. Its supporters warn against delay; critics insist that expiry dates and compensation are essential to legitimacy. Parliament must choose the form of authority it grants."
 tfr_estonia_content.31.a:0 "Grant powers with scheduled parliamentary review."
 tfr_estonia_content.31.b:0 "Grant broader temporary executive authority."
 tfr_estonia_content.40.t:0 "The First Settlement"
 tfr_estonia_content.40.d:0 "The first European war has ended for the current campaign stage. Its settlement has reshaped borders and alliances. Estonia must assess the resources it still controls and decide whether recovery begins with household security or the productive base."
 tfr_estonia_content.40.a:0 "Restore household and municipal services first."
 tfr_estonia_content.40.b:0 "Prioritize productive infrastructure and logistics."
 tfr_estonia_content.50.t:0 "A Second European Emergency"
 tfr_estonia_content.50.d:0 "The continent is at war again. The first conflict’s lessons remain useful, but forces, partners and territory may have changed. The cabinet must organize a new response around what Estonia can actually sustain."
 tfr_estonia_content.50.a:0 "Build a broad emergency consensus."
 tfr_estonia_content.50.b:0 "Give the emergency staff a rapid mandate."
 tfr_estonia_content.51.t:0 "The Constitution Through a Second War"
 tfr_estonia_content.51.d:0 "A renewed emergency has tested the patience of parliament and the public. Officials ask for faster authority while civic organizations warn that repeated exceptions may become permanent. The republic needs a decision that can endure scrutiny after the fighting."
 tfr_estonia_content.51.a:0 "Retain review and clear expiry dates."
 tfr_estonia_content.51.b:0 "Renew temporary broad cabinet powers."
 tfr_estonia_content.60.t:0 "Beyond the Second War"
 tfr_estonia_content.60.d:0 "The second settlement has left Estonia with a changed European environment. The country’s survival creates an opportunity to restore ordinary government and a sustainable economy. A durable future now matters more than emergency prestige."
 tfr_estonia_content.60.a:0 "Restore civic life and account for emergency powers."
 tfr_estonia_content.60.b:0 "Begin with security and reconstruction planning."
 tfr_estonia_content.70.t:0 "The Republic Governs Itself Again"
 tfr_estonia_content.70.d:0 "Occupation has ended. Civil servants recover files, communities reopen organizations and political parties prepare to compete openly. The independence settlement brings its own uncertainties, but authority can now return to a constitutional mandate."
 tfr_estonia_content.70.a:0 "Rebuild lawful institutions and prepare elections."
 tfr_estonia_content.70.b:0 "Prioritize immediate administrative continuity."
 tfr_estonia_content.71.t:0 "Justice After Occupation"
 tfr_estonia_content.71.d:0 "Occupation records contain evidence of coercion, collaboration and abuses. Families demand accountability, while officials warn against accusations becoming private retaliation. The restored republic must choose a process worthy of its laws."
 tfr_estonia_content.71.a:0 "Use independent courts and publish clear standards."
 tfr_estonia_content.71.b:0 "Prioritize a limited review of documented abuses."
 tfr_estonia_content.81.t:0 "Competence Under Fire"
 tfr_estonia_content.81.d:0 "Reform’s cabinet argues that accurate information and disciplined procurement are essential in the first war. Parliament also needs to know whether emergency efficiency will come with protection for citizens excluded from digital services."
 tfr_estonia_content.81.a:0 "Keep services accessible and publish commitments."
 tfr_estonia_content.81.b:0 "Prioritize command and procurement efficiency."
 tfr_estonia_content.91.t:0 "Reform Faces Another War"
 tfr_estonia_content.91.d:0 "The second war tests Reform’s commitment to openness and sustainable administration. Ministers debate whether to fund additional service access or concentrate the next tranche of emergency spending on interoperable defence planning."
 tfr_estonia_content.91.a:0 "Protect transparent and accessible public services."
 tfr_estonia_content.91.b:0 "Fund interoperable command and maintenance."
 tfr_estonia_content.82.t:0 "A Broad Social Defence"
 tfr_estonia_content.82.d:0 "Keskerakond ministers emphasize that a government cannot mobilize society without protecting the households that carry its burdens. Coalition partners favor concentrating resources on immediate military requirements. The cabinet must choose how to present its first-war programme."
 tfr_estonia_content.82.a:0 "Protect families and municipal services."
 tfr_estonia_content.82.b:0 "Prioritize reserve administration and supply."
 tfr_estonia_content.92.t:0 "Keskerakond in the Second Emergency"
 tfr_estonia_content.92.d:0 "The second war arrives after Estonia has already endured a continental settlement. Keskerakond’s cabinet can renew a broad social compact or put its limited resources into recovering practical defence capacity. Both choices demand cooperation beyond the party itself."
 tfr_estonia_content.92.a:0 "Renew the social compact for service families."
 tfr_estonia_content.92.b:0 "Fund reserve recovery and municipal logistics."
 tfr_estonia_content.83.t:0 "National Mobilization and Allied Support"
 tfr_estonia_content.83.d:0 "EKRE’s first-war cabinet must turn sovereignty into practical survival. Local organization gives the state reach, while allied liaison offers capabilities Estonia cannot supply alone. Political rhetoric now has to serve a workable defence plan."
 tfr_estonia_content.83.a:0 "Put county volunteers and civil duty first."
 tfr_estonia_content.83.b:0 "Prioritize practical allied military coordination."
 tfr_estonia_content.93.t:0 "Sovereignty Through a Second War"
 tfr_estonia_content.93.d:0 "After one European settlement, EKRE must assess what independence requires in another war. A domestic mobilization campaign can rally supporters; cooperation with surviving partners can improve the force’s practical effectiveness."
 tfr_estonia_content.93.a:0 "Renew domestic preparedness with local guarantees."
 tfr_estonia_content.93.b:0 "Reaffirm allied cooperation under Estonian command."
 tfr_estonia_content.84.t:0 "Institutions in the First War"
 tfr_estonia_content.84.d:0 "Isamaa’s cabinet treats the continuity of national institutions as a defence responsibility. The army wants clearer territorial plans, while municipal leaders ask that legal authority and essential services remain accessible if Tallinn is disrupted."
 tfr_estonia_content.84.a:0 "Protect constitutional and local continuity."
 tfr_estonia_content.84.b:0 "Concentrate on territorial command exercises."
 tfr_estonia_content.94.t:0 "The Nation Across Two Wars"
 tfr_estonia_content.94.d:0 "Isamaa faces another emergency with institutions already tested by the first war. Its ministers can fund civilian continuity across counties or renew territorial defence planning around the republic’s current borders."
 tfr_estonia_content.94.a:0 "Keep county institutions and family services working."
 tfr_estonia_content.94.b:0 "Review territorial defence against the present map."
 tfr_estonia_content.85.t:0 "Solidarity in the First War"
 tfr_estonia_content.85.d:0 "The Social Democratic cabinet argues that civil resilience and fair emergency work protect the war effort. Military officers ask for reliable service-family arrangements, while local authorities warn that healthcare and relief cannot absorb every new duty."
 tfr_estonia_content.85.a:0 "Fund relief and essential public services."
 tfr_estonia_content.85.b:0 "Prioritize reservist families and emergency work."
 tfr_estonia_content.95.t:0 "Solidarity Under Renewed Pressure"
 tfr_estonia_content.95.d:0 "A second war brings exhausted services and households into another national emergency. The Social Democrats must decide how to distribute limited support between immediate civilian needs and the practical arrangements that sustain mobilization."
 tfr_estonia_content.95.a:0 "Renew household relief and healthcare support."
 tfr_estonia_content.95.b:0 "Fund service families and civil logistics."
 tfr_estonia_content.86.t:0 "Long-Term Plans Meet the First War"
 tfr_estonia_content.86.d:0 "Eesti 200’s cabinet must adapt plans written for gradual reform to the urgency of war. It can preserve education and administrative continuity or give its review teams a more immediate role in defence coordination."
 tfr_estonia_content.86.a:0 "Protect schools and administrative continuity."
 tfr_estonia_content.86.b:0 "Apply the review programme to defence coordination."
 tfr_estonia_content.96.t:0 "A Future Beyond the Second War"
 tfr_estonia_content.96.d:0 "Eesti 200’s long-term ambitions have survived one settlement and now face another war. Reconstruction planning can keep future institutions viable, but the immediate field force also needs adaptable maintenance and training arrangements."
 tfr_estonia_content.96.a:0 "Keep education and recovery planning alive."
 tfr_estonia_content.96.b:0 "Prioritize adaptable training and field repair."
 tfr_estonia_content.87.t:0 "Discipline During the First War"
 tfr_estonia_content.87.d:0 "Parempoolsed’s cabinet must apply fiscal and procurement discipline to a national emergency. Immediate checks can prevent waste, while service guarantees protect confidence in a government still proving its ability to lead."
 tfr_estonia_content.87.a:0 "Audit contracts while protecting essential services."
 tfr_estonia_content.87.b:0 "Concentrate on procurement and maintenance costs."
 tfr_estonia_content.97.t:0 "A Reliable State in the Second War"
 tfr_estonia_content.97.d:0 "The second war tests Parempoolsed’s argument that a disciplined state can preserve resources for crisis. The cabinet can strengthen public accountability or concentrate new expenditure on maintaining the force already available."
 tfr_estonia_content.97.a:0 "Keep emergency contracts open to scrutiny."
 tfr_estonia_content.97.b:0 "Fund maintainable equipment and reserve planning."
 TFR_EST_national_programmes:0 "National Programmes"
 TFR_EST_national_programmes_desc:0 "Fund domestic policy and administrative work between major reforms. Expenditure adds debt through TFR’s economic ledger. Completed reforms persist after elections; cabinet programme benefits follow the current confirmed government."
 TFR_EST_defence_programmes:0 "Defence Preparedness"
 TFR_EST_defence_programmes_desc:0 "Readiness supports reserve organization, training and logistics. Mobilization unlocks a recruitment template and training arrangements; units must still be trained with normal manpower and equipment. Allied reinforcement decisions remain governed by TFR."
 TFR_EST_municipal_roundtable:0 "Convene a Municipal Roundtable"
 TFR_EST_municipal_roundtable_desc:0 "Bring mayors and service administrators together to resolve practical access problems. Costs 35 political power and €15 million in public debt; increases cohesion by 2. Available every 180 days."
 TFR_EST_publish_accounts:0 "Publish Programme Accounts"
 TFR_EST_publish_accounts_desc:0 "Open public expenditure and implementation data to independent review. Costs 30 political power; increases cohesion by 1. Available every 180 days."
 TFR_EST_service_rehearsal:0 "Rehearse Essential Service Continuity"
 TFR_EST_service_rehearsal_desc:0 "Test municipal communications, records and staffing arrangements. Costs 40 political power and €20 million in public debt; increases readiness by 2 and cohesion by 1. Available every 180 days."
 TFR_EST_regional_training:0 "Fund Regional Technical Training"
 TFR_EST_regional_training_desc:0 "Support vocational training linked to local employers. Costs 35 political power and €30 million in public debt; increases cohesion by 2 and grants 5 army experience through maintenance training. Available every 365 days."
 TFR_EST_reform_public_meetings:0 "Reform: Public Programme Meetings"
 TFR_EST_reform_public_meetings_desc:0 "Explain the governing programme and hear local objections. Costs 40 political power and €10 million in public debt; increases cohesion by 1 and shifts polling support through the party campaign system. Requires a confirmed Reform government. Available every 180 days."
 TFR_EST_centre_public_meetings:0 "Keskerakond: Public Programme Meetings"
 TFR_EST_centre_public_meetings_desc:0 "Explain the governing programme and hear local objections. Costs 40 political power and €10 million in public debt; increases cohesion by 1 and shifts polling support through the party campaign system. Requires a confirmed Keskerakond government. Available every 180 days."
 TFR_EST_ekre_public_meetings:0 "EKRE: Public Programme Meetings"
 TFR_EST_ekre_public_meetings_desc:0 "Explain the governing programme and hear local objections. Costs 40 political power and €10 million in public debt; increases cohesion by 1 and shifts polling support through the party campaign system. Requires a confirmed EKRE government. Available every 180 days."
 TFR_EST_isamaa_public_meetings:0 "Isamaa: Public Programme Meetings"
 TFR_EST_isamaa_public_meetings_desc:0 "Explain the governing programme and hear local objections. Costs 40 political power and €10 million in public debt; increases cohesion by 1 and shifts polling support through the party campaign system. Requires a confirmed Isamaa government. Available every 180 days."
 TFR_EST_sde_public_meetings:0 "Social Democrats: Public Programme Meetings"
 TFR_EST_sde_public_meetings_desc:0 "Explain the governing programme and hear local objections. Costs 40 political power and €10 million in public debt; increases cohesion by 1 and shifts polling support through the party campaign system. Requires a confirmed Social Democrats government. Available every 180 days."
