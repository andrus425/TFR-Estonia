 TFR_EST_reserve_mobilization:0 "Activate Reserve Recruitment"
 TFR_EST_reserve_mobilization_desc:0 "Unlock a reserve recruitment template and a limited training programme once. Costs 50 political power. Requires the reserve plan, readiness of at least 50 or an active war, independence and control of Northern Estonia. Recruit divisions normally; this decision does not create free manpower or equipment."
 TFR_EST_readiness_exercise:0 "Conduct a Readiness Exercise"
 TFR_EST_readiness_exercise_desc:0 "Rehearse movement, issue procedures and command communications. Costs 45 political power and €30 million in public debt; increases readiness by 3 and grants 8 army experience. Available every 180 days."
 TFR_EST_volunteer_training:0 "Train Local Civil Defence Volunteers"
 TFR_EST_volunteer_training_desc:0 "Fund first aid, emergency communication and distribution exercises. Costs 35 political power and €15 million in public debt; increases readiness by 2 and cohesion by 1. Available every 180 days."
 TFR_EST_lift_nato_restrictions:0 "Activate the National Defence Mandate"
 TFR_EST_lift_nato_restrictions_desc:0 "Replace Estonia’s inherited peacetime NATO military restrictions through the national mobilization transition. Costs 50 political power. Requires the completed opening programme, independence, and readiness of at least 50 or an active war. This transition can occur only once."
 TFR_EST_procure_infantry:0 "A Limited Infantry Equipment Contract"
 TFR_EST_procure_infantry_desc:0 "Order 500 sets of basic infantry equipment from the domestic production base. Costs 50 political power and €40 million in public debt. Requires the procurement plan and an Estonian military factory. The 365-day cooldown limits deliveries."
 TFR_EST_logistics_rehearsal:0 "Rehearse Wartime Distribution"
 TFR_EST_logistics_rehearsal_desc:0 "Fund a joint military and municipal transport exercise. Costs 35 political power and €25 million in public debt; increases readiness by 2 and grants 5 army experience. Available every 180 days."
 TFR_EST_AI_ROUTE:0 "Estonia: Preferred Campaigning Party"
 TFR_EST_RULE_DEFAULT:0 "Competitive Parliamentary Politics"
 TFR_EST_RULE_DEFAULT_DESC:0 "The opening 57-seat Ratas coalition is preserved. Subsequent coalition leadership goes to the party with the most elected seats; negotiations determine partners and confidence."
 TFR_EST_RULE_REFORM:0 "Reform"
 TFR_EST_RULE_REFORM_DESC:0 "AI Estonia favors Reform when campaigning for later elections. The chosen party must win the most seats before it can lead a coalition; this rule cannot override the electoral mandate. The historical opening coalition and parliamentary majority requirements remain intact. Parempoolsed becomes eligible only after its formation."
