 TFR_EST_covid_first_case_title:0 "Estonia Confirms Its First COVID-19 Case"
 TFR_EST_covid_first_case_desc:0 "The Health Board has announced Estonia's first confirmed case of COVID-19. Hospitals and health officials are coordinating the immediate response, while the cabinet must consider how to protect essential services and prepare for further infections. The outbreak has now reached Estonia; the coalition can begin its emergency-response programme."
 TFR_EST_covid_first_case_option:0 "The cabinet must prepare its response."
