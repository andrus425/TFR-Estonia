l_english:
 TFR_EST_opening_pension_reform:0 "Pass the Voluntary Second-Pillar Reform"
 TFR_EST_opening_pension_reform_desc:0 "Isamaa's pension reform would make participation in the second pillar voluntary, giving savers a choice over contributions and the use of accumulated funds. The Centre–Isamaa–EKRE cabinet must carry the bill through parliament and the constitutional review process. Prepare the administration and public guidance; this does not mean that pension withdrawals already occur in January 2020. The governing coalition needs at least 51 seats to pursue its programme."
 TFR_EST_opening_teacher_pay:0 "Teachers' Minimum Pay: €1,315"
 TFR_EST_opening_teacher_pay_desc:0 "The 2020 state budget raises the minimum monthly salary of a full-time general education teacher to €1,315. Fund the commitment and coordinate allocations with municipalities so the increase reaches schools across Estonia. The policy supports recruitment and retention while adding to the government's spending commitments. The coalition needs at least 51 seats to sustain its programme."
 TFR_EST_opening_covid_emergency:0 "Declare the COVID-19 Emergency"
 TFR_EST_opening_covid_emergency_desc:0 "The spread of COVID-19 requires the cabinet to coordinate the Health Board, hospitals, schools and border authorities. Estonia's emergency response in March 2020 includes restrictions on gatherings, remote learning and measures to reduce imported infections. Establish responsibility for those measures and keep essential government services working. COVID-19 must be present in Estonia before this response can begin. The coalition must command at least 51 parliamentary seats when it begins the response."
 TFR_EST_opening_pension_increase:0 "The €7 Extraordinary Pension Increase"
 TFR_EST_opening_pension_increase_desc:0 "Alongside annual indexation, the government adds €7 to the pension base amount from April 2020. Put this concrete Centre Party commitment into operation and provide pensioners with clear information about their payments. The increase offers predictable support during the public-health emergency, with a lasting cost to the state budget. The governing coalition needs at least 51 seats."
 TFR_EST_opening_wage_compensation:0 "Töötukassa Wage Compensation"
 TFR_EST_opening_wage_compensation_desc:0 "Use the Unemployment Insurance Fund's temporary wage-compensation programme to help employers retain workers when the pandemic cuts turnover and work. The initial scheme supports employment during March–May 2020 and requires substantial emergency financing. Administer the claims and eligibility checks so support preserves jobs rather than rewarding ineligible firms. The coalition needs at least 51 seats."
 TFR_EST_opening_excise_relief:0 "Cut Diesel and Electricity Excise"
 TFR_EST_opening_excise_relief_desc:0 "The emergency economic package lowers excise duties on diesel, electricity and several other energy products from May 2020. Implement the reductions to ease transport and energy costs for households and businesses, while accounting for the revenue the state forgoes. These are targeted changes to existing tax rates, not a promise of unlimited cheap energy. The governing coalition needs at least 51 seats."
 TFR_EST_opening_eastern_border:0 "Build the First 23.5 km of Eastern Border"
 TFR_EST_opening_eastern_border_desc:0 "Begin the first 23.5-kilometre construction stage of Estonia's land border with Russia. The 2020 contract covers the initial section, patrol access and supporting infrastructure; it does not complete the entire eastern border. Coordinate the Police and Border Guard Board, contractors and local access arrangements so the project improves practical border security. The governing coalition needs at least 51 seats."
 TFR_EST_opening_kose_voobu:0 "Open the Kose–Võõbu Highway"
 TFR_EST_opening_kose_voobu_desc:0 "Bring the 23-kilometre Kose–Võõbu section of the Tallinn–Tartu road into service as a divided highway. This concrete 2020 transport project improves safety and travel between the capital and central Estonia. Complete the opening, connect the new route to the road network and plan its maintenance; the focus represents one section rather than a rebuilt national highway system. The governing coalition needs at least 51 seats."
 TFR_EST_opening_three_seas:0 "Host the Tallinn Three Seas Summit"
 TFR_EST_opening_three_seas_desc:0 "Estonia hosts the Three Seas Initiative summit in Tallinn in October 2020, with President Kersti Kaljulaid representing the country alongside the government's work on transport, energy and digital connections. Organise the summit and its investment discussions to advance specific regional projects. Participation opens cooperation opportunities; it does not automatically deliver every proposed investment. The coalition needs at least 51 seats to sustain its commitments."
 TFR_EST_opening_research_budget:0 "Research Funding: 1% of GDP"
 TFR_EST_opening_research_budget_desc:0 "The 2021 state budget commits public research and development funding equivalent to one percent of GDP. Prepare the allocations and longer-term funding arrangements with universities and research institutions so the commitment becomes usable support. The additional spending strengthens Estonia's research base while competing with other budget priorities. The governing coalition needs at least 51 seats."
 TFR_EST_opening_marriage_referendum:0 "The Marriage Referendum Bill"
 TFR_EST_opening_marriage_referendum_desc:0 "The coalition brings forward the proposal for a spring 2021 referendum asking whether marriage should remain a union between a man and a woman. Complete the entire opening government programme before taking this final step. Once work on the bill begins, the player cannot cancel the focus, and ordinary confidence loss does not interrupt it. Ratas's resignation automatically ends the proposal and fails the focus. The Porto Franco investigation will force Jüri Ratas to decide whether to remain prime minister or step back while the parliamentary process is under way. This focus concerns the bill and its political crisis; it does not mean that the referendum has already taken place."
