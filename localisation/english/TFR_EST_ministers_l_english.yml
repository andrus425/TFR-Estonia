 TFR_EST_minister_one_office_tt:0 "This person holds no other cabinet portfolio and is not prime minister."
 TFR_EST_cabinet_formation:0 "Forming the Post-Election Cabinet"
 TFR_EST_cabinet_formation_desc:0 "For 90 days after a valid parliamentary election, appointments and replacements in the five minister portfolios cost 80% less political power. The normal 100 PP becomes 20 PP before other modifiers. Only coalition parties may provide ministers. The prime minister remains determined by the parliamentary mandate and scripted government changes."
