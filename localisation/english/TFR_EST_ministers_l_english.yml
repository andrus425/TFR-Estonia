 TFR_EST_minister_urmas_paet_foreign:0 "Urmas Paet"
 TFR_EST_minister_urmas_paet_foreign_desc:0 "§YReform nominee — Foreign Minister§!\nHistorical portfolio experience. Foreign Minister 2005–2014; Reform Party foreign-policy coordinator in 2020.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_jurgen_ligi_economic:0 "Jürgen Ligi"
 TFR_EST_minister_jurgen_ligi_economic_desc:0 "§YReform nominee — Economic Minister§!\nHistorical portfolio experience. Finance Minister 2009–2014; Reform member since 1994. TFR economic portfolio combines economic and fiscal responsibility.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_hanno_pevkur_interior:0 "Hanno Pevkur"
 TFR_EST_minister_hanno_pevkur_interior_desc:0 "§YReform nominee — Interior Minister§!\nHistorical portfolio experience. Interior Minister 2014–2016; Reform member since 2000.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_eerik_niiles_kross_intelligence:0 "Eerik-Niiles Kross"
 TFR_EST_minister_eerik_niiles_kross_intelligence_desc:0 "§YReform nominee — Intelligence Minister§!\nPlausible alternate-history appointment. Government security/intelligence experience and Senior Director for Intelligence Institutions Development in Iraq 2003–2004; Reform member since 2014.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_kalle_laanet_defence:0 "Kalle Laanet"
 TFR_EST_minister_kalle_laanet_defence_desc:0 "§YReform nominee — Defence Minister§!\nHistorical portfolio experience. Defence Minister 2021–2022; former Interior Minister and senior police official. Reform member since 2014, previously Centre 2005–2012. In the 2020 game he is a plausible future defence appointee, not yet the historical incumbent.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_enn_eesmaa_foreign:0 "Enn Eesmaa"
 TFR_EST_minister_enn_eesmaa_foreign_desc:0 "§YKeskerakond nominee — Foreign Minister§!\nPlausible alternate-history appointment. Foreign Affairs Committee chair 2019–2021 and previously 2005–2007; Centre member 2003–2024. A credible Centre foreign-minister appointment, never represented as an actual former Foreign Minister.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_taavi_aas_economic:0 "Taavi Aas"
 TFR_EST_minister_taavi_aas_economic_desc:0 "§YKeskerakond nominee — Economic Minister§!\nHistorical portfolio experience. Economic Affairs and Infrastructure Minister 2019–2022; Centre member at campaign start.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_jaak_aab_interior:0 "Jaak Aab"
 TFR_EST_minister_jaak_aab_interior_desc:0 "§YKeskerakond nominee — Interior Minister§!\nPlausible alternate-history appointment. Public Administration Minister in 2017–2018 and 2019–2020, and former Social Affairs Minister. Administrative experience supports a counterfactual Interior appointment. Centre in the starting timeline; the actual 2024 move to SDE is not projected backwards.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_kalle_klandorf_intelligence:0 "Kalle Klandorf"
 TFR_EST_minister_kalle_klandorf_intelligence_desc:0 "§YKeskerakond nominee — Intelligence Minister§!\nPlausible alternate-history appointment. Served in the Republic's Special Service and police 1991–2005; Centre candidate and Tallinn deputy mayor. This is a security-background inference, not a historical cabinet office.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_tiit_terik_defence:0 "Tiit Terik"
 TFR_EST_minister_tiit_terik_defence_desc:0 "§YKeskerakond nominee — Defence Minister§!\nPlausible alternate-history appointment. National Defence Committee member in 2016; Defence League member since 2010 and graduate of the Higher National Defence Course. Centre member since 2007. A plausible defence appointment, not a real former Defence Minister.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_urmas_reinsalu_foreign:0 "Urmas Reinsalu"
 TFR_EST_minister_urmas_reinsalu_foreign_desc:0 "§YIsamaa nominee — Foreign Minister§!\nHistorical portfolio experience. Foreign Minister 2019–2021; Isamaa's historical starting incumbent in this portfolio.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_sven_sester_economic:0 "Sven Sester"
 TFR_EST_minister_sven_sester_economic_desc:0 "§YIsamaa nominee — Economic Minister§!\nHistorical portfolio experience. Finance Minister 2015–2017 and Economic Affairs Committee chair 2017–2021; Res Publica/Isamaa member since 1999.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_marko_pomerants_interior:0 "Marko Pomerants"
 TFR_EST_minister_marko_pomerants_interior_desc:0 "§YIsamaa nominee — Interior Minister§!\nHistorical portfolio experience. Interior Minister 2009–2011; Res Publica/IRL/Isamaa member since 2002. Preferable to Ken-Marti Vaher, who withdrew from parliamentary politics in 2017.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_raivo_aeg_intelligence:0 "Raivo Aeg"
 TFR_EST_minister_raivo_aeg_intelligence_desc:0 "§YIsamaa nominee — Intelligence Minister§!\nPlausible alternate-history appointment. Internal Security Service Director General 2008–2013, Police Director General 2005–2008, intelligence oversight committee chair from 2016; Isamaa/IRL member since 2014 and Justice Minister at campaign start.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_juri_luik_defence:0 "Jüri Luik"
 TFR_EST_minister_juri_luik_defence_desc:0 "§YIsamaa nominee — Defence Minister§!\nHistorical portfolio experience. Defence Minister at campaign start; 2019 Isamaa European election candidate with extensive NATO and diplomatic experience.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_marina_kaljurand_foreign:0 "Marina Kaljurand"
 TFR_EST_minister_marina_kaljurand_foreign_desc:0 "§YSocial Democrats nominee — Foreign Minister§!\nHistorical portfolio experience. Foreign Minister 2015–2016; official SDE European election candidate and elected member in 2019. Her earlier non-party ministerial tenure does not prevent her being an SDE appointee from 2020.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_ivari_padar_economic:0 "Ivari Padar"
 TFR_EST_minister_ivari_padar_economic_desc:0 "§YSocial Democrats nominee — Economic Minister§!\nHistorical portfolio experience. Finance Minister 2007–2009 and former Agriculture Minister; Mõõdukad/SDE member since 1999.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_katri_raik_interior:0 "Katri Raik"
 TFR_EST_minister_katri_raik_interior_desc:0 "§YSocial Democrats nominee — Interior Minister§!\nHistorical portfolio experience. Interior Minister 2018–2019 and former Estonian Academy of Security Services rector; SDE member since September 2018, formerly Res Publica/IRL until 2017.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_andres_anvelt_intelligence:0 "Andres Anvelt"
 TFR_EST_minister_andres_anvelt_intelligence_desc:0 "§YSocial Democrats nominee — Intelligence Minister§!\nPlausible alternate-history appointment. Central Criminal Police director 2002–2003, security adviser to Defence Forces commander 2007–2011, Justice Minister 2014–2015 and later Interior Minister; SDE member in the starting timeline.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_sven_mikser_defence:0 "Sven Mikser"
 TFR_EST_minister_sven_mikser_defence_desc:0 "§YSocial Democrats nominee — Defence Minister§!\nHistorical portfolio experience. Defence Minister 2002–2003 and 2014–2015; SDE member since 2005 (previously Centre). Former NATO Parliamentary Assembly vice-president and defence committee rapporteur.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_trivimi_velliste_foreign:0 "Trivimi Velliste"
 TFR_EST_minister_trivimi_velliste_foreign_desc:0 "§YIsamaa nominee — Foreign Minister§!\nHistorical portfolio experience. Foreign Minister from October 1992 to January 1994 and Estonia's ambassador to the United Nations in 1994-1998. His parliamentary biography records Isamaa/IRL affiliation since 1992, and he stood on Isamaa's 2019 parliamentary list. A return to cabinet in the alternate timeline supplies a qualified foreign-minister alternative when Urmas Reinsalu is prime minister; it does not imply a historical ministerial appointment in 2020.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_mart_helme_foreign:0 "Mart Helme"
 TFR_EST_minister_mart_helme_foreign_desc:0 "§YEKRE nominee — Foreign Minister§!\nPlausible alternate-history appointment. Estonia's ambassador to Russia in 1995-1999 and EKRE leader at the campaign start. An inferred foreign-minister appointment based on a real diplomatic career; not a claim that he served as foreign minister. Exclude while he is prime minister or occupies the interior portfolio.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_martin_helme_economic:0 "Martin Helme"
 TFR_EST_minister_martin_helme_economic_desc:0 "§YEKRE nominee — Economic Minister§!\nHistorical portfolio experience. The actual finance minister in Ratas's second cabinet, 2019-2021. TFR's economic portfolio combines economic and financial administration. His historical EKRE affiliation is retained in the alternate timeline.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_alar_laneman_interior:0 "Alar Laneman"
 TFR_EST_minister_alar_laneman_interior_desc:0 "§YEKRE nominee — Interior Minister§!\nHistorical portfolio experience. The actual EKRE-appointed interior minister from 18 November 2020 to January 2021; a former Defence Forces chief of staff and brigadier general. This alternative permits a full EKRE cabinet when Mart Helme is prime minister. Do not automatically import his 2024 party departure into TFR's alternate timeline.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_ants_frosch_intelligence:0 "Ants Frosch"
 TFR_EST_minister_ants_frosch_intelligence_desc:0 "§YEKRE nominee — Intelligence Minister§!\nHistorical portfolio experience. Director General of Estonia's Information Board/Foreign Intelligence Service in 1992-1999 and subsequently an ambassador. His intelligence qualification directly matches the TFR slot. His EKRE affiliation begins in 2021 in the official biography; using him as an EKRE nominee earlier is alternate-timeline recruitment. Later real-world party changes are not automatic campaign events.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_leo_kunnas_defence:0 "Leo Kunnas"
 TFR_EST_minister_leo_kunnas_defence_desc:0 "§YEKRE nominee — Defence Minister§!\nPlausible alternate-history appointment. Reserve lieutenant colonel, former commander of the military academy and former General Staff operations chief. An independent politician associated with the EKRE parliamentary group, not a formal party member; model him as an EKRE-nominated defence theorist. His professional background is established before 2020, while later defence-committee leadership reinforces suitability.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_jaak_madison_foreign:0 "Jaak Madison"
 TFR_EST_minister_jaak_madison_foreign_desc:0 "§YEKRE nominee — Foreign Minister§!\nPlausible alternate-history appointment. EKRE deputy chair and former deputy chair of the Riigikogu European Union Affairs Committee. An inferred foreign-minister candidate with real party foreign-policy experience, providing an alternative when Mart Helme is prime minister or interior minister. Do not automatically import Madison's later real-world party change into the alternate timeline.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_mart_helme_interior:0 "Mart Helme"
 TFR_EST_minister_mart_helme_interior_desc:0 "§YEKRE nominee — Interior Minister§!\nHistorical portfolio experience. The actual interior minister on 1 January 2020. This is the historical opening appointment. Exclude him while prime minister or foreign minister; the same person must not occupy both selectable portfolios simultaneously.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_margus_tsahkna_foreign:0 "Margus Tsahkna"
 TFR_EST_minister_margus_tsahkna_foreign_desc:0 "§YEesti 200 nominee — Foreign Minister§!\nHistorical portfolio experience. Actual Eesti 200 foreign minister from 2023; previously defence minister in 2016-2017 and an Eesti 200 founding politician. His later appointment is evidence of suitability, not a requirement to reproduce real-world coalition history.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_tiit_riisalo_economic:0 "Tiit Riisalo"
 TFR_EST_minister_tiit_riisalo_economic_desc:0 "§YEesti 200 nominee — Economic Minister§!\nHistorical portfolio experience. Actual Eesti 200 Minister of Economic Affairs and Information Technology in 2023-2024; earlier public-administration, export-promotion and management experience. Using his later party appointment as a roster basis does not imply he held that office in 2020.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_igor_taro_interior:0 "Igor Taro"
 TFR_EST_minister_igor_taro_interior_desc:0 "§YEesti 200 nominee — Interior Minister§!\nHistorical portfolio experience. Actual Eesti 200 interior minister from March 2025; formerly Polva county governor, local councillor and Defence League member. Treating him as an earlier party nominee in TFR is an alternate-timeline appointment supported by his real subsequent office.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_liisa_ly_pakosta_intelligence:0 "Liisa-Ly Pakosta"
 TFR_EST_minister_liisa_ly_pakosta_intelligence_desc:0 "§YEesti 200 nominee — Intelligence Minister§!\nPlausible alternate-history appointment. An inferred civilian security-oversight appointment based on her real justice and digital-affairs ministry, earlier anti-corruption committee vice-chairmanship and Interior Ministry administrative work. She has not been established as an intelligence-service director. Official biography records Eesti 200 membership from 2023; any earlier recruitment is an alternate-timeline assumption.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_kalev_stoicescu_defence:0 "Kalev Stoicescu"
 TFR_EST_minister_kalev_stoicescu_defence_desc:0 "§YEesti 200 nominee — Defence Minister§!\nPlausible alternate-history appointment. An inferred defence-theorist appointment based on Defence Ministry service in 2002-2014, NATO/Paris defence-adviser assignments, regional-security research in 2014-2023 and subsequent chairmanship of the parliamentary National Defence Committee. Official biography records Eesti 200 membership from 2022; earlier nomination would be alternate-timeline recruitment.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_tiit_naber_foreign:0 "Tiit Naber"
 TFR_EST_minister_tiit_naber_foreign_desc:0 "§YParempoolsed nominee — Foreign Minister§!\nPlausible alternate-history appointment. Retired career diplomat and ambassador with thirty years of diplomatic and international-negotiating experience, listed as an actual Parempoolsed candidate in 2023. An inferred foreign-minister nomination grounded in direct professional expertise; not a claim that he held the ministry. Available only after the party forms.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_kristjan_vanaselja_economic:0 "Kristjan Vanaselja"
 TFR_EST_minister_kristjan_vanaselja_economic_desc:0 "§YParempoolsed nominee — Economic Minister§!\nPlausible alternate-history appointment. GoWorkaBit founder and CEO, Parempoolsed founding deputy chair and actual 2023 parliamentary candidate. An inferred economic-minister nominee based on entrepreneurship, labour-market experience and party leadership. Available only after the party forms.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_siim_valmar_kiisler_interior:0 "Siim Valmar Kiisler"
 TFR_EST_minister_siim_valmar_kiisler_interior_desc:0 "§YParempoolsed nominee — Interior Minister§!\nPlausible alternate-history appointment. Actual Regional Affairs Minister in 2008-2014, administering regional/local-government matters within the Interior Ministry's broader area, and Environment Minister in 2017-2019. Later a founding Parempoolsed politician. An inferred full interior-minister appointment based on real cabinet and administrative experience. His 2020 Isamaa membership should not create a duplicate second identity: use one person and the later Parempoolsed nomination after formation.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_rainer_saks_intelligence:0 "Rainer Saks"
 TFR_EST_minister_rainer_saks_intelligence_desc:0 "§YParempoolsed nominee — Intelligence Minister§!\nPlausible alternate-history appointment. Actual Director General of the Information Board before his appointment as Foreign Ministry secretary-general in December 2015; a real Parempoolsed European-election candidate in 2024. His professional qualification directly fits the slot. Recruiting him immediately after Parempoolsed forms in 2022 is an explicit alternate-timeline inference: the verified party nomination is from 2024, not evidence of founding membership.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_ilmar_raag_defence:0 "Ilmar Raag"
 TFR_EST_minister_ilmar_raag_defence_desc:0 "§YParempoolsed nominee — Defence Minister§!\nPlausible alternate-history appointment. Reserve officer since 2003, lecturer at Higher National Defence Courses and Government Office psychological-defence adviser from 2015. A real Parempoolsed parliamentary candidate in 2023. An inferred defence-theorist appointment focused on strategic communication and societal resistance. Available only after the party forms; does not imply he was a defence minister.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
 TFR_EST_minister_rene_kokk_economic:0 "Rene Kokk"
 TFR_EST_minister_rene_kokk_economic_desc:0 "§YEKRE nominee — Economic Minister§!\nPlausible alternate-history appointment. EKRE member since 2014 and the actual Environment Minister in 2019-2020. His economics and entrepreneurship degree, construction/forestry management and company-board experience predate the campaign; he later served as deputy chair of the parliamentary Economic Affairs Committee in 2022-2023. These facts support an inferred economic-minister appointment when Martin Helme is prime minister, not a claim that Kokk historically held the economic or finance ministry.\nRequires the nominating party in the coalition and a confirmed cabinet. A person can hold one cabinet office at a time."
