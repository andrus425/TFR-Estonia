 TFR_EST_panel_title:0 "RIIGIKOGU — 101 SEATS"
 TFR_EST_panel_cabinet:0 "Prime minister: [TFR_EST_pm_name]\nCoalition leader: [TFR_EST_mandate_party_name]\nCabinet seats: [?TFR_EST_coalition_seats|0]    Confidence votes: [?TFR_EST_confidence_seats|0] / 51"
 TFR_EST_panel_header:0 "PARTY                         POLL       SEATS    CABINET     SUPPLY"
 TFR_EST_panel_calendar:0 "Regular election: March [?TFR_EST_election_year|0]    Restoration progress: [?TFR_EST_restore_days|0] / 84 days"
 TFR_EST_panel_help:0 "Cabinet / supply: 1 = agreement, 0 = opposition. The election winner leads the coalition.\nBetween elections, negotiate partners; leadership changes and snap elections require an event or focus."
 TFR_EST_panel_close:0 "Close"
 TFR_EST_constitutional_presidency:0 "President Kersti Kaljulaid"
 TFR_EST_constitutional_presidency_desc:0 "The president safeguards Estonia’s constitutional institutions. The prime minister directs the cabinet. TFR’s executive display shows the president as head of state and the current prime minister as head of government."
 TFR_EST_presidency_karis:0 "President Alar Karis"
 TFR_EST_presidency_karis_desc:0 "The president represents the continuity of Estonia’s constitutional order. Executive policy remains the responsibility of the prime minister and a cabinet enjoying the confidence of the Riigikogu."
 TFR_EST_caretaker_cabinet:0 "Caretaker Cabinet"
 TFR_EST_caretaker_cabinet_desc:0 "Essential administration continues while ministers await a valid parliamentary majority. Negotiate at least 51 confidence votes around the fixed coalition leader and confirm the cabinet. The incumbent stays in office unless an election, event or focus authorizes a successor. Caretaker status does not trigger a snap election; only an event or focus can call one."
 TFR_EST_coalition_narrow:0 "Narrow Coalition Majority"
 TFR_EST_coalition_narrow_desc:0 "Cabinet parties hold 51–60 seats. Political power reflects their actual parliamentary representation. Opposition parties sharing the prime minister’s ideology and confidence-and-supply parties do not contribute to this bonus."
 TFR_EST_coalition_working:0 "Working Coalition Majority"
 TFR_EST_coalition_working_desc:0 "Cabinet parties hold 61–75 seats. Political power reflects their actual parliamentary representation. Opposition parties sharing the prime minister’s ideology and confidence-and-supply parties do not contribute to this bonus."
 TFR_EST_coalition_broad:0 "Broad Coalition Majority"
 TFR_EST_coalition_broad_desc:0 "Cabinet parties hold 76–101 seats. Political power reflects their actual parliamentary representation. Opposition parties sharing the prime minister’s ideology and confidence-and-supply parties do not contribute to this bonus."
 TFR_EST_kaja_kallas:0 "Kaja Kallas"
 TFR_EST_kaja_kallas_desc:0 "Leader of the Reform Party, Kaja Kallas champions investment, digital administration, European cooperation and fiscal discipline. Her cabinet must reconcile modernization with regional concerns."
 TFR_EST_juri_ratas:0 "Jüri Ratas"
 TFR_EST_juri_ratas_desc:0 "Jüri Ratas leads Keskerakond and the opening Centre–EKRE–Isamaa coalition. He seeks social protection, regional investment and a workable parliamentary compromise in an increasingly unstable Europe."
 TFR_EST_mart_helme:0 "Mart Helme"
 TFR_EST_mart_helme_desc:0 "Mart Helme leads EKRE’s campaign for sovereignty, conservative social policy, tighter border security and domestic mobilization. Governing requires agreements with parliamentary partners."
 TFR_EST_helir_valdor_seeder:0 "Helir-Valdor Seeder"
 TFR_EST_helir_valdor_seeder_desc:0 "Helir-Valdor Seeder leads Isamaa, emphasizing national institutions, family policy, energy security and territorial defense. A smaller parliamentary base makes coalition negotiation central to his government."
 TFR_EST_indrek_saar:0 "Indrek Saar"
 TFR_EST_indrek_saar_desc:0 "Indrek Saar leads the Social Democrats. His programme links public services, labor protections, integration and civil resilience, balancing social expenditure against military procurement."
 TFR_EST_kristina_kallas:0 "Kristina Kallas"
 TFR_EST_kristina_kallas_desc:0 "Kristina Kallas leads Eesti 200. The party seeks education reform, long-term public planning and institutions able to transcend established political divisions. It must first earn parliamentary representation."
 TFR_EST_lavly_perling:0 "Lavly Perling"
 TFR_EST_lavly_perling_desc:0 "Lavly Perling leads the Parempoolsed route after the party’s formation. Administrative efficiency, enterprise and fiscal restraint define its priorities, while limited organization makes coalition entry its first challenge."
