l_english:
 TFR_EST_parliament_category:0 "The Riigikogu"
 TFR_EST_parliament_category_desc:0 "Our parliament contains §Y101 seats§!. A cabinet needs §Y51 votes§! of confidence. After an election, the party with the most seats automatically leads coalition formation. Exact ties follow the fixed party order. Centre retains the historical opening leadership. Coalition leadership cannot be selected through decisions.\n\nPrime minister: §Y[TFR_EST_pm_name]§!\nCoalition leader: §Y[TFR_EST_mandate_party_name]§!\nCabinet seats: §Y[?TFR_EST_coalition_seats|0]§! — confidence votes: §Y[?TFR_EST_confidence_seats|0]§!\nNext regular election: §YMarch [?TFR_EST_election_year|0]§!. Polling changes future election results, not the present leadership."
 TFR_EST_open_parliament:0 "Open the Riigikogu ledger"
 TFR_EST_open_parliament_desc:0 "View the seven parties, polling support, parliamentary seats, cabinet membership and confidence agreements. The polls influence the next election; the current seats remain fixed until an election is held."
 TFR_EST_party_reform:0 "Reform Party"
 TFR_EST_campaign_reform_decision:0 "Campaign for Reform Party"
 TFR_EST_campaign_reform_decision_desc:0 "Organize public meetings and explain our programme. Transfer 0.25 percentage points from each other party with sufficient support, and from other voters, to Reform Party. This conserves the total vote and does not change the current assembly. Campaigning is available again after 45 days."
 TFR_EST_invite_reform_decision:0 "Offer cabinet ministries to Reform Party"
 TFR_EST_invite_reform_decision_desc:0 "Invite Reform Party and its [?TFR_EST_seats_reform|0] seats into the governing coalition. Negotiated concessions cost 1 national cohesion. An existing supply agreement is replaced by full cabinet membership."
 TFR_EST_supply_reform_decision:0 "Negotiate confidence and supply with Reform Party"
 TFR_EST_supply_reform_decision_desc:0 "Reform Party contributes [?TFR_EST_seats_reform|0] votes to confirmation and confidence votes. It remains outside the cabinet and does not count toward the coalition political power bonus."
 TFR_EST_withdraw_reform_decision:0 "End the agreement with Reform Party"
 TFR_EST_withdraw_reform_decision_desc:0 "Remove Reform Party from the coalition or its supply agreement. If confidence falls below 51 votes, the cabinet immediately becomes a caretaker government."
