 TFR_EST_confirm_cabinet_decision:0 "Confirm the negotiated cabinet"
 TFR_EST_confirm_cabinet_decision_desc:0 "Confirm a cabinet led by [TFR_EST_mandate_party_name] once it has at least 51 confidence votes. The coalition leader is assigned by the election; coalition negotiations cannot choose a different prime minister. Between elections, confidence recovery reconfirms the incumbent. Only an authored event or focus can authorize another succession."
 TFR_EST_election_event_title:0 "A New Riigikogu"
 TFR_EST_election_event_desc:0 "The Riigikogu election has allocated 101 seats. [TFR_EST_mandate_party_name] holds the largest parliamentary delegation and automatically receives the coalition leadership. It must negotiate at least 51 confidence votes. The incumbent prime minister continues as caretaker until the new cabinet is confirmed. Campaigning changes future polls, while these seats and the leadership mandate remain fixed until another election or an explicit story development."
 TFR_EST_election_event_option:0 "Begin cabinet negotiations."
 TFR_EST_parempoolsed_event_title:0 "Parempoolsed Enters the Political Arena"
 TFR_EST_parempoolsed_event_desc:0 "A new party argues that enterprise, administrative efficiency and credible public finances deserve a clearer voice. Parempoolsed begins organizing under Lavly Perling. Its supporters must now build a national campaign and clear the five-percent electoral threshold. The party has no seats until the next election."
 TFR_EST_parempoolsed_event_option:0 "Another voice in a crowded parliament."
 TFR_EST_president_event_title:0 "The Constitutional Presidency"
 TFR_EST_president_event_desc:0 "Kersti Kaljulaid’s presidential term has reached its constitutional conclusion. The Riigikogu elects Alar Karis to the presidency. The president remains guardian of constitutional procedure while the prime minister directs government policy. In a world of growing emergencies, this distinction helps preserve the continuity of Estonia’s democratic institutions."
 TFR_EST_president_event_option:0 "Respect the constitutional division of powers."
 TFR_EST_confidence_event_title:0 "The Cabinet Loses Its Majority"
 TFR_EST_confidence_event_desc:0 "The cabinet can no longer count on 51 votes in the Riigikogu. Ministers continue essential business in a caretaker capacity. Negotiate new partners or confidence and supply around the existing coalition leader, [TFR_EST_mandate_party_name]. Losing confidence does not change the coalition leader or trigger an election. A snap election requires an event or focus."
 TFR_EST_confidence_event_option:0 "Negotiate a new majority."
 TFR_EST_cabinet_event_title:0 "A Government with Parliamentary Confidence"
 TFR_EST_cabinet_event_desc:0 "[TFR_EST_pm_name] has secured the support of [?TFR_EST_confidence_seats|0] members of the Riigikogu. The cabinet includes parties holding [?TFR_EST_coalition_seats|0] seats. Confidence-and-supply partners retain their independence outside the ministries. The new government can now implement its programme."
 TFR_EST_cabinet_event_option:0 "The work of governing begins."
