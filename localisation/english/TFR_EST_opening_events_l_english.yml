l_english:
 TFR_EST_opening_covid_title:0 "The COVID-19 Emergency"
 TFR_EST_opening_covid_desc:0 "The government has declared an emergency situation in response to COVID-19. Schools must move to distance learning, public gatherings face restrictions, and hospitals need coordinated supplies. The cabinet must work with local authorities while the Riigikogu continues to scrutinize emergency powers. Wage compensation and tax relief will require separate funding decisions."
 TFR_EST_opening_covid_option:0 "Put the emergency orders into effect."
 TFR_EST_porto_investigation_title:0 "The Porto Franco Investigation"
 TFR_EST_porto_investigation_desc:0 "Prosecutors and the Internal Security Service have announced corruption suspicions connected to the Porto Franco development. The reported allegations concern party donations and access-road arrangements, alongside a separate suspected attempt to obtain favourable decisions on crisis lending. Centre secretary-general Mihhail Korb and Finance Minister Martin Helme's adviser Kersti Kracht are among those named by investigators.\n\nThese are allegations under investigation, not findings of guilt. Jüri Ratas has not been personally named as a suspect in this announcement. Nevertheless, the cabinet faces a political crisis while parliament debates the marriage referendum bill."
 TFR_EST_porto_investigation_option:0 "Convene the coalition leaders."
 TFR_EST_porto_choice_title:0 "Ratas Must Decide"
 TFR_EST_porto_choice_desc:0 "The prime minister must decide whether taking political responsibility requires his resignation. Remaining in office would require Centre, Isamaa and EKRE to renew their support while the investigation proceeds independently. Stepping back would leave Ratas leading a caretaker administration as a successor is negotiated in the existing Riigikogu.\n\nResignation automatically fails the marriage-referendum focus and abandons the proposal. Reform and Centre would negotiate a government under Kaja Kallas. The cabinet change does not require an election."
 TFR_EST_porto_keep_ratas:0 "Ratas stays; renew the coalition agreement."
 TFR_EST_porto_step_back:0 "Ratas takes political responsibility and steps back."
 TFR_EST_keep_ratas_tt:0 "Ratas remains prime minister of the Centre–Isamaa–EKRE cabinet. Renew its parliamentary support and lose 6 cohesion. Reveal the coalition agreement programme through the March 2023 election. Its first focus requires the active referendum focus to finish; the referendum proposal remains the responsibility of this government."
 TFR_EST_step_back_tt:0 "Ratas resigns and remains caretaker until a successor is confirmed. Lose 2 cohesion. Automatically fail the marriage-referendum focus and reveal Kaja Kallas's government programme. Reform and Centre will negotiate a cabinet in the existing parliament over the next 13 days; its focuses require confirmation. Preserve all earlier policies and their rewards. No election is called."
 TFR_EST_reform_centre_title:0 "A Reform–Centre Cabinet"
 TFR_EST_reform_centre_desc:0 "Reform and Centre have agreed to form a government under Kaja Kallas. Their original parliamentary delegations hold 60 of the 101 seats. Kersti Kaljulaid remains president, while Ratas hands over the prime minister's office after confirmation. This is a cabinet change within the existing assembly. The outgoing coalition's marriage-referendum proposal will not proceed."
 TFR_EST_reform_centre_option:0 "Confirm the new cabinet in the Riigikogu."
 TFR_EST_reform_centre_tt:0 "Confirm Kaja Kallas if Reform and Centre provide at least 51 confidence votes. Preserve parliamentary seats, polls and the March 2023 election calendar. Her government can now begin its programme, while the abandoned marriage referendum remains failed."
