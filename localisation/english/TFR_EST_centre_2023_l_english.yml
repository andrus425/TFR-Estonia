l_english:
 TFR_EST_centre_2023_new_mandate:0 "A New Centre-Led Mandate"
 TFR_EST_centre_2023_new_mandate_desc:0 "Centre has won the largest delegation. Jüri Ratas must agree a funded programme with the actual coalition, linking public services and regional investment to defence preparation."
 TFR_EST_centre_2023_defence_commitment:0 "Fund the Cross-Party Defence Commitment"
 TFR_EST_centre_2023_defence_commitment_desc:0 "Invite parliamentary parties to a common defence agreement and fund its first procurement instalments. Publish lifetime costs so a spending pledge supports usable capabilities."
 TFR_EST_centre_2023_air_defence:0 "Finance Medium-Range Air Defence Preparation"
 TFR_EST_centre_2023_air_defence_desc:0 "Budget sites, crews and joint procurement planning with available allies. An integrated protection plan must account for maintenance and deliveries before declaring a new capability."
 TFR_EST_centre_2023_reserve_expertise:0 "Put Reservists' Civilian Skills to Work"
 TFR_EST_centre_2023_reserve_expertise_desc:0 "Match reserve appointments to civilian expertise and fund refresher instruction. Engineers, medics and transport specialists need reliable records and ordinary recruitment arrangements."
 TFR_EST_centre_2023_allied_basing:0 "Prepare Permanent Allied Reception Facilities"
 TFR_EST_centre_2023_allied_basing_desc:0 "Finance reception, communications and dispersed stores for allied troops. Existing reinforcement decisions remain separate; new facilities improve how Estonia sustains the forces that actually arrive."
 TFR_EST_centre_2023_community_training:0 "Agree Training-Area Compensation with Communities"
 TFR_EST_centre_2023_community_training_desc:0 "Negotiate access, compensation and exercise arrangements with councils and residents. Defence training needs usable land and instructors alongside a settlement people can understand."
 TFR_EST_centre_2023_civil_continuity:0 "Rehearse Municipal Civil Protection"
 TFR_EST_centre_2023_civil_continuity_desc:0 "Fund municipal warning, evacuation and essential-service exercises. Coordinate councils, employers and rescue services so civilian preparation supports the army's ability to keep operating."
 TFR_EST_centre_2023_industrial_guarantees:0 "Back Domestic Defence Suppliers"
 TFR_EST_centre_2023_industrial_guarantees_desc:0 "Set aside guarantees and development funding for maintainable domestic contracts. Give suppliers clear inspection and delivery requirements instead of replacing procurement with announcements."
 TFR_EST_centre_2023_ammunition_workshop:0 "Finance a Domestic Ammunition Workshop"
 TFR_EST_centre_2023_ammunition_workshop_desc:0 "Fund one inspected production workshop and the supplier contracts needed to operate it. The project adds capacity; ammunition must still enter through ordinary production or paid procurement."
 TFR_EST_centre_2023_maintenance_workshop:0 "Finance an Equipment Maintenance Workshop"
 TFR_EST_centre_2023_maintenance_workshop_desc:0 "Pay for a second facility able to overhaul equipment and make replacement components. Domestic maintenance keeps purchases useful without awarding free vehicles or another army."
 TFR_EST_centre_2023_ida_viru_innovation:0 "Fund New Technology in Ida-Viru Industry"
 TFR_EST_centre_2023_ida_viru_innovation_desc:0 "Select viable modernization projects with local employers and research institutions. Innovation funding should support productive jobs as the county's industrial base changes."
 TFR_EST_centre_2023_regional_jobs:0 "Guarantee Investment in High-Unemployment Regions"
 TFR_EST_centre_2023_regional_jobs_desc:0 "Offer assessed investment guarantees and retraining in regions with fewer jobs. Publish outcomes and risks so regional policy creates opportunities rather than concealing failing projects."
 TFR_EST_centre_2023_construction_orders:0 "Place the Funded Public Construction Orders"
 TFR_EST_centre_2023_construction_orders_desc:0 "Tender a staged public-building programme and disclose its financing. Predictable orders can sustain construction skills while delivering facilities that municipalities actually need."
 TFR_EST_centre_2023_power_reserves:0 "Keep Dispatchable Generation and LNG Options Ready"
 TFR_EST_centre_2023_power_reserves_desc:0 "Fund reliable generating reserves and permanent-terminal preparation. Keep existing capacity usable while alternative supplies develop, with fuel and operating costs included."
 TFR_EST_centre_2023_local_chp:0 "Support Local Heat-and-Power Projects"
 TFR_EST_centre_2023_local_chp_desc:0 "Finance viable combined heat-and-power projects and their network access. Local heat demand and sustainable fuel contracts should determine which schemes receive support."
 TFR_EST_centre_2023_apartment_renovation:0 "Lower the Rural Renovation Contribution"
 TFR_EST_centre_2023_apartment_renovation_desc:0 "Fund apartment renovations outside the largest cities with a smaller local contribution. Technical supervision and affordable loans help associations deliver lasting energy savings."
 TFR_EST_centre_2023_weatherproof_grid:0 "Weatherproof the Distribution Grid"
 TFR_EST_centre_2023_weatherproof_grid_desc:0 "Prioritize vulnerable lines and connection bottlenecks with transmission and distribution operators. Underground works and stronger substations need agreed sites, budgets and maintenance."
 TFR_EST_centre_2023_rural_broadband:0 "Finish Affordable Last-Mile Connections"
 TFR_EST_centre_2023_rural_broadband_desc:0 "Support household and enterprise connections where commercial rollout remains insufficient. Coordinate trenches and public works to reduce disruption and reach isolated settlements."
 TFR_EST_centre_2023_energy_cooperatives:0 "Finance Community Energy Cooperatives"
 TFR_EST_centre_2023_energy_cooperatives_desc:0 "Offer assessed financing and technical advice for local generation and storage. Communities need viable projects and transparent ownership rather than a promise of unlimited cheap power."
 TFR_EST_centre_2023_progressive_income_tax:0 "Introduce the Thirty-Percent Upper Income Band"
 TFR_EST_centre_2023_progressive_income_tax_desc:0 "Legislate the higher band for income above twice the average wage and prepare tax administration. Budget additional receipts while accounting for opposition to the distributional change."
 TFR_EST_centre_2023_minimum_tax_allowance:0 "Link the Tax Allowance to the Minimum Wage"
 TFR_EST_centre_2023_minimum_tax_allowance_desc:0 "Apply the proposed minimum-wage exemption with clear payroll guidance. Lower earners retain more income, while the treasury records the recurring cost alongside the new upper band."
 TFR_EST_centre_2023_food_vat:0 "Reduce Food VAT to Five Percent"
 TFR_EST_centre_2023_food_vat_desc:0 "Legislate the reduced food rate and check how retailers pass it through. Finance the revenue loss explicitly rather than assuming lower prices eliminate the budget tradeoff."
 TFR_EST_centre_2023_prescription_vat:0 "Remove VAT from Prescription Medicines"
 TFR_EST_centre_2023_prescription_vat_desc:0 "Prepare the proposed exemption and lower rate for other medicines. Update pharmacy billing and monitor access while recording the reduction in public receipts."
 TFR_EST_centre_2023_pension_fifty:0 "Fund the Next Fifty-Euro Pension Step"
 TFR_EST_centre_2023_pension_fifty_desc:0 "Finance the first extraordinary increase in the basic pension component. It is a funded step toward the party's longer-term pension objective, rather than an instant fulfilment of every future payment."
 TFR_EST_centre_2023_home_care:0 "Expand Municipal Home Nursing and Care"
 TFR_EST_centre_2023_home_care_desc:0 "Contract more care at home with councils and health providers. Dependable visits and support for family carers can preserve independence and reduce pressure on institutional services."
 TFR_EST_centre_2023_county_hospitals:0 "Give County Hospitals Predictable Budgets"
 TFR_EST_centre_2023_county_hospitals_desc:0 "Fund county hospitals against assessed service needs, including areas with fewer patients. A dependable budget should preserve access while requiring reporting on staffing and treatment."
 TFR_EST_centre_2023_second_day_sick_pay:0 "Restore Sick Pay from the Second Day"
 TFR_EST_centre_2023_second_day_sick_pay_desc:0 "Fund the proposed shared compensation arrangement with employers. Employees gain a clearer basis for staying home when ill, and the public contribution remains visible."
 TFR_EST_centre_2023_free_kindergarten:0 "Compensate Councils for Free Kindergarten Places"
 TFR_EST_centre_2023_free_kindergarten_desc:0 "Finance the municipal cost of the promised places and review capacity. Fee relief must be accompanied by staff and premises so parents can actually use the service."
 TFR_EST_centre_2023_teacher_pay:0 "Negotiate the Teachers' Pay Roadmap"
 TFR_EST_centre_2023_teacher_pay_desc:0 "Agree funded pay steps with municipalities and unions. Staffing and support specialists must be included alongside the longer-term salary objective."
 TFR_EST_centre_2023_language_courses:0 "Offer Free Estonian Courses and Study Leave"
 TFR_EST_centre_2023_language_courses_desc:0 "Finance language instruction adapted to work and daily life, including support for citizenship applicants. Clear access and paid learning time help residents participate in public institutions."
 TFR_EST_centre_2023_minorities_council:0 "Convene the National-Minorities Advisory Council"
 TFR_EST_centre_2023_minorities_council_desc:0 "Create a consultative forum and support community cultural organizations. Publish its recommendations and connect them with practical public-service access without changing electoral eligibility."
 TFR_EST_centre_2023_account_to_parliament:0 "Report on the Centre Government's Programme"
 TFR_EST_centre_2023_account_to_parliament_desc:0 "Present the investment, tax and service accounts to the Riigikogu. Assess defence readiness and the projects still in progress without calling an election or directing the European war."
 TFR_EST_centre_2023_governing_tt:0 "A confirmed Centre-led cabinet has at least 51 coalition seats."
 TFR_EST_centre_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 Centre government programme."
 TFR_EST_centre_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_centre_2023_power_reserves_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_centre_2023_local_chp_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_centre_2023_apartment_renovation_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
