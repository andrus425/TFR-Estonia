 TFR_EST_lauri_laanemets:0 "Lauri Läänemets"
 TFR_EST_lauri_laanemets_desc:0 "Lauri Läänemets succeeds Indrek Saar as Social Democratic Party chairman after the February 2022 congress. His experience includes local government, parliamentary constitutional work and the Defence League. He leads the cabinet when the Social Democrats supply the confirmed prime minister; the president retains the constitutional head-of-state role."
