l_english:
 TFR_EST_sde_2023_new_mandate:0 "A Social Democratic Parliamentary Mandate"
 TFR_EST_sde_2023_new_mandate_desc:0 "SDE has won the largest delegation. Lauri Läänemets must assemble a majority capable of funding social protection alongside credible national defence."
 TFR_EST_sde_2023_defence_commitment:0 "Finance the Critical Defence Capabilities"
 TFR_EST_sde_2023_defence_commitment_desc:0 "Approve a funded procurement tranche and operating provision. Parliament will review deliveries and the next spending round before making further commitments."
 TFR_EST_sde_2023_air_defence:0 "Prepare Layered Air-Defence Procurement"
 TFR_EST_sde_2023_air_defence_desc:0 "Assess sites, train crews and contract compatible communications. The armed forces receive preparation for purchases that still require equipment and sustained funding."
 TFR_EST_sde_2023_reserve_muster:0 "Reorganise Rapid Reserve Mobilisation"
 TFR_EST_sde_2023_reserve_muster_desc:0 "Audit call-up assignments with employers and commanders. Exercises will test whether the existing reserve structure can assemble and sustain its units in time."
 TFR_EST_sde_2023_kaitseliit_instructors:0 "Resource Kaitseliit Instructors and Volunteers"
 TFR_EST_sde_2023_kaitseliit_instructors_desc:0 "Commission additional training sessions and inspected equipment maintenance. Volunteer defence needs predictable instruction and workable arrangements with civilian employment."
 TFR_EST_sde_2023_allied_reception:0 "Prepare Reception Facilities for Allied Forces"
 TFR_EST_sde_2023_allied_reception_desc:0 "Exercise reception routes and dispersed stores with Estonia's available allies. Normal reinforcement agreements still determine which allied formations arrive."
 TFR_EST_sde_2023_civil_protection:0 "Fund Shelters, Sirens and Community Training"
 TFR_EST_sde_2023_civil_protection_desc:0 "Open a supervised civil-protection grant round. Rescue services and councils must demonstrate how warning systems, shelter access and evacuation exercises will work together."
 TFR_EST_sde_2023_industrial_guarantees:0 "Back Joint Defence-Industry Development"
 TFR_EST_sde_2023_industrial_guarantees_desc:0 "Select inspected prototypes and supplier partnerships with domestic firms. Contracts should retain technical knowledge and service capacity in Estonia."
 TFR_EST_sde_2023_ammunition_workshop:0 "Finance an Ammunition Manufacturing Workshop"
 TFR_EST_sde_2023_ammunition_workshop_desc:0 "Purchase a limited production facility and qualify its suppliers. Its output still depends on workers, materials and ordinary production orders."
 TFR_EST_sde_2023_maintenance_workshop:0 "Finance Military Equipment Servicing Capacity"
 TFR_EST_sde_2023_maintenance_workshop_desc:0 "Fund an overhaul workshop and replacement-component tooling. This investment adds capacity for the equipment Estonia can actually afford to procure."
 TFR_EST_sde_2023_regional_jobs:0 "Launch the Regional Skilled-Jobs Investment Round"
 TFR_EST_sde_2023_regional_jobs_desc:0 "Negotiate assessed projects with councils, employers and worker representatives. Publish the training obligations and employment results attached to each award."
 TFR_EST_sde_2023_applied_research:0 "Fund Applied Research and Industrial Automation"
 TFR_EST_sde_2023_applied_research_desc:0 "Award competitive grants against credible delivery milestones. Researchers and manufacturers should share the practical risks of bringing a new process into production."
 TFR_EST_sde_2023_ultrafast_internet:0 "Tender the Unserved Broadband Connections"
 TFR_EST_sde_2023_ultrafast_internet_desc:0 "Target connections that commercial rollout has left behind. Contracts need service standards, realistic maintenance obligations and access for local firms and schools."
 TFR_EST_sde_2023_renewable_contracts:0 "Finance Assessed Renewable-Power Projects"
 TFR_EST_sde_2023_renewable_contracts_desc:0 "Contract viable generating capacity with clear delivery and reliability obligations. Investment must account for balancing needs and the networks serving each project."
 TFR_EST_sde_2023_grid_connection:0 "Fund Thirty-Kilowatt Household Grid Connections"
 TFR_EST_sde_2023_grid_connection_desc:0 "Finance the proposed connection allowance through transparent eligibility rules. Operators must assess network capacity before promising a household that it can export power."
 TFR_EST_sde_2023_renovation:0 "Open the Inclusive Energy-Renovation Grant Round"
 TFR_EST_sde_2023_renovation_desc:0 "Commission supervised building upgrades with accessible designs. The grant round targets high losses and practical savings instead of declaring the housing stock modernised at once."
 TFR_EST_sde_2023_strategic_reserves:0 "Contract Strategic Energy Reserves and Storage"
 TFR_EST_sde_2023_strategic_reserves_desc:0 "Budget tested reserves and storage trials for interrupted supply. Stock management and replacement schedules must be included in every contract."
 TFR_EST_sde_2023_energy_cooperatives:0 "Support Community Energy Cooperatives"
 TFR_EST_sde_2023_energy_cooperatives_desc:0 "Provide technical assistance and accountable finance for viable shared projects. Members receive clear contracts covering ownership, maintenance and their share of the risks."
 TFR_EST_sde_2023_district_heating:0 "Modernise District Heating with Reserve Capacity"
 TFR_EST_sde_2023_district_heating_desc:0 "Tender heat-network upgrades against verified demand. Councils must preserve a workable fallback while replacing inefficient equipment and pipes."
 TFR_EST_sde_2023_progressive_tax:0 "Legislate the Twenty-Eight-Percent Upper Tax Band"
 TFR_EST_sde_2023_progressive_tax_desc:0 "Publish the new income and dividend schedules with clear filing guidance. Additional receipts enter the public ledger alongside the administration costs."
 TFR_EST_sde_2023_minimum_wage:0 "Agree the Steps toward a Twelve-Hundred-Euro Minimum Wage"
 TFR_EST_sde_2023_minimum_wage_desc:0 "Negotiate funded stages with the social partners and inspect implementation. Transitional assistance helps smaller employers adapt without treating a statutory target as instant prosperity."
 TFR_EST_sde_2023_collective_bargaining:0 "Extend Sectoral Collective Bargaining"
 TFR_EST_sde_2023_collective_bargaining_desc:0 "Resource mediation and enforcement so agreements can operate beyond the strongest workplaces. Publish coverage and compliance data with unions and employers."
 TFR_EST_sde_2023_learning_leave:0 "Fund Working-Time Study and Career Changes"
 TFR_EST_sde_2023_learning_leave_desc:0 "Open assessed training places and agree study arrangements with employers. Public support follows completed learning and practical opportunities to change occupation."
 TFR_EST_sde_2023_child_benefit:0 "Fund the Indexed Hundred-and-Fifty-Euro Child Benefit"
 TFR_EST_sde_2023_child_benefit_desc:0 "Finance the proposed benefit level with delivery checks and a published review. Families need predictable support and a service that handles their claims reliably."
 TFR_EST_sde_2023_rental_homes:0 "Commission the First Public Rental-Housing Tranche"
 TFR_EST_sde_2023_rental_homes_desc:0 "Assess sites, construction costs and long-term management before awarding the first projects. Housing providers remain accountable for upkeep and access."
 TFR_EST_sde_2023_universal_health:0 "Finance Universal Health-Insurance Access"
 TFR_EST_sde_2023_universal_health_desc:0 "Update eligibility, service purchasing and public funding together. Coverage must be supported by commissioned care and a practical route for patients to use it."
 TFR_EST_sde_2023_mental_health:0 "Commission Community Mental-Health Services"
 TFR_EST_sde_2023_mental_health_desc:0 "Train and contract staff for accessible referrals, prioritising children and young people. Review waiting times and coordination with schools and primary care."
 TFR_EST_sde_2023_pension_base:0 "Fund a Step toward the Pension Objective"
 TFR_EST_sde_2023_pension_base_desc:0 "Authorize an affordable increase and publish the outstanding liability. Pension policy needs dependable financing rather than an unfunded declaration that the target has been met."
 TFR_EST_sde_2023_care_home:0 "Make Assessed Residential Care Affordable on a Pension"
 TFR_EST_sde_2023_care_home_desc:0 "Contract places against care-quality and staffing standards. Councils must explain assessed needs, fees and the public contribution to each family."
 TFR_EST_sde_2023_teacher_pay:0 "Fund the Teachers' Salary and Career Agreement"
 TFR_EST_sde_2023_teacher_pay_desc:0 "Negotiate salary stages, training places and manageable workloads with schools. Publish progress alongside vacancies and retention rather than promising staff who are not available."
 TFR_EST_sde_2023_inclusive_schools:0 "Resource Shared Estonian-Language Schooling"
 TFR_EST_sde_2023_inclusive_schools_desc:0 "Provide trained language staff, learning materials and specialist support. Schools need practical help to teach children from different home-language backgrounds together."
 TFR_EST_sde_2023_account_to_parliament:0 "Present the Social Democratic Government's Accounts"
 TFR_EST_sde_2023_account_to_parliament_desc:0 "Report funded reforms, readiness and outstanding commitments to parliament. The next mandate should begin with an honest account of what has been delivered."
 TFR_EST_sde_2023_governing_tt:0 "A confirmed SDE-led cabinet has at least 51 coalition seats."
 TFR_EST_sde_2023_all_policies_done_tt:0 "Complete every other focus in the 2023 SDE government programme."
 TFR_EST_sde_2023_factory_tt:0 "Gain §G1§! §YMilitary Factory§! in an owned and controlled Estonian core with a free building slot. If no suitable slot is available, the funded project waits until one becomes available. Each of the two funded projects grants one factory only."
 TFR_EST_sde_2023_renewable_contracts_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_sde_2023_grid_connection_energy_tt:0 "Complete 1 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G1§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
 TFR_EST_sde_2023_renovation_energy_tt:0 "Complete 2 of the 5 preparation slots for §YThe Oil Crash§!, advancing recovery by up to §G2§! stage(s). Earlier equivalent preparations count once. Completing all three response projects removes the spirit; preparation also applies if the crisis begins later."
