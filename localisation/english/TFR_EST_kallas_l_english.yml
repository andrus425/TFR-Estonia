l_english:
 TFR_EST_kallas_govern_together:0 "A Reform-Centre Government"
 TFR_EST_kallas_govern_together_desc:0 "Kaja Kallas takes office with Reform and Centre holding sixty seats in the existing Riigikogu. The abandoned marriage-referendum proposal gives way to a joint programme of public health, recovery and accountable government. Agree the legislative calendar and funding priorities without calling an early election. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_govern_together_reward_tt:0 "National cohesion: +3.\nGain 25 political power."
 TFR_EST_kallas_sick_pay:0 "Extend Sick Pay from the Second Day"
 TFR_EST_kallas_sick_pay_desc:0 "Extend the temporary sick-pay arrangement so workers can isolate without losing the first days of support. Employers cover days two to five and the Health Insurance Fund begins on day six. Kallas's government extended and funded this arrangement in its 2021 pandemic response. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats. Requires COVID cases in Estonia. An already recovered outbreak bypasses this intervention without its reward."
 TFR_EST_kallas_sick_pay_reward_tt:0 "Budget: €25 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_kallas_hospital_support:0 "Fund the EUR 52 Million Hospital Package"
 TFR_EST_kallas_hospital_support_desc:0 "Implement the exceptional hospital and emergency-care funding adopted in the 2021 supplementary budget. Cover COVID treatment costs and coordinate the separately funded testing and vaccination work. Hospitals must retain staff and supplies while continuing essential non-COVID care. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats. Requires COVID cases in Estonia. An already recovered outbreak bypasses this intervention without its reward."
 TFR_EST_kallas_hospital_support_reward_tt:0 "Budget: €52 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_kallas_frontline_vaccination:0 "Vaccinate Frontline Workers"
 TFR_EST_kallas_frontline_vaccination_desc:0 "Carry out the government's decision to continue vaccinating workers whose duties expose them to infection. Coordinate appointments, employers and reliable deliveries after supply interruptions. A funded rollout can improve the current outbreak while preserving vaccination records for later public-health work. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats. Requires COVID cases in Estonia. An already recovered outbreak bypasses this intervention without its reward."
 TFR_EST_kallas_frontline_vaccination_reward_tt:0 "Budget: €30 million, financed through public debt.\nNational cohesion: +3.\nImprove one existing COVID severity level. The lowest level is removed only for Estonia's own seeded outbreak."
 TFR_EST_kallas_covid_certificates:0 "Digital COVID Certificates and Verification"
 TFR_EST_kallas_covid_certificates_desc:0 "Introduce patient-portal COVID certificates and a practical verification service, following the system implemented in 2021. Provide clear access, reliable records and help for people who need a printed certificate. The service remains useful after the immediate outbreak has recovered. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_covid_certificates_reward_tt:0 "Budget: €10 million, financed through public debt.\nResearch speed: +0.5%."
 TFR_EST_kallas_pension_twenty:0 "Legislate the EUR 20 Pension Increase"
 TFR_EST_kallas_pension_twenty_desc:0 "Enact and finance the extraordinary twenty-euro increase in the pension base and national-pension rate, as Parliament did in January 2022. Prepare the change for its scheduled January 2023 introduction. Passing the law creates a funded commitment before the higher payments begin. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_pension_twenty_reward_tt:0 "Budget: €35 million, financed through public debt.\nNational cohesion: +4."
 TFR_EST_kallas_pension_tax_allowance:0 "Exempt the Average Pension from Income Tax"
 TFR_EST_kallas_pension_tax_allowance_desc:0 "Implement the income-tax amendment adopted in December 2021, providing a pension-age allowance up to the average old-age pension from January 2023. Prepare payment administration and clear guidance so pensioners understand the difference between tax relief and the separate pension increase. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_pension_tax_allowance_reward_tt:0 "Budget: €25 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_kallas_teacher_pay:0 "Teachers' Minimum Pay: EUR 1,412"
 TFR_EST_kallas_teacher_pay_desc:0 "Fund the regulation raising teachers' minimum monthly pay from 1,315 to 1,412 euros in the 2022 budget. Coordinate the additional allocations with school owners and make the commitment visible in employment contracts. This advances the earlier teacher-pay policy through a concrete further increase. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_teacher_pay_reward_tt:0 "Budget: €30 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_kallas_school_catch_up:0 "EUR 12 Million for Learning Gaps"
 TFR_EST_kallas_school_catch_up_desc:0 "Put the twelve-million-euro school catch-up allocation from the adopted 2022 budget into operation. Support pupils whose learning suffered during remote schooling through targeted teaching and assessment. Schools should identify gaps and report how the extra support reaches those pupils. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_school_catch_up_reward_tt:0 "Budget: €12 million, financed through public debt.\nResearch speed: +1%."
 TFR_EST_kallas_recovery_plan:0 "Adopt the Recovery Investment Programme"
 TFR_EST_kallas_recovery_plan_desc:0 "Carry forward the recovery and resilience plan approved by the cabinet in June 2021. Set priorities, prepare co-financing and supervise projects for the green and digital transition. The near-billion-euro multi-year plan provides a programme of investment; this focus funds its preparation and implementation capacity. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_recovery_plan_reward_tt:0 "Budget: €40 million, financed through public debt.\nConstruction speed: +1%."
 TFR_EST_kallas_enterprise_digital:0 "Digitise Estonian Enterprise"
 TFR_EST_kallas_enterprise_digital_desc:0 "Use the approved recovery programme to prepare enterprise investment in digital processes, automation and the skills to operate them. Select workable projects with transparent conditions and measurable improvements. The public contribution supports firms' own investment and implementation. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_enterprise_digital_reward_tt:0 "Budget: €40 million, financed through public debt.\nProduction efficiency growth: +1.5%."
 TFR_EST_kallas_rural_broadband:0 "Broadband Access Beyond the Cities"
 TFR_EST_kallas_rural_broadband_desc:0 "Continue the access-network support funded in the 2022 budget, with its objective of enabling nearly forty thousand rural households to connect by the end of 2023. Finance the next construction and connection programme with local authorities and operators. Longer projects continue beyond this focus. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_rural_broadband_reward_tt:0 "Budget: €45 million, financed through public debt.\nNational cohesion: +3."
 TFR_EST_kallas_mental_health:0 "Community Mental-Health Services"
 TFR_EST_kallas_mental_health_desc:0 "Implement the three-million-euro mental-health allocation in the 2022 budget. Support children's mental-health centres, professional training for clinical psychologists and municipal community-psychologist services. Reliable local help is part of recovery from prolonged disruption. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_mental_health_reward_tt:0 "Budget: €3 million, financed through public debt.\nNational cohesion: +4."
 TFR_EST_kallas_energy_households:0 "Compensate Eligible Household Energy Bills"
 TFR_EST_kallas_energy_households_desc:0 "Fund the means-tested relief that compensates eighty percent of eligible energy-price increases for households up to median income. Set up municipal applications and clear eligibility checks. Prepare the scheme for TFR's supply shock so relief can operate when households need it. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_energy_households_reward_tt:0 "Budget: €50 million, financed through public debt.\nNational cohesion: +3.\nReduce the local energy crisis's consumer-goods penalty by 1.5 percentage points, including if prepared before onset."
 TFR_EST_kallas_energy_networks:0 "Cut Electricity and Gas Network Charges"
 TFR_EST_kallas_energy_networks_desc:0 "Implement the electricity and gas network-charge support used by the government during the energy-price crisis. The historical package reduced household electricity-network charges by half and gas-network charges entirely, with additional support for firms. Authorize a funded response to disrupted supplies. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_energy_networks_reward_tt:0 "Budget: €45 million, financed through public debt.\nReduce the local energy crisis's factory-output penalty by 1 percentage point and its consumer-goods penalty by 1.5 points."
 TFR_EST_kallas_gas_reserve:0 "Procure a Strategic Gas Reserve"
 TFR_EST_kallas_gas_reserve_desc:0 "Use the strategic gas-reserve authority adopted in the May 2022 supplementary budget, which provided up to 170 million euros and excluded Russian gas. Arrange purchasing, storage and access for essential users. Adapt the supply diversification to TFR's energy disruption while retaining the procurement limits. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_gas_reserve_reward_tt:0 "Budget: €170 million, financed through public debt.\nReduce the local energy crisis's factory-output penalty by 1 percentage point."
 TFR_EST_kallas_lng_connection:0 "Fund LNG Connection Capability"
 TFR_EST_kallas_lng_connection_desc:0 "Implement the LNG-capability funding adopted in the May 2022 supplementary budget, with an allocation of up to thirty million euros. Finance enabling works and connection arrangements with energy operators. The focus advances access to diversified supply while the larger infrastructure programme continues. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_lng_connection_reward_tt:0 "Budget: €30 million, financed through public debt.\nReduce the local energy crisis's factory-output penalty by 1 percentage point."
 TFR_EST_kallas_defence_budget:0 "The 2022 Defence Funding Commitment"
 TFR_EST_kallas_defence_budget_desc:0 "Maintain the adopted 2022 defence allocation of approximately 750 million euros, above 2.3 percent of GDP. Fund an additional priority package for readiness, procurement preparation and allied facilities within that programme. Estonia still recruits and equips its forces through normal systems. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_defence_budget_reward_tt:0 "Budget: €70 million, financed through public debt.\nDefense readiness: +6.\nArmy training time: −2%. No free troops or equipment."
 TFR_EST_kallas_civil_protection:0 "Mark Shelters and Rehearse Evacuation"
 TFR_EST_kallas_civil_protection_desc:0 "Put the 2022 civil-protection reinforcement into practical service: public shelter marking, warning systems, evacuation arrangements and emergency stocks. Coordinate the Rescue Board and municipalities against the threats that actually develop in TFR's Europe. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_civil_protection_reward_tt:0 "Budget: €45 million, financed through public debt.\nNational cohesion: +3.\nDefense readiness: +5."
 TFR_EST_kallas_account_to_voters:0 "Present the Government's Record"
 TFR_EST_kallas_account_to_voters_desc:0 "Report the government's health, recovery, social and security programme to Parliament and the public. Explain costs, remaining commitments and the measures still needed under emergency conditions. The regular March 2023 election will decide the next mandate; this report calls no early vote. Requires a confirmed Reform-Centre cabinet with at least 51 coalition seats."
 TFR_EST_kallas_account_to_voters_reward_tt:0 "National cohesion: +4.\nGain 50 political power. Preserve the regular election calendar."
