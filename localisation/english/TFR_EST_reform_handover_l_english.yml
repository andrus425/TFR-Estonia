 TFR_EST_kristen_michal:0 "Kristen Michal"
 TFR_EST_kristen_michal_desc:0 "Kristen Michal has served as justice minister, minister of economic affairs and infrastructure, and climate minister. He succeeds Kaja Kallas as prime minister while Reform retains its parliamentary mandate. Existing coalition agreements and enacted policies continue under his cabinet."
 TFR_EST_pm_reform_michal:0 "$TFR_EST_kristen_michal$"
 TFR_EST_pm_reform_michal_desc:0 "Prime Minister: §H$TFR_EST_kristen_michal$§!\n[TFR_EST_hog_cabinet_status]\n\n$TFR_EST_kristen_michal_desc$"
 TFR_EST_hog_reform_michal:0 "Prime Minister: §H$TFR_EST_kristen_michal$§!\n[TFR_EST_hog_cabinet_status]\n\n\n\n\n\n\n   £GFX_idea_TFR_EST_pm_reform_michal\n\n\n\n\n\n\n\n\n-------------------------------------\n§L$TFR_EST_kristen_michal_desc$§!"
 TFR_EST_reform_handover_title:0 "Kallas Heads to Europe"
 TFR_EST_reform_handover_desc:0 "Kaja Kallas is leaving the prime minister's office after receiving a nomination to become the European Union's High Representative for Foreign Affairs and Security Policy. The appointment process will continue in Europe, while responsibility for Estonia's government passes to Kristen Michal.\n\nReform and its governing partners have agreed to continue their parliamentary programme under Michal. The president remains in office, the Riigikogu keeps its existing seats, and the cabinet's preparation for the European crisis continues. A change of prime minister within the governing majority does not require an election."
 TFR_EST_reform_handover_option:0 "Michal takes responsibility for the government."
 TFR_EST_reform_handover_tt:0 "§YKristen Michal§! succeeds §YKaja Kallas§! as prime minister. Preserve the coalition, parliamentary seats, election calendar, ministers and completed policies. Future Reform-led cabinets will be led by Michal."
